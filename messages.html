<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — oeper.dev</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://oeper.dev/icon.ico" type="image/x-icon">
<script src="./shared/theme-boot.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --md-sys-color-background: #111318;
    --md-sys-color-surface: #1a1c22;
    --md-sys-color-surface-variant: #2f353d;
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-on-primary: #062e6f;
    --md-sys-color-secondary-container: #33485d;
    --md-sys-color-on-secondary-container: #d2e4ff;
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c7c5;
    --md-sys-color-outline: #43474e;
    --md-sys-color-outline-variant: #8c9199;
    --md-sys-color-error: #ffb4ab;
  }

  body {
    min-height: 100vh;
    background-color: var(--md-sys-color-background);
    font-family: 'Google Sans', 'Roboto Flex', sans-serif;
    color: var(--md-sys-color-on-surface);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page { position: relative; max-width: 640px; margin: 0 auto; padding: 40px 24px 32px; min-height: 100vh; display: flex; flex-direction: column; }

  .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
  .header-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--md-sys-color-primary); text-decoration: none;
    font-family: 'Google Sans', 'Product Sans', sans-serif; font-size: 14px; font-weight: 500; transition: opacity 0.2s;
  }
  .header-link:hover { opacity: 0.8; }
  h1 { font-family: 'Google Sans', 'Product Sans', sans-serif; font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 400; margin-bottom: 20px; }

  .signin-note { text-align: center; padding: 80px 24px; color: var(--md-sys-color-on-surface-variant); }

  /* Inbox */
  .convo-list { display: flex; flex-direction: column; gap: 8px; }
  .convo-row {
    display: flex; align-items: center; gap: 14px; background: var(--md-sys-color-surface);
    border-radius: 18px; padding: 14px 16px; cursor: pointer; border: none; text-align: left; width: 100%;
    font-family: inherit; color: inherit; transition: background-color 0.2s;
  }
  .convo-row:hover { background-color: #21242c; }
  .convo-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--md-sys-color-surface-variant); flex-shrink: 0; }
  .convo-main { flex: 1; min-width: 0; }
  .convo-name { font-size: 15px; font-weight: 500; }
  .convo-preview { font-size: 13px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .convo-time { font-size: 12px; color: var(--md-sys-color-on-surface-variant); flex-shrink: 0; }

  .empty-note { text-align: center; color: var(--md-sys-color-on-surface-variant); font-size: 14px; padding: 60px 24px; }

  /* Thread */
  .thread-shell { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .thread-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .thread-header img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--md-sys-color-surface-variant); }
  .thread-header .name { font-size: 16px; font-weight: 500; }

  .msg-list { flex: 1; display: flex; flex-direction: column; padding-bottom: 16px; }
  .msg { display: flex; margin-bottom: 10px; }
  .msg.mine { justify-content: flex-end; }
  .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; background: var(--md-sys-color-surface); }
  .msg.mine .msg-bubble { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }

  .thread-inputbar {
    position: sticky; bottom: 16px; display: flex; align-items: flex-end; gap: 10px;
    background: var(--md-sys-color-surface); border: 1px solid var(--md-sys-color-outline);
    border-radius: 26px; padding: 8px 8px 8px 20px;
  }
  #msgInput { flex: 1; background: transparent; border: none; outline: none; resize: none; color: var(--md-sys-color-on-surface); font-family: inherit; font-size: 14px; line-height: 1.5; max-height: 120px; padding: 8px 0; }
  #msgInput::placeholder { color: var(--md-sys-color-on-surface-variant); }
  .send-btn { width: 38px; height: 38px; border-radius: 50%; border: none; flex-shrink: 0; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .send-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<div class="page">
  <div class="header-container">
    <a href="https://oeper.dev/forum.html" class="header-link" id="backLink">
      <span class="material-symbols-rounded">arrow_back</span>
      <span id="backLinkText">back to feed</span>
    </a>
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="/settings" class="header-link" title="Settings"><span class="material-symbols-rounded">settings</span></a>
      <div id="accountBar"></div>
    </div>
  </div>

  <div id="content"><div class="empty-note">Loading…</div></div>
</div>

<script type="module">
import {
  mountAccountBar, getCurrentUser, onAccountChange, auth, db, getProfile, handleOf,
} from './shared/account.js?v=5';
import { mountFooter } from './shared/footer.js';
import {
  collection, collectionGroup, doc, getDoc, setDoc, addDoc, query, where, orderBy, onSnapshot, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

mountAccountBar(document.getElementById('accountBar'));
mountFooter();

function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(date) {
  const s = Math.floor((Date.now() - date.getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 2592000) return Math.floor(s / 86400) + 'd';
  return date.toLocaleDateString();
}
function conversationId(emailA, emailB) {
  return [emailA, emailB].sort().join('__');
}

const content = document.getElementById('content');
let unsubConvos = null;
let unsubMessages = null;

onAccountChange(user => {
  if (unsubConvos) { unsubConvos(); unsubConvos = null; }
  if (unsubMessages) { unsubMessages(); unsubMessages = null; }
  if (!user) {
    content.innerHTML = '<div class="signin-note">Sign in to chat.</div>';
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const toHandle = params.get('to');
  if (toHandle) {
    window.history.replaceState({}, '', '/messages.html');
    openByHandle(toHandle, user);
  } else {
    showInbox(user);
  }
});

async function openByHandle(handle, user) {
  content.innerHTML = '<div class="empty-note">Loading…</div>';
  try {
    const snap = await getDoc(doc(db, 'handles', handle));
    if (!snap.exists()) { content.innerHTML = `<div class="empty-note">No profile found for @${escHtml(handle)}.</div>`; return; }
    const otherEmail = snap.data().email;
    if (otherEmail === user.email) { content.innerHTML = '<div class="empty-note">You can\'t message yourself.</div>'; return; }
    await openThread(otherEmail, user);
  } catch (err) {
    content.innerHTML = `<div class="empty-note">Could not open conversation: ${escHtml(err.message)}</div>`;
  }
}

function showInbox(user) {
  document.getElementById('backLink').href = 'https://oeper.dev/forum.html';
  document.getElementById('backLinkText').textContent = 'back to feed';
  content.innerHTML = '<div class="empty-note">Loading…</div>';

  unsubConvos = onSnapshot(
    query(collection(db, 'conversations'), where('participants', 'array-contains', user.email)),
    async snap => {
      const convos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      convos.sort((a, b) => (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0));

      if (convos.length === 0) {
        content.innerHTML = '<div class="empty-note">No chats yet. Start one from someone\'s profile page.</div>';
        return;
      }

      const rows = await Promise.all(convos.map(async c => {
        const otherEmail = c.participants.find(p => p !== user.email);
        const profile = getProfile(otherEmail, null, null);
        return { c, otherEmail, profile };
      }));

      content.innerHTML = `<div class="convo-list">${rows.map(({ c, otherEmail, profile }) => `
        <button class="convo-row" data-email="${escHtml(otherEmail)}">
          <img class="convo-avatar" src="${profile.photo || ''}" alt="">
          <div class="convo-main">
            <div class="convo-name">${escHtml(profile.name)}</div>
            <div class="convo-preview">${escHtml(c.lastMessage || '')}</div>
          </div>
          <div class="convo-time">${c.updatedAt?.toDate ? timeAgo(c.updatedAt.toDate()) : ''}</div>
        </button>
      `).join('')}</div>`;

      content.querySelectorAll('.convo-row').forEach(btn => {
        btn.addEventListener('click', () => openThread(btn.dataset.email, user));
      });
    },
    err => { content.innerHTML = `<div class="empty-note">Could not load chats: ${escHtml(err.message)}</div>`; }
  );
}

async function openThread(otherEmail, user) {
  if (unsubConvos) { unsubConvos(); unsubConvos = null; }
  if (unsubMessages) { unsubMessages(); unsubMessages = null; }

  document.getElementById('backLink').href = '#';
  document.getElementById('backLinkText').textContent = 'back to chats';
  document.getElementById('backLink').onclick = e => { e.preventDefault(); showInbox(user); };

  const convoId = conversationId(user.email, otherEmail);
  const otherProfile = getProfile(otherEmail, null, null);
  const otherHandle = handleOf(otherEmail);

  content.innerHTML = `
    <div class="thread-shell">
      <div class="thread-header">
        ${otherHandle
          ? `<a href="/profile.html?u=${encodeURIComponent(otherHandle)}"><img src="${otherProfile.photo || ''}" alt=""></a>`
          : `<img src="${otherProfile.photo || ''}" alt="">`}
        <span class="name">${escHtml(otherProfile.name)}</span>
      </div>
      <div class="msg-list" id="msgList"></div>
      <div class="thread-inputbar">
        <textarea id="msgInput" placeholder="Message…" rows="1"></textarea>
        <button class="send-btn" id="sendMsgBtn"><span class="material-symbols-rounded">arrow_upward</span></button>
      </div>
    </div>
  `;

  const msgList = document.getElementById('msgList');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendMsgBtn');

  unsubMessages = onSnapshot(
    query(collection(db, 'conversations', convoId, 'messages'), orderBy('createdAt', 'asc')),
    snap => {
      const msgs = snap.docs.map(d => d.data());
      msgList.innerHTML = msgs.map(m => `
        <div class="msg ${m.senderEmail === user.email ? 'mine' : ''}">
          <div class="msg-bubble">${escHtml(m.text)}</div>
        </div>
      `).join('');
      msgList.scrollIntoView({ block: 'end' });
    },
    () => { /* conversation doc doesn't exist yet — no messages, that's fine */ }
  );

  async function send() {
    const text = msgInput.value.trim();
    if (!text) return;
    msgInput.value = '';
    sendBtn.disabled = true;
    try {
      const convoRef = doc(db, 'conversations', convoId);
      const convoSnap = await getDoc(convoRef);
      if (!convoSnap.exists()) {
        await setDoc(convoRef, {
          participants: [user.email, otherEmail],
          lastMessage: text.slice(0, 200),
          lastMessageAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        });
      } else {
        await setDoc(convoRef, { lastMessage: text.slice(0, 200), lastMessageAt: serverTimestamp(), updatedAt: serverTimestamp() }, { merge: true });
      }
      await addDoc(collection(db, 'conversations', convoId, 'messages'), {
        senderEmail: user.email,
        text,
        createdAt: serverTimestamp(),
      });
    } catch (err) {
      alert('Could not send: ' + err.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', send);
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
}
</script>
</body>
</html>
