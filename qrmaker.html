<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Maker — oeper.dev</title>
<meta name="description" content="Free QR code generator — URLs, text, WiFi, contacts, email, phone">
<meta property="og:title" content="QR Maker — oeper.dev">
<meta property="og:description" content="Free QR code generator — URLs, text, WiFi, contacts, email, phone">
<meta property="og:url" content="https://oeper.dev/qrmaker">
<meta property="og:type" content="website">
<link rel="icon" href="https://oeper.dev/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="https://oeper.dev/icon.ico?v=3" type="image/x-icon">
<script src="./shared/theme-boot.js?v=8"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Freehand&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--md-sys-color-primary, #a8c7fa); outline-offset: 2px; }

  :root {
    --md-sys-color-background: #111318;
    --md-sys-color-surface: #1a1c22;
    --md-sys-color-surface-variant: #2f353d;
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-on-primary: #062e6f;
    --md-sys-color-secondary-container: #33485d;
    --md-sys-color-on-secondary-container: #d2e4ff;
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c7c5;
    --md-sys-color-outline: #43474e;
    --md-sys-color-outline-variant: #8c9199;
    --md-sys-color-error: #ffb4ab;
  }

  body {
    min-height: 100vh;
    background-color: var(--md-sys-color-background);
    font-family: var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif);
    background-image: var(--oe-bg-image, none);
    color: var(--md-sys-color-on-surface);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page { position: relative; max-width: 960px; margin: 0 auto; padding: 56px 24px 100px; }

  .header { margin-bottom: 28px; }
  .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
  .header-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--md-sys-color-primary); text-decoration: none;
    font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 14px; font-weight: 500; transition: opacity 0.2s;
  }
  .header-link:hover { opacity: 0.8; }
  .header-link:visited { color: var(--md-sys-color-primary); }
  .header h1 { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: clamp(2.5rem, 6vw, 3.5rem); font-weight: 400; margin-bottom: 12px; letter-spacing: -0.5px; }
  .header p { color: var(--md-sys-color-on-surface-variant); font-size: 16px; max-width: 500px; line-height: 1.5; }

  .type-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--md-sys-color-outline);
    border-radius: 100px; padding: 9px 18px; font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 14px; font-weight: 500;
    color: var(--md-sys-color-on-surface-variant); cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
  }
  .pill .material-symbols-rounded { font-size: 18px; }
  .pill:hover { background-color: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }
  .pill.active { background-color: var(--md-sys-color-secondary-container); border-color: transparent; color: var(--md-sys-color-on-secondary-container); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--md-sys-color-surface); border-radius: 24px; padding: 24px; }
  .card h2 { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 18px; font-weight: 500; margin-bottom: 18px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: var(--md-sys-color-on-surface-variant); margin-bottom: 6px; }
  .field input[type="text"], .field input[type="url"], .field input[type="tel"], .field input[type="email"], .field textarea {
    width: 100%; background: var(--md-sys-color-background); border: 1px solid var(--md-sys-color-outline);
    border-radius: 12px; padding: 12px 14px; color: var(--md-sys-color-on-surface); font-size: 14px; font-family: inherit; outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field textarea:focus { border-color: var(--md-sys-color-primary); }
  .field textarea { resize: vertical; min-height: 80px; }
  .field .oe-dropdown-btn { background: var(--md-sys-color-background); border-radius: 12px; padding: 12px 14px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field .hint { font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 4px; }

  .customize-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--md-sys-state-hover); }
  .color-field { display: flex; align-items: center; gap: 10px; }
  .color-field input[type="color"] { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--md-sys-color-outline); background: none; cursor: pointer; padding: 2px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; padding: 12px 20px;
    border-radius: 100px; border: 1px solid var(--md-sys-color-outline); background: transparent;
    color: var(--md-sys-color-on-surface); cursor: pointer; font-family: inherit; width: 100%;
  }
  .btn:hover { background-color: var(--md-sys-state-hover); }
  .btn.primary { background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border-color: transparent; }
  .btn.primary:hover { opacity: 0.9; }

  .preview-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .qr-box {
    width: 100%; aspect-ratio: 1; max-width: 320px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
    background: #fff; padding: 20px;
  }
  .qr-box.empty { background: var(--md-sys-color-surface-variant); }
  .qr-box canvas { max-width: 100%; max-height: 100%; }
  .qr-empty-note { color: var(--md-sys-color-on-surface-variant); text-align: center; font-size: 13px; padding: 0 20px; }
  .qr-empty-note .material-symbols-rounded { font-size: 40px; opacity: 0.5; margin-bottom: 10px; display: block; }
  .action-row { display: flex; gap: 10px; width: 100%; max-width: 320px; }
</style>
</head>
<body>

<div class="page">
  <header class="header">
    <h1>QR Maker</h1>
  </header>

  <div class="type-pills" id="typePills">
    <button class="pill active" data-type="url"><span class="material-symbols-rounded">link</span> URL</button>
    <button class="pill" data-type="text"><span class="material-symbols-rounded">notes</span> Text</button>
    <button class="pill" data-type="wifi"><span class="material-symbols-rounded">wifi</span> WiFi</button>
    <button class="pill" data-type="contact"><span class="material-symbols-rounded">person</span> Contact</button>
    <button class="pill" data-type="email"><span class="material-symbols-rounded">mail</span> Email</button>
    <button class="pill" data-type="phone"><span class="material-symbols-rounded">call</span> Phone</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2 id="formTitle">Website URL</h2>

      <div class="input-view" id="view-url">
        <div class="field"><label>URL</label><input type="url" id="urlInput" placeholder="example.com"><div class="hint">https:// added automatically if missing.</div></div>
      </div>

      <div class="input-view" id="view-text" style="display:none;">
        <div class="field"><label>Text</label><textarea id="textInput" placeholder="Anything you want encoded…" rows="4"></textarea></div>
      </div>

      <div class="input-view" id="view-wifi" style="display:none;">
        <div class="field"><label>Network name (SSID)</label><input type="text" id="wifiSsid"></div>
        <div class="field"><label>Password</label><input type="text" id="wifiPass"></div>
        <div class="field">
          <label>Security</label>
          <div id="wifiSecuritySlot"></div>
        </div>
      </div>

      <div class="input-view" id="view-contact" style="display:none;">
        <div class="field-row">
          <div class="field"><label>First name</label><input type="text" id="cFirst"></div>
          <div class="field"><label>Last name</label><input type="text" id="cLast"></div>
        </div>
        <div class="field"><label>Phone</label><input type="tel" id="cPhone"></div>
        <div class="field"><label>Email</label><input type="email" id="cEmail"></div>
        <div class="field"><label>Organization</label><input type="text" id="cOrg"></div>
      </div>

      <div class="input-view" id="view-email" style="display:none;">
        <div class="field"><label>To</label><input type="email" id="eTo"></div>
        <div class="field"><label>Subject</label><input type="text" id="eSubject"></div>
        <div class="field"><label>Body</label><textarea id="eBody" rows="3"></textarea></div>
      </div>

      <div class="input-view" id="view-phone" style="display:none;">
        <div class="field"><label>Phone number</label><input type="tel" id="pNumber" placeholder="+60123456789"></div>
      </div>

      <div class="customize-row">
        <div class="field color-field">
          <input type="color" id="fgColor" value="#000000">
          <div><label style="margin:0;">Dot color</label></div>
        </div>
        <div class="field color-field">
          <input type="color" id="bgColor" value="#ffffff">
          <div><label style="margin:0;">Background</label></div>
        </div>
        <div class="field">
          <label>Error correction</label>
          <div id="errorLevelSlot"></div>
        </div>
        <div class="field">
          <label>Size</label>
          <div id="qrSizeSlot"></div>
        </div>
      </div>

      <button class="btn" id="clearBtn" style="margin-top:8px;">Clear all fields</button>
    </div>

    <div class="card">
      <h2>Generated QR code</h2>
      <div class="preview-wrap">
        <div class="qr-box empty" id="qrBox">
          <div class="qr-empty-note" id="qrEmptyNote">
            <span class="material-symbols-rounded">qr_code_2</span>
            Fill in the form to generate
          </div>
          <canvas id="qrCanvas" style="display:none;"></canvas>
        </div>
        <div class="action-row" id="actionRow" style="display:none;">
          <button class="btn primary" id="downloadBtn"><span class="material-symbols-rounded" style="font-size:18px;">download</span> Download</button>
          <button class="btn" id="copyBtn"><span class="material-symbols-rounded" style="font-size:18px;">content_copy</span> <span id="copyBtnText">Copy data</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { mountTopNav } from './shared/topnav.js?v=13';
mountTopNav();
</script>
<script type="module">
import { createDropdown } from './shared/dropdown.js?v=1';
let currentType = 'url';
const qrCanvas = document.getElementById('qrCanvas');
const qrBox = document.getElementById('qrBox');
const qrEmptyNote = document.getElementById('qrEmptyNote');
const actionRow = document.getElementById('actionRow');

const wifiSecurityDropdown = createDropdown([
  { value: 'WPA', label: 'WPA/WPA2' },
  { value: 'WEP', label: 'WEP' },
  { value: 'nopass', label: 'None (open network)' },
], { value: 'WPA', onChange: () => updateQR() });
document.getElementById('wifiSecuritySlot').appendChild(wifiSecurityDropdown.el);

const errorLevelDropdown = createDropdown([
  { value: 'L', label: 'Low (L)' },
  { value: 'M', label: 'Medium (M)' },
  { value: 'Q', label: 'Quartile (Q)' },
  { value: 'H', label: 'High (H)' },
], { value: 'M', onChange: () => updateQR() });
document.getElementById('errorLevelSlot').appendChild(errorLevelDropdown.el);

const qrSizeDropdown = createDropdown([
  { value: '200', label: 'Small (200px)' },
  { value: '300', label: 'Medium (300px)' },
  { value: '500', label: 'Large (500px)' },
  { value: '800', label: 'Extra large (800px)' },
], { value: '300', onChange: () => updateQR() });
document.getElementById('qrSizeSlot').appendChild(qrSizeDropdown.el);

const FORM_TITLES = {
  url: 'Website URL', text: 'Text', wifi: 'WiFi network', contact: 'Contact card', email: 'Email', phone: 'Phone number',
};

document.querySelectorAll('#typePills .pill').forEach(pill => {
  pill.addEventListener('click', () => {
    currentType = pill.dataset.type;
    document.querySelectorAll('#typePills .pill').forEach(p => p.classList.toggle('active', p === pill));
    document.querySelectorAll('.input-view').forEach(v => v.style.display = 'none');
    document.getElementById('view-' + currentType).style.display = 'block';
    document.getElementById('formTitle').textContent = FORM_TITLES[currentType];
    updateQR();
  });
});

function buildData() {
  if (currentType === 'url') {
    let v = document.getElementById('urlInput').value.trim();
    if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
    return v;
  }
  if (currentType === 'text') {
    return document.getElementById('textInput').value;
  }
  if (currentType === 'wifi') {
    const ssid = document.getElementById('wifiSsid').value;
    const pass = document.getElementById('wifiPass').value;
    const sec = wifiSecurityDropdown.getValue();
    if (!ssid) return '';
    return `WIFI:T:${sec};S:${ssid};P:${sec === 'nopass' ? '' : pass};;`;
  }
  if (currentType === 'contact') {
    const fn = document.getElementById('cFirst').value;
    const ln = document.getElementById('cLast').value;
    const ph = document.getElementById('cPhone').value;
    const em = document.getElementById('cEmail').value;
    const og = document.getElementById('cOrg').value;
    if (!fn && !ln && !ph && !em) return '';
    return `BEGIN:VCARD\nVERSION:3.0\nFN:${fn} ${ln}\nN:${ln};${fn};;;\nORG:${og}\nTEL:${ph}\nEMAIL:${em}\nEND:VCARD`;
  }
  if (currentType === 'email') {
    const to = document.getElementById('eTo').value;
    if (!to) return '';
    const subject = encodeURIComponent(document.getElementById('eSubject').value);
    const body = encodeURIComponent(document.getElementById('eBody').value);
    return `mailto:${to}?subject=${subject}&body=${body}`;
  }
  if (currentType === 'phone') {
    const num = document.getElementById('pNumber').value.trim();
    return num ? `tel:${num}` : '';
  }
  return '';
}

function updateQR() {
  const data = buildData();
  const fg = document.getElementById('fgColor').value;
  const bg = document.getElementById('bgColor').value;
  const level = errorLevelDropdown.getValue();
  const size = Math.min(Number(qrSizeDropdown.getValue()), 300); // canvas capped for on-screen preview

  if (data.trim()) {
    qrEmptyNote.style.display = 'none';
    qrCanvas.style.display = 'block';
    actionRow.style.display = 'flex';
    qrBox.classList.remove('empty');
    qrBox.style.background = bg;
    new QRious({ element: qrCanvas, value: data, size, level, foreground: fg, background: bg });
  } else {
    qrEmptyNote.style.display = 'block';
    qrCanvas.style.display = 'none';
    actionRow.style.display = 'none';
    qrBox.classList.add('empty');
    qrBox.style.background = '';
  }
}

document.querySelectorAll('.input-view input, .input-view textarea').forEach(el => {
  el.addEventListener('input', updateQR);
  el.addEventListener('change', updateQR);
});
['fgColor', 'bgColor'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateQR);
  document.getElementById(id).addEventListener('change', updateQR);
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const data = buildData();
  const fg = document.getElementById('fgColor').value;
  const bg = document.getElementById('bgColor').value;
  const level = errorLevelDropdown.getValue();
  const size = Number(qrSizeDropdown.getValue());
  const fullSizeCanvas = document.createElement('canvas');
  new QRious({ element: fullSizeCanvas, value: data, size, level, foreground: fg, background: bg });
  const link = document.createElement('a');
  link.download = `qrcode-${currentType}.png`;
  link.href = fullSizeCanvas.toDataURL();
  link.click();
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const data = buildData();
  navigator.clipboard.writeText(data).then(() => {
    const label = document.getElementById('copyBtnText');
    label.textContent = 'Copied!';
    setTimeout(() => { label.textContent = 'Copy data'; }, 2000);
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.querySelectorAll('.input-view input[type="text"], .input-view input[type="url"], .input-view input[type="tel"], .input-view input[type="email"], .input-view textarea').forEach(el => el.value = '');
  updateQR();
});
</script>
</body>
</html>
