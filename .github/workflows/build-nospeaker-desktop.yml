name: No speaker desktop

# Builds the No speaker app for Windows and macOS (desktop/nospeaker) and publishes it to the release "nospeaker-desktop-latest".
# Run it from the Actions tab (Run workflow) or push a tag like nospeaker-desktop-v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['nospeaker-desktop-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable
          - os: macos-latest
            args: --mac dmg zip --arm64 --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/nospeaker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: No-speaker-${{ matrix.os }}
          path: |
            desktop/nospeaker/dist/*.exe
            desktop/nospeaker/dist/*.dmg
            desktop/nospeaker/dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish to the nospeaker-desktop-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release view nospeaker-desktop-latest >/dev/null 2>&1 || gh release create nospeaker-desktop-latest --title "No speaker for Windows and macOS" --notes "Latest desktop builds of No speaker." --latest=false
          gh release upload nospeaker-desktop-latest out/* --clobber
