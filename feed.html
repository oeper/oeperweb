const STORY_LIFETIME_MS = 24 * 60 * 60 * 1000;
const STORY_SEEN_KEY = 'oe-seen-stories';

function initStories() {
  const bar = document.getElementById('storiesBar');
  const fileInput = document.getElementById('storyFileInput');
  let allStories = [];

  onSnapshot(collection(db, 'stories'), snap => {
    const now = Date.now();
    allStories = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(s => s.expiresAt && s.expiresAt.toMillis && s.expiresAt.toMillis() > now)
      .sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
    renderStoriesBar();
    Promise.all([...new Set(allStories.map(s => s.authorEmail))].map(ensureProfileLoaded)).then(renderStoriesBar);
  }, () => { bar.innerHTML = ''; });

  function seenIds() {
    try { return new Set(JSON.parse(localStorage.getItem(STORY_SEEN_KEY) || '[]')); } catch { return new Set(); }
  }
  function markSeen(id) {
    const set = seenIds();
    set.add(id);
    localStorage.setItem(STORY_SEEN_KEY, JSON.stringify([...set].slice(-500)));
  }

  function renderStoriesBar() {
    const user = getCurrentUser();
    const byAuthor = new Map();
    allStories.forEach(s => {
      if (!byAuthor.has(s.authorEmail)) byAuthor.set(s.authorEmail, []);
      byAuthor.get(s.authorEmail).push(s);
    });
    const seen = seenIds();

    let html = '';
    if (user) {
      html += `
        <div class="story-item story-add" id="storyAddBtn">
          <div class="story-ring"><span class="material-symbols-rounded">add</span></div>
          <div class="story-label">Your story</div>
        </div>
      `;
    }
    for (const [email, stories] of byAuthor) {
      const profile = getProfile(email, stories[0].authorName, stories[0].authorPhoto);
      const allSeen = stories.every(s => seen.has(s.id));
      html += `
        <div class="story-item" data-author="${escHtml(email)}">
          <div class="story-ring ${allSeen ? 'seen' : ''}"><img src="${profile.photo || ''}" alt=""></div>
          <div class="story-label">${escHtml(profile.name)}</div>
        </div>
      `;
    }
    bar.innerHTML = html;

    const addBtn = document.getElementById('storyAddBtn');
    if (addBtn) addBtn.addEventListener('click', () => fileInput.click());
    bar.querySelectorAll('.story-item[data-author]').forEach(el => {
      el.addEventListener('click', () => openStoryViewer(byAuthor.get(el.dataset.author)));
    });
  }

  fileInput.addEventListener('change', async () => {
    const user = getCurrentUser();
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!user || !file) return;
    if (file.size > MAX_IMAGE_BYTES) { showToast(`File must be under ${Math.round(MAX_IMAGE_BYTES/1024/1024)}MB`); return; }
    const mediaType = file.type.startsWith('video/') ? 'video' : 'image';
    try {
      const url = await uploadFile(file, '/upload', undefined, frac => showToast(`Uploading… ${Math.round(frac * 100)}%`));
      const profile = getProfile(user.email, user.displayName, user.photoURL);
      await addDoc(collection(db, 'stories'), {
        authorEmail: user.email,
        authorName: profile.name,
        authorPhoto: profile.photo,
        mediaUrl: url,
        mediaType,
        createdAt: serverTimestamp(),
        expiresAt: Timestamp.fromMillis(Date.now() + STORY_LIFETIME_MS),
      });
      showToast('story posted — visible for 24h');
    } catch (err) {
      showToast('Could not post story: ' + err.message);
    }
  });

  // ── Viewer ──
  const viewer = document.getElementById('storyViewer');
  const imgEl = document.getElementById('storyViewerImg');
  const videoEl = document.getElementById('storyViewerVideo');
  const avatarEl = document.getElementById('storyViewerAvatar');
  const nameEl = document.getElementById('storyViewerName');
  const progressRow = document.getElementById('storyProgressRow');
  let currentSet = [];
  let currentIndex = 0;
  let advanceTimer = null;

  function openStoryViewer(stories) {
    currentSet = stories;
    currentIndex = 0;
    progressRow.innerHTML = stories.map(() => '<div class="story-progress-track"><div class="story-progress-fill"></div></div>').join('');
    viewer.classList.add('open');
    showStory(0);
  }
  function closeStoryViewer() {
    viewer.classList.remove('open');
    videoEl.pause();
    clearTimeout(advanceTimer);
  }
  function showStory(i) {
    clearTimeout(advanceTimer);
    if (i < 0) { closeStoryViewer(); return; }
    if (i >= currentSet.length) { closeStoryViewer(); return; }
    currentIndex = i;
    const s = currentSet[i];
    markSeen(s.id);
    const profile = getProfile(s.authorEmail, s.authorName, s.authorPhoto);
    avatarEl.src = profile.photo || '';
    nameEl.textContent = profile.name;

    const fills = progressRow.querySelectorAll('.story-progress-fill');
    fills.forEach((f, idx) => { f.style.transition = 'none'; f.style.width = idx < i ? '100%' : '0%'; });
    void progressRow.offsetWidth;

    if (s.mediaType === 'video') {
      imgEl.style.display = 'none';
      videoEl.style.display = 'block';
      videoEl.src = s.mediaUrl;
      videoEl.currentTime = 0;
      videoEl.play();
      videoEl.onloadedmetadata = () => animateFill(i, Math.min(videoEl.duration * 1000, 15000));
      videoEl.onended = () => showStory(i + 1);
    } else {
      videoEl.pause();
      videoEl.style.display = 'none';
      imgEl.style.display = 'block';
      imgEl.src = s.mediaUrl;
      animateFill(i, 5000);
      advanceTimer = setTimeout(() => showStory(i + 1), 5000);
    }
  }
  function animateFill(i, durationMs) {
    const fills = progressRow.querySelectorAll('.story-progress-fill');
    const fill = fills[i];
    if (!fill) return;
    requestAnimationFrame(() => {
      fill.style.transition = `width ${durationMs}ms linear`;
      fill.style.width = '100%';
    });
  }
  function storyUrl(id) {
    const url = new URL(window.location.href.split('?')[0]);
    url.searchParams.set('story', id);
    return url.toString();
  }

  document.getElementById('storyShareBtn').addEventListener('click', () => {
    const s = currentSet[currentIndex];
    if (s) copyLink(storyUrl(s.id), 'Story link');
  });
  document.getElementById('storyReportBtn').addEventListener('click', () => {
    const s = currentSet[currentIndex];
    if (s) reportItem('story', null, null, s.id, storyUrl(s.id));
  });

  document.getElementById('storyViewerClose').addEventListener('click', closeStoryViewer);
  document.getElementById('storyPrevZone').addEventListener('click', () => showStory(currentIndex - 1));
  document.getElementById('storyNextZone').addEventListener('click', () => showStory(currentIndex + 1));
  viewer.addEventListener('click', e => { if (e.target === viewer) closeStoryViewer(); });
}

function runForum() {
  let posts = [];
  let myBanStatus = null;
  const unsubComments = { current: null };

  function currentUser() { return getCurrentUser(); }
  function isOwner(email) { return isOwnerEmail(email); }
  function canModerate(authorEmail) {
    const u = currentUser();
    return u && (u.email === authorEmail || isOwner(u.email));
  }
  function isBanned() { return !!myBanStatus; }
  function nameOf(item) { return getProfile(item.authorEmail, item.authorName, item.authorPhoto).name; }
  function photoOf(item) { return getProfile(item.authorEmail, item.authorName, item.authorPhoto).photo; }
  // Links to a profile by @handle only — never by email. If this author
  // hasn't been assigned a handle yet (hasn't signed in since that shipped),
  // falls back to plain non-clickable text rather than exposing their email.
  function authorLinkHtml(item, innerHtml, extraAttrs) {
    const badge = officialBadgeHtml(item.authorEmail);
    const handle = handleOf(item.authorEmail);
    if (!handle) return `<span class="author-link">${innerHtml}${badge}</span>`;
    return `<a href="/profile?u=${encodeURIComponent(handle)}" class="author-link" ${extraAttrs || ''}>${innerHtml}${badge}</a>`;
  }

  const VIEWED_KEY = 'oe-viewed-posts';
  function bumpViews(postId) {
    if (!currentUser()) return; // views require sign-in, same as every other post write
    let seen;
    try { seen = JSON.parse(localStorage.getItem(VIEWED_KEY) || '[]'); } catch { seen = []; }
    if (seen.includes(postId)) return;
    seen.push(postId);
    if (seen.length > 500) seen = seen.slice(-500); // keep the dedup list from growing forever
    localStorage.setItem(VIEWED_KEY, JSON.stringify(seen));
    updateDoc(postRef(postId), { views: increment(1) }).catch(() => {});
  }

  async function refreshBanStatus() {
    const u = currentUser();
    if (!u) { myBanStatus = null; return; }
    try {
      const snap = await getDoc(doc(db, 'bans', u.email));
      myBanStatus = snap.exists() ? snap.data() : null;
    } catch { myBanStatus = null; }
  }

  onAccountChange(async user => {
    renderList();
    if (user) {
      await Promise.all([ensureProfileLoaded(user.email), refreshBanStatus()]);
      renderList();
    } else {
      myBanStatus = null;
    }
    if (openPostId) openThread(openPostId, { keepScroll: true });
  });

  async function banUser(email) {
    const u = currentUser();
    if (!u || !isOwner(u.email)) return;
    if (!(await oeConfirm(`Ban ${email}? They won't be able to post, comment, or vote anymore.`, { danger: true }))) return;
    try {
      await setDoc(doc(db, 'bans', email), { bannedAt: serverTimestamp(), bannedBy: u.email });
      showToast('user banned');
    } catch (err) { showToast('could not ban: ' + err.message); }
  }


  async function deletePost(postId) {
    if (!(await oeConfirm('Delete this post? This cannot be undone.', { danger: true }))) return;
    try {
      await deleteDoc(postRef(postId));
      if (openPostId === postId) closeThread();
      showToast('post deleted');
    } catch (err) { showToast('could not delete: ' + err.message); }
  }

  async function deleteCommentItem(postId, commentId) {
    if (!(await oeConfirm('Delete this comment?', { danger: true }))) return;
    try {
      await deleteDoc(doc(db, 'posts', postId, 'comments', commentId));
      await updateDoc(postRef(postId), { commentCount: Math.max(0, (posts.find(p=>p.id===postId)?.commentCount||1) - 1) });
    } catch (err) { showToast('could not delete: ' + err.message); }
  }

  function menuItemsForPost(p) {
    const u = currentUser();
    const items = [
      { label: 'share', icon: 'link', onClick: () => copyLink(postUrl(p.id), 'Post link') },
      { label: 'report', icon: 'flag', onClick: () => reportItem('post', p.id, null) },
    ];
    if (u && p.authorEmail === u.email) {
      items.push({ label: 'edit post', icon: 'edit', onClick: () => openPostModal(p) });
    }
    if (u && isOwner(u.email) && p.authorEmail !== u.email) {
      items.push({ label: 'ban user', icon: 'block', dangerous: true, onClick: () => banUser(p.authorEmail) });
    }
    if (canModerate(p.authorEmail)) {
      items.push({ label: 'delete post', icon: 'delete', dangerous: true, onClick: () => deletePost(p.id) });
    }
    return items;
  }

  function menuItemsForComment(c, postId) {
    const u = currentUser();
    const items = [
      { label: 'share', icon: 'link', onClick: () => copyLink(commentUrl(postId, c.id), 'Comment link') },
      { label: 'report', icon: 'flag', onClick: () => reportItem('comment', postId, c.id) },
    ];
    if (u && isOwner(u.email) && c.authorEmail !== u.email) {
      items.push({ label: 'ban user', icon: 'block', dangerous: true, onClick: () => banUser(c.authorEmail) });
    }
    if (canModerate(c.authorEmail)) {
      items.push({ label: 'delete comment', icon: 'delete', dangerous: true, onClick: () => deleteCommentItem(postId, c.id) });
    }
    return items;
  }

  // ── File attach widgets (any file type, not just images) ────
  function filePreviewHtml(f) {
    if (f.type.startsWith('image/')) return `<img src="${URL.createObjectURL(f)}" alt="">`;
    return `
      <span class="file-chip-preview">
        <span class="material-symbols-rounded">draft</span>
        <span class="file-chip-name">${escHtml(f.name)}</span>
      </span>
    `;
  }

  // Post form: up to MAX_POST_IMAGES.
  function createMultiImageAttach(container, maxCount) {
    let files = [];
    let existingUrls = []; // already-uploaded URLs when editing a post
    function totalCount() { return files.length + existingUrls.length; }
    function render() {
      const canAddMore = totalCount() < maxCount;
      container.innerHTML = `
        ${existingUrls.map((url, i) => `
          <div class="image-preview-wrap" data-i="${i}">
            ${/\.(jpe?g|png|gif|webp|bmp|svg|avif)$/i.test(url)
              ? `<img src="${url}" alt="">`
              : `<span class="file-chip-preview"><span class="material-symbols-rounded">draft</span><span class="file-chip-name">${escHtml(fileNameFromUrl(url))}</span></span>`}
            <button type="button" class="image-preview-remove" data-remove-existing="${i}"><span class="material-symbols-rounded">close</span></button>
          </div>
        `).join('')}
        ${files.map((f, i) => `
          <div class="image-preview-wrap" data-i="${i}">
            ${filePreviewHtml(f)}
            <button type="button" class="image-preview-remove" data-remove="${i}"><span class="material-symbols-rounded">close</span></button>
          </div>
        `).join('')}
        ${canAddMore ? `
          <label class="image-attach-btn">
            <span class="material-symbols-rounded" style="font-size:16px;">attach_file</span> Add file (${totalCount()}/${maxCount})
            <input type="file" multiple>
          </label>
        ` : ''}
      `;
      container.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => { files.splice(+btn.dataset.remove, 1); render(); });
      });
      container.querySelectorAll('[data-remove-existing]').forEach(btn => {
        btn.addEventListener('click', () => { existingUrls.splice(+btn.dataset.removeExisting, 1); render(); });
      });
      const input = container.querySelector('input[type="file"]');
      if (input) {
        input.addEventListener('change', e => {
          for (const f of [...e.target.files]) {
            if (totalCount() >= maxCount) { showToast(`Up to ${maxCount} files per post`); break; }
            if (f.size > MAX_IMAGE_BYTES) { showToast(`Each file must be under ${Math.round(MAX_IMAGE_BYTES/1024/1024)}MB`); continue; }
            files.push(f);
          }
          render();
        });
      }
    }
    render();
    return {
      getFiles: () => files,
      getExistingUrls: () => existingUrls,
      setExistingUrls: urls => { existingUrls = [...(urls || [])]; render(); },
      reset: () => { files = []; existingUrls = []; render(); },
    };
  }

  // Comment form: single file.
  function createImageAttach(container) {
    let file = null;
    function render() {
      if (file) {
        container.innerHTML = `
          <div class="image-preview-wrap">
            ${filePreviewHtml(file)}
            <button type="button" class="image-preview-remove" title="Remove"><span class="material-symbols-rounded">close</span></button>
          </div>
        `;
        container.querySelector('.image-preview-remove').addEventListener('click', () => { file = null; render(); });
      } else {
        container.innerHTML = `
          <label class="image-attach-btn">
            <span class="material-symbols-rounded" style="font-size:16px;">attach_file</span> Attach file
            <input type="file">
          </label>
        `;
        container.querySelector('input[type="file"]').addEventListener('change', e => {
          const f = e.target.files[0];
          if (!f) return;
          if (f.size > MAX_IMAGE_BYTES) { showToast(`File must be under ${Math.round(MAX_IMAGE_BYTES/1024/1024)}MB`); return; }
          file = f;
          render();
        });
      }
    }
    render();
    return { getFile: () => file, reset: () => { file = null; render(); } };
  }

  async function uploadFilesIfAny(files) {
    if (!files || !files.length) return [];
    const urls = [];
    for (let i = 0; i < files.length; i++) {
      const prefix = files.length > 1 ? `Uploading image ${i + 1}/${files.length}… ` : 'Uploading… ';
      urls.push(await uploadFile(files[i], undefined, undefined, frac => showToast(`${prefix}${Math.round(frac * 100)}%`)));
    }
    return urls;
  }

  // ── Tag pills ──────────────────────────────────────────────
  let knownTags = [...DEFAULT_TAGS];
  function tagInfo(id) { return knownTags.find(t => t.id === id) || { id, label: id, icon: 'label' }; }
  function refreshTagPills() {
    const usedIds = [...new Set(posts.flatMap(p => p.tags || []))];
    usedIds.forEach(id => { if (!knownTags.find(t => t.id === id)) knownTags.push({ id, label: id, icon: 'label' }); });
    const pillsContainer = document.getElementById('filterPills');
    const activeFilter = pillsContainer.querySelector('.pill.active')?.dataset.filter || '__all__';
    pillsContainer.querySelectorAll('.pill:not([data-filter="__all__"])').forEach(p => p.remove());
    usedIds.forEach(id => {
      const t = tagInfo(id);
      const b = document.createElement('button');
      b.className = 'pill' + (id === activeFilter ? ' active' : '');
      b.dataset.filter = id;
      b.innerHTML = `<span class="material-symbols-rounded">${t.icon}</span><span>${escHtml(t.label)}</span>`;
      b.addEventListener('click', () => setActiveFilter(id));
      pillsContainer.appendChild(b);
    });
  }

  let activeFilter = '__all__';
  function setActiveFilter(id) {
    activeFilter = id;
    document.querySelectorAll('#filterPills .pill').forEach(p => p.classList.toggle('active', p.dataset.filter === id));
    renderList();
  }
  document.querySelector('#filterPills .pill[data-filter="__all__"]').addEventListener('click', () => setActiveFilter('__all__'));

  // ── Feed ──────────────────────────────────────────────────
  const postList = document.getElementById('postList');
  observeList(postList);
  const emptyState = document.getElementById('emptyState');
  const visibleCount = document.getElementById('visibleCount');
  const searchInput = document.getElementById('searchInput');
  const sortSelect = createDropdown([
    { value: 'newest', label: 'newest' },
    { value: 'relevance', label: 'relevance' },
    { value: 'top', label: 'most liked' },
    { value: 'comments', label: 'most discussed' },
  ], { value: 'relevance', onChange: () => renderList() });
  document.getElementById('sortSelectSlot').appendChild(sortSelect.el);

  function score(item) { return (item.upvoters || []).length - (item.downvoters || []).length; }

  function relevanceScore(p, q) {
    if (!q) return 0;
    const title = (p.title || '').toLowerCase();
    const body = (p.body || '').toLowerCase();
    let s = 0;
    if (title === q) s += 100;
    if (title.startsWith(q)) s += 50;
    if (title.includes(q)) s += 20;
    if (body.includes(q)) s += 5;
    q.split(/\s+/).forEach(word => {
      if (word && title.includes(word)) s += 8;
      if (word && body.includes(word)) s += 3;
    });
    return s;
  }

  function renderList() {
    const q = searchInput.value.toLowerCase().trim();
    // Match on individual words, not the whole typed phrase as one
    // contiguous substring — "website comment" used to require a post to
    // contain that exact phrase to show up at all, even though
    // relevanceScore() below already scores per-word for sorting. This
    // lets a post like "please comment on this website" pass the filter,
    // then relevanceScore ranks phrase/all-word matches above partial ones.
    const qWords = q.split(/\s+/).filter(Boolean);
    let filtered = posts.filter(p => {
      const tagMatch = activeFilter === '__all__' || (p.tags || []).includes(activeFilter);
      const title = (p.title||'').toLowerCase();
      const body = (p.body||'').toLowerCase();
      const searchMatch = !q || qWords.some(w => title.includes(w) || body.includes(w));
      return tagMatch && searchMatch;
    });

    const sort = sortSelect.getValue();
    if (sort === 'top') filtered.sort((a,b) => score(b) - score(a));
    else if (sort === 'comments') filtered.sort((a,b) => (b.commentCount||0) - (a.commentCount||0));
    else if (sort === 'relevance') filtered.sort((a,b) => {
      const diff = relevanceScore(b, q) - relevanceScore(a, q);
      return diff !== 0 ? diff : (b._ts||0) - (a._ts||0);
    });
    else filtered.sort((a,b) => (b._ts||0) - (a._ts||0));

    postList.innerHTML = '';
    filtered.forEach(p => postList.appendChild(buildPostCard(p)));
    visibleCount.textContent = filtered.length;
    emptyState.style.display = filtered.length === 0 ? 'block' : 'none';
  }

  // Populated by every voteColHtml() call so the delegated voters-modal
  // click handler (see openVotersModal below) can look up the live
  // upvoters/downvoters for whatever was clicked, regardless of whether it
  // was a post card, the open thread's header, or a comment.
  const voteItemsById = new Map();
  function saveBtnHtml(item) {
    const u = currentUser();
    const saved = u && (item.savedBy || []).includes(u.uid);
    return `
      <button type="button" class="save-btn ${saved ? 'saved' : ''}" data-save-toggle="${escHtml(item.id)}" title="${saved ? 'Remove from saved' : 'Save'}">
        <span class="material-symbols-rounded" style="font-variation-settings:'FILL' ${saved ? 1 : 0};">bookmark</span>
      </button>
    `;
  }
  async function toggleSave(item) {
    const u = currentUser();
    if (!u) { showToast('sign in to save'); return; }
    if (isBanned()) { showToast("You've been banned"); return; }
    const uid = u.uid;
    const saved = (item.savedBy || []).includes(uid);
    try {
      await updateDoc(postRef(item.id), { savedBy: saved ? arrayRemove(uid) : arrayUnion(uid) });
    } catch (err) { showToast('could not save: ' + err.message); }
  }

  function voteColHtml(item, idPrefix) {
    voteItemsById.set(item.id, item);
    const netScore = score(item);
    const u = currentUser();
    const up = u && (item.upvoters || []).includes(u.uid);
    const down = u && (item.downvoters || []).includes(u.uid);
    return `
      <div class="vote-col">
        <button class="vote-btn ${up ? 'upvoted' : ''}" data-${idPrefix}-up title="Like"><span class="material-symbols-rounded">${up ? 'favorite' : 'favorite_border'}</span></button>
        <span class="vote-count ${netScore > 0 ? 'positive' : netScore < 0 ? 'negative' : ''}" data-voters-id="${escHtml(item.id)}" title="See who reacted">${netScore}</span>
        <button class="vote-btn ${down ? 'downvoted' : ''}" data-${idPrefix}-down title="Dislike"><span class="material-symbols-rounded">heart_broken</span></button>
      </div>
    `;
  }

  // ── Voters modal ─────────────────────────────────────────────────
  const votersOverlay = document.getElementById('votersOverlay');
  const votersModal = document.getElementById('votersModal');
  const votersList = document.getElementById('votersList');
  observeList(votersList);
  const votersLikeTab = document.getElementById('votersLikeTab');
  const votersDislikeTab = document.getElementById('votersDislikeTab');
  let votersData = { likes: [], dislikes: [] };
  let votersActiveTab = 'likes';

  function renderVotersList() {
    votersLikeTab.classList.toggle('active', votersActiveTab === 'likes');
    votersDislikeTab.classList.toggle('active', votersActiveTab === 'dislikes');
    const rows = votersData[votersActiveTab];
    votersList.innerHTML = rows.length ? rows.map(r => {
      const inner = `<img class="voter-avatar" src="${escHtml(r.photo || '')}" alt="">${escHtml(r.name)}${officialBadgeHtml(r.email)}`;
      return r.handle
        ? `<a class="voter-row" href="/profile?u=${encodeURIComponent(r.handle)}">${inner}</a>`
        : `<div class="voter-row">${inner}</div>`;
    }).join('') : `<div class="voters-empty">no ${votersActiveTab === 'likes' ? 'likes' : 'dislikes'} yet</div>`;
  }
  votersLikeTab.addEventListener('click', () => { votersActiveTab = 'likes'; renderVotersList(); });
  votersDislikeTab.addEventListener('click', () => { votersActiveTab = 'dislikes'; renderVotersList(); });

  function closeVotersModal() {
    votersOverlay.classList.remove('open');
    votersModal.classList.remove('open');
  }
  votersOverlay.addEventListener('click', closeVotersModal);

  async function openVotersModal(item) {
    const upUids = item.upvoters || [];
    const downUids = item.downvoters || [];
    votersData = { likes: [], dislikes: [] };
    votersActiveTab = upUids.length ? 'likes' : 'dislikes';
    document.getElementById('votersLikeCount').textContent = upUids.length;
    document.getElementById('votersDislikeCount').textContent = downUids.length;
    votersList.innerHTML = '<div class="oe-spinner-row"><span class="oe-loading-indicator small"></span>loading…</div>';
    votersOverlay.classList.add('open');
    votersModal.classList.add('open');

    const emailMap = await resolveUidsToEmails([...upUids, ...downUids]);
    const emails = [...new Set(Object.values(emailMap).filter(Boolean))];
    await Promise.all(emails.map(ensureProfileLoaded));
    const rowFor = uid => {
      const email = emailMap[uid];
      if (!email) return { name: 'Unknown user', photo: '', handle: null, email: null };
      const p = getProfile(email, null, null);
      return { name: p.name, photo: p.photo, handle: handleOf(email), email };
    };
    votersData = { likes: upUids.map(rowFor), dislikes: downUids.map(rowFor) };
    renderVotersList();
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-voters-id]');
    if (!el) return;
    const item = voteItemsById.get(el.dataset.votersId);
    if (item) openVotersModal(item);
  });

  function buildPostCard(p) {
    const card = document.createElement('div');
    card.className = 'post-card';
    const atts = attachmentsOf(p);
    const photo = photoOf(p);
    const u = currentUser();
    const saved = u && (p.savedBy || []).includes(u.uid);
    card.innerHTML = `
      ${voteColHtml(p, 'post')}
      <div class="post-body">
        <div class="post-meta">
          ${(p.tags||[]).map(id => `<span class="post-tag">${escHtml(tagInfo(id).label)}</span>`).join('')}
          <span class="post-author">
            ${authorLinkHtml(p, `${photo ? `<img src="${photo}" alt="">` : ''}${escHtml(nameOf(p))}`, 'onclick="event.stopPropagation()"')}
            · ${timeAgo(p._date)}${p.editedAt ? ' (edited)' : ''}
          </span>
        </div>
        <div class="post-title">${linkify(p.title, ' onclick="event.stopPropagation()"')}</div>
        ${p.body ? `<div class="post-excerpt">${renderExcerptMarkdown(p.body, 220)}</div>` : ''}
        ${atts.length ? `
          <div class="post-thumb-wrap" data-thumb>
            ${attachmentHtml(atts[0], { className: 'post-thumb' })}
            ${atts.length > 1 ? `<span class="post-thumb-count"><span class="material-symbols-rounded">attach_file</span>${atts.length}</span>` : ''}
          </div>
        ` : ''}
        <div class="post-footer">
          <span><span class="material-symbols-rounded">chat_bubble</span>${p.commentCount||0} comments</span>
          <span><span class="material-symbols-rounded">visibility</span>${p.views||0} views</span>
          ${p.poll ? `<span><span class="material-symbols-rounded">bar_chart</span>Poll · ${p.poll.options.length} options</span>` : ''}
          <button type="button" class="post-save-btn ${saved ? 'saved' : ''}" data-post-save="${escHtml(p.id)}" title="${saved ? 'Remove from saved' : 'Save'}" onclick="event.stopPropagation()">
            <span class="material-symbols-rounded" style="font-variation-settings:'FILL' ${saved ? 1 : 0};">bookmark</span>
          </button>
        </div>
      </div>
      <div class="kebab-slot" data-kebab></div>
    `;
    card.querySelector('[data-post-up]').addEventListener('click', e => {
      e.stopPropagation();
      toggleVote(postRef(p.id), p, 'up', { recipientEmail: p.authorEmail, type: 'upvote', targetKind: 'post', targetId: p.id, preview: p.title });
    });
    card.querySelector('[data-post-down]').addEventListener('click', e => { e.stopPropagation(); toggleVote(postRef(p.id), p, 'down'); });
    card.querySelector('[data-post-save]').addEventListener('click', e => { e.stopPropagation(); toggleSave(p); });
    const thumbWrap = card.querySelector('[data-thumb]');
    if (thumbWrap) thumbWrap.addEventListener('click', e => { if (e.target.closest('a')) e.stopPropagation(); });
    const kebabSlot = card.querySelector('[data-kebab]');
    kebabSlot.addEventListener('click', e => e.stopPropagation());
    kebabSlot.appendChild(buildKebabMenu(menuItemsForPost(p)));
    card.addEventListener('click', () => openThread(p.id));
    return card;
  }

  function postRef(id) { return doc(db, 'posts', id); }

  // ── Polls ────────────────────────────────────────────────────
  function pollHtml(item) {
    if (!item.poll) return '';
    const { options, optionVotes } = item.poll;
    const u = currentUser();
    const uid = u && u.uid;
    const totalVotes = optionVotes.reduce((s, arr) => s + arr.length, 0);
    const myIdx = uid ? optionVotes.findIndex(arr => arr.includes(uid)) : -1;
    const voted = myIdx !== -1;
    const meta = `${totalVotes} vote${totalVotes === 1 ? '' : 's'}${voted ? ' · tap another option to change your vote' : ''}`;
    if (!voted) {
      return `
        <div class="poll-block" data-poll-postid="${item.id}">
          ${options.map((opt, i) => `<button type="button" class="poll-option-btn" data-poll-vote="${i}">${escHtml(opt)}</button>`).join('')}
          <div class="poll-meta">${meta}</div>
        </div>
      `;
    }
    return `
      <div class="poll-block" data-poll-postid="${item.id}">
        ${options.map((opt, i) => {
          const count = optionVotes[i].length;
          const pct = totalVotes ? Math.round((count / totalVotes) * 100) : 0;
          return `
            <div class="poll-result-row ${i === myIdx ? 'voted' : ''}" data-poll-vote="${i}">
              <div class="poll-result-fill" style="width:${pct}%"></div>
              <div class="poll-result-text"><span>${escHtml(opt)}</span><span class="pct">${pct}%</span></div>
            </div>
          `;
        }).join('')}
        <div class="poll-meta">${meta}</div>
      </div>
    `;
  }
  function wirePollButtons(item) {
    threadContent.querySelectorAll('[data-poll-vote]').forEach(el => {
      el.addEventListener('click', () => togglePollVote(item, Number(el.dataset.pollVote)));
    });
  }
  async function togglePollVote(item, newIdx) {
    const u = currentUser();
    if (!u) { showToast('sign in to vote'); return; }
    if (isBanned()) { showToast("You've been banned"); return; }
    const uid = u.uid;
    const optionVotes = item.poll.optionVotes;
    const oldIdx = optionVotes.findIndex(arr => arr.includes(uid));
    if (oldIdx === newIdx) return;
    const patch = {};
    if (oldIdx !== -1) patch[`poll.optionVotes.${oldIdx}`] = arrayRemove(uid);
    patch[`poll.optionVotes.${newIdx}`] = arrayUnion(uid);
    try {
      await updateDoc(postRef(item.id), patch);
    } catch (err) { showToast('could not vote: ' + err.message); }
  }

  async function toggleVote(ref, item, direction, notifyMeta) {
    const u = currentUser();
    if (!u) { showToast('sign in to vote'); return; }
    if (isBanned()) { showToast("You've been banned"); return; }
    const uid = u.uid;
    const up = (item.upvoters || []).includes(uid);
    const down = (item.downvoters || []).includes(uid);
    const patch = {};
    if (direction === 'up') {
      patch.upvoters = up ? arrayRemove(uid) : arrayUnion(uid);
      if (down) patch.downvoters = arrayRemove(uid);
    } else {
      patch.downvoters = down ? arrayRemove(uid) : arrayUnion(uid);
      if (up) patch.upvoters = arrayRemove(uid);
    }
    try {
      await updateDoc(ref, patch);
      if (direction === 'up' && !up && notifyMeta) sendNotification(notifyMeta);
    } catch (err) { showToast('could not vote: ' + err.message); }
  }

  // ── Live posts feed ──────────────────────────────────────────
  let firstSnapshot = true;
  onSnapshot(query(collection(db, 'posts'), orderBy('createdAt', 'desc')), snap => {
    posts = snap.docs.map(d => {
      const data = d.data();
      const date = data.createdAt ? data.createdAt.toDate() : new Date();
      return { id: d.id, ...data, _date: date, _ts: date.getTime() };
    });
    // Render right away with cached/fallback profile data rather than
    // blocking the whole feed behind a profile fetch per author — then
    // patch names/photos in once ensureProfileLoaded resolves.
    refreshTagPills();
    renderList();
    if (openPostId) refreshOpenThreadChrome();
    Promise.all(posts.map(p => ensureProfileLoaded(p.authorEmail))).then(() => {
      refreshTagPills();
      renderList();
      if (openPostId) refreshOpenThreadChrome();
    });
    if (firstSnapshot) {
      firstSnapshot = false;
      const params = new URLSearchParams(window.location.search);
      let wantedPost = params.get('post');
      if (!wantedPost) {
        const pathMatch = window.location.pathname.match(/^\/feed\/([^/]+)\/?$/);
        if (pathMatch) wantedPost = decodeURIComponent(pathMatch[1]);
      }
      if (wantedPost && posts.find(p => p.id === wantedPost)) {
        openThread(wantedPost, { highlightComment: params.get('comment') });
      }
      if (params.get('new') === '1') {
        history.replaceState({}, '', '/feed');
        openPostModal(null);
      }
    }
  }, err => showToast('could not load posts: ' + err.message));

  searchInput.addEventListener('input', renderList);

  // ── New post modal ────────────────────────────────────────
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  const postForm = document.getElementById('postForm');
  attachMentionAutocomplete(postForm.querySelector('textarea[name="body"]'));
  let selectedTags = [];
  let postImageAttach = createMultiImageAttach(document.getElementById('postImageAttach'), MAX_POST_IMAGES);

  // ── Poll builder ────────────────────────────────────────────
  const MAX_POLL_OPTIONS = 10;
  const pollToggle = document.getElementById('pollToggle');
  const pollBuilder = document.getElementById('pollBuilder');
  const pollOptionsList = document.getElementById('pollOptionsList');
  const addPollOptionBtn = document.getElementById('addPollOptionBtn');
  let pollOptions = [];

  function renderPollOptions() {
    pollOptionsList.innerHTML = pollOptions.map((val, i) => `
      <div class="poll-option-row">
        <input type="text" data-poll-idx="${i}" value="${val.replace(/"/g, '&quot;')}" maxlength="80" placeholder="option ${i + 1}">
        ${pollOptions.length > 2 ? `<button type="button" class="poll-option-remove" data-remove-idx="${i}"><span class="material-symbols-rounded">close</span></button>` : ''}
      </div>
    `).join('');
    pollOptionsList.querySelectorAll('[data-poll-idx]').forEach(input => {
      input.addEventListener('input', () => { pollOptions[Number(input.dataset.pollIdx)] = input.value; });
    });
    pollOptionsList.querySelectorAll('[data-remove-idx]').forEach(btn => {
      btn.addEventListener('click', () => { pollOptions.splice(Number(btn.dataset.removeIdx), 1); renderPollOptions(); });
    });
    addPollOptionBtn.style.display = pollOptions.length >= MAX_POLL_OPTIONS ? 'none' : '';
  }
  pollToggle.addEventListener('change', () => {
    pollBuilder.style.display = pollToggle.checked ? 'block' : 'none';
    if (pollToggle.checked && pollOptions.length === 0) { pollOptions = ['', '']; renderPollOptions(); }
  });
  addPollOptionBtn.addEventListener('click', () => {
    if (pollOptions.length >= MAX_POLL_OPTIONS) return;
    pollOptions.push('');
    renderPollOptions();
  });

  function renderTagSelect() {
    const wrap = document.getElementById('tagSelect');
    wrap.innerHTML = knownTags.map(t => `
      <label>
        <input type="checkbox" value="${t.id}" ${selectedTags.includes(t.id) ? 'checked' : ''}>
        ${escHtml(t.label)}
      </label>
    `).join('');
    wrap.querySelectorAll('input').forEach(cb => {
      cb.addEventListener('change', () => {
        selectedTags = [...wrap.querySelectorAll('input:checked')].map(i => i.value);
      });
    });
  }

  let editingPostId = null;
  let editingPostPoll = null; // carried through unchanged if the post being edited already has one — changing options after votes exist would invalidate them

  function openPostModal(post) {
    if (!currentUser()) { showToast('sign in to post'); return; }
    if (isBanned()) { showToast("You've been banned from posting"); return; }
    postForm.reset();
    postImageAttach.reset();
    editingPostId = post ? post.id : null;
    editingPostPoll = post && post.poll ? post.poll : null;
    document.getElementById('modalTitle').textContent = post ? 'Edit post' : 'New post';
    document.getElementById('submitPostIcon').textContent = post ? 'save' : 'send';
    document.getElementById('submitPostLabel').textContent = post ? 'Save' : 'Post';
    if (post) {
      postForm.elements.title.value = post.title || '';
      postForm.elements.body.value = post.body || '';
      selectedTags = [...(post.tags || [])];
      postImageAttach.setExistingUrls(post.imageUrls && post.imageUrls.length ? post.imageUrls : (post.imageUrl ? [post.imageUrl] : []));
    } else {
      selectedTags = [];
    }
    // Existing polls can't be edited (their vote arrays would go stale the
    // moment options change) — lock the toggle and hide the builder,
    // carrying editingPostPoll through untouched on save instead.
    pollToggle.checked = !!editingPostPoll;
    pollToggle.disabled = !!editingPostPoll;
    pollBuilder.style.display = 'none';
    pollOptions = [];
    renderTagSelect();
    overlay.classList.add('open');
    modal.classList.add('open');
  }

  document.getElementById('newPostBtn').addEventListener('click', () => openPostModal(null));
  function closeModal() { overlay.classList.remove('open'); modal.classList.remove('open'); editingPostId = null; }
  document.getElementById('cancelPostBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', closeModal);
  document.getElementById('addTagBtn').addEventListener('click', () => {
    const input = document.getElementById('newTagInput');
    const id = input.value.trim().toLowerCase().replace(/\s+/g, '-');
    if (!id) return;
    if (!knownTags.find(t => t.id === id)) knownTags.push({ id, label: id, icon: 'label' });
    if (!selectedTags.includes(id)) selectedTags.push(id);
    renderTagSelect();
    input.value = '';
  });

  postForm.addEventListener('submit', async e => {
    e.preventDefault();
    const u = currentUser();
    if (!u) { showToast('sign in to post'); return; }
    if (isBanned()) { showToast("You've been banned from posting"); return; }
    const fd = new FormData(postForm);
    const title = fd.get('title').trim();
    if (!title) return;
    // Only build a poll payload when adding a NEW one — an existing poll
    // (editingPostPoll set) is left out of the update entirely so it's
    // never touched, since changing its options would orphan any votes
    // already cast against the old option list.
    let pollPayload = null;
    if (pollToggle.checked && !editingPostPoll) {
      const cleanOptions = pollOptions.map(o => o.trim()).filter(Boolean);
      if (cleanOptions.length < 2) { showToast('add at least 2 poll options'); return; }
      pollPayload = { options: cleanOptions, optionVotes: cleanOptions.map(() => []) };
    }
    const submitBtn = document.getElementById('submitPostBtn');
    submitBtn.disabled = true;
    try {
      const newUrls = await uploadFilesIfAny(postImageAttach.getFiles());
      const imageUrls = [...postImageAttach.getExistingUrls(), ...newUrls];
      if (editingPostId) {
        await updateDoc(postRef(editingPostId), {
          title,
          body: fd.get('body').trim(),
          tags: selectedTags,
          imageUrls,
          editedAt: serverTimestamp(),
          ...(pollPayload ? { poll: pollPayload } : {}),
        });
        showToast('post updated');
      } else {
        await addDoc(collection(db, 'posts'), {
          title,
          body: fd.get('body').trim(),
          tags: selectedTags,
          imageUrls,
          authorEmail: u.email,
          authorName: u.displayName,
          authorPhoto: u.photoURL,
          upvoters: [],
          downvoters: [],
          commentCount: 0,
          createdAt: serverTimestamp(),
          ...(pollPayload ? { poll: pollPayload } : {}),
        });
        showToast('posted!');
      }
      closeModal();
    } catch (err) {
      showToast('could not post: ' + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ── Thread panel (post + comments) ────────────────────────
  const threadOverlay = document.getElementById('threadOverlay');
  const threadPanel = document.getElementById('threadPanel');
  const threadContent = document.getElementById('threadContent');
  let openPostId = null;
  let latestComments = [];
  let replyingToComment = null; // { id, authorEmail, authorName }

  function refreshOpenThreadChrome() {
    const p = posts.find(x => x.id === openPostId);
    if (!p) return;
    const voteCol = threadContent.querySelector('.thread-actions .vote-col');
    if (voteCol) {
      voteCol.outerHTML = voteColHtml(p, 'thread');
    }
    const saveBtn = threadContent.querySelector('.thread-actions-row [data-save-toggle]');
    if (saveBtn) saveBtn.outerHTML = saveBtnHtml(p);
    wireThreadVoteButtons(p);
    const pollBlock = threadContent.querySelector('.poll-block');
    if (pollBlock && p.poll) {
      pollBlock.outerHTML = pollHtml(p);
      wirePollButtons(p);
    }
  }

  // Instagram-style social proof under the vote row: names a person the
  // viewer follows among the likers ("Liked by X and Y others") so the
  // count feels grounded in people you actually know, falling back to a
  // plain count when none of the likers are someone you follow.
  async function renderLikedBy(p) {
    const el = threadContent.querySelector('#threadLikedBy');
    if (!el) return;
    const upUids = p.upvoters || [];
    const total = upUids.length;
    if (!total) { el.innerHTML = ''; return; }
    const u = currentUser();
    const emailMap = await resolveUidsToEmails(upUids);
    const likerEmails = [...new Set(upUids.map(uid => emailMap[uid]).filter(Boolean))];
    let followedEmail = null;
    if (u) {
      const { following } = await loadFollowRelationships(u.email);
      followedEmail = likerEmails.find(e => following.has(e) && e !== u.email) || null;
    }
    if (threadContent.querySelector('#threadLikedBy') !== el || openPostId !== p.id) return;
    if (followedEmail) {
      await ensureProfileLoaded(followedEmail);
      const prof = getProfile(followedEmail, null, null);
      const handle = handleOf(followedEmail);
      const others = total - 1;
      const nameHtml = handle
        ? `<a href="/profile?u=${encodeURIComponent(handle)}">${escHtml(prof.name)}</a>`
        : `<span>${escHtml(prof.name)}</span>`;
      el.innerHTML = `${prof.photo ? `<img src="${escHtml(prof.photo)}" alt="">` : ''}<span>Liked by ${nameHtml}${others > 0 ? ` and ${others} other${others === 1 ? '' : 's'}` : ''}</span>`;
    } else {
      el.innerHTML = `<span>Liked by ${total} ${total === 1 ? 'person' : 'people'}</span>`;
    }
  }

  function wireThreadVoteButtons(p) {
    const upBtn = threadContent.querySelector('[data-thread-up]');
    const downBtn = threadContent.querySelector('[data-thread-down]');
    if (upBtn) upBtn.onclick = () => toggleVote(postRef(p.id), p, 'up', { recipientEmail: p.authorEmail, type: 'upvote', targetKind: 'post', targetId: p.id, preview: p.title });
    if (downBtn) downBtn.onclick = () => toggleVote(postRef(p.id), p, 'down');
    const saveBtn = threadContent.querySelector('[data-save-toggle]');
    if (saveBtn) saveBtn.onclick = () => toggleSave(p);
  }

  async function openThread(postId, opts) {
    opts = opts || {};
    openPostId = postId;
    const p = posts.find(x => x.id === postId);
    if (!p) return;
    // Browser tab title/bookmarks and any crawler that renders JS (Google's
    // does; most link-preview unfurlers like Discord/Twitter don't, so this
    // alone doesn't fix social-share previews for individual posts).
    document.title = `${p.title || 'Post'} — oeper.dev`;
    const descEl = document.querySelector('meta[name="description"]');
    if (descEl && p.body) descEl.setAttribute('content', p.body.slice(0, 160));
    const atts = attachmentsOf(p);
    const mediaAtts = atts.filter(a => ['image', 'video'].includes(fileKind(a)));
    const fileAtts = atts.filter(a => !['image', 'video'].includes(fileKind(a)));
    const photo = photoOf(p);

    threadContent.innerHTML = `
      <div class="thread-post-meta">
        ${(p.tags||[]).map(id => `<span class="post-tag">${escHtml(tagInfo(id).label)}</span>`).join('')}
        <span class="post-author">
          ${authorLinkHtml(p, `${photo ? `<img src="${photo}" alt="">` : ''}${escHtml(nameOf(p))}`)}
          · ${timeAgo(p._date)}${p.editedAt ? ' (edited)' : ''} · ${p.views||0} views
        </span>
        <span class="kebab-slot" data-kebab style="margin-left:auto;"></span>
      </div>
      <div class="thread-title">${linkify(p.title)}</div>
      ${mediaAtts.length ? `
        <div class="thread-gallery ${mediaAtts.length === 1 ? 'single' : ''}">
          ${mediaAtts.map(src => attachmentHtml(src, { onclick: isImageUrl(src) ? `openImageLightbox('${src}')` : null })).join('')}
        </div>
      ` : ''}
      ${fileAtts.length ? `
        <div class="thread-files">
          ${fileAtts.map(src => attachmentHtml(src, { withPreview: true })).join('')}
        </div>
      ` : ''}
      <div class="thread-body">${parseMarkdown(p.body)}</div>
      ${pollHtml(p)}
      <div class="thread-actions">
        <div class="thread-actions-row">
          ${voteColHtml(p, 'thread')}
          ${saveBtnHtml(p)}
        </div>
        <div class="thread-liked-by" id="threadLikedBy"></div>
      </div>
      <div class="comments-heading" id="commentsHeading">comments</div>
      <div class="comment-list" id="commentList"></div>
      <div id="commentFormWrap"></div>
    `;

    wireThreadVoteButtons(p);
    wirePollButtons(p);
    renderLikedBy(p);
    threadContent.querySelector('[data-kebab]').appendChild(buildKebabMenu(menuItemsForPost(p)));
    flushTextPreviews();
    bumpViews(postId);

    renderCommentForm();

    if (!opts.keepScroll) {
      threadOverlay.classList.add('open');
      threadPanel.classList.add('open');
      threadPanel.scrollTop = 0;
      document.body.style.overflow = 'hidden';
      history.pushState({ post: postId }, '', '/feed/' + encodeURIComponent(postId));
    }

    if (unsubComments.current) unsubComments.current();
    unsubComments.current = onSnapshot(
      query(collection(db, 'posts', postId, 'comments'), orderBy('createdAt', 'asc')),
      snap => {
        latestComments = snap.docs.map(d => {
          const data = d.data();
          const date = data.createdAt ? data.createdAt.toDate() : new Date();
          return { id: d.id, ...data, _date: date };
        });
        renderComments(latestComments, postId, opts.highlightComment);
        opts.highlightComment = null;
        Promise.all(latestComments.map(c => ensureProfileLoaded(c.authorEmail))).then(() => {
          renderComments(latestComments, postId, null);
        });
      }
    );
  }

  function renderComments(comments, postId, highlightId) {
    const list = document.getElementById('commentList');
    if (!list) return;
    observeList(list);
    document.getElementById('commentsHeading').textContent = `comments (${comments.length})`;
    list.innerHTML = comments.map(c => `
      <div class="comment${c.id === highlightId ? ' highlighted' : ''}" id="comment-${c.id}">
        ${voteColHtml(c, 'c-' + c.id)}
        <div class="comment-main">
          <div class="comment-meta">
            ${authorLinkHtml(c, `${photoOf(c) ? `<img src="${photoOf(c)}" alt="">` : ''}<span class="name">${escHtml(nameOf(c))}</span>`)}
            <span class="time">${timeAgo(c._date)}</span>
            <span class="kebab-slot" data-kebab style="margin-left:auto;"></span>
          </div>
          ${c.replyToId ? `<span class="comment-reply-quote">Replying to ${escHtml(c.replyToAuthorName || 'a comment')}</span>` : ''}
          <div class="comment-body">${linkify(c.body)}</div>
          ${c.imageUrl ? attachmentHtml(c.imageUrl, { className: 'comment-image', withPreview: true, onclick: `openImageLightbox('${c.imageUrl}')` }) : ''}
          <button type="button" class="comment-reply-btn" data-reply-id="${escHtml(c.id)}">Reply</button>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('.comment').forEach(el => {
      const id = el.id.replace('comment-', '');
      const c = comments.find(x => x.id === id);
      el.querySelector(`[data-c-${id}-up]`).addEventListener('click', () => toggleVote(doc(db, 'posts', postId, 'comments', id), c, 'up'));
      el.querySelector(`[data-c-${id}-down]`).addEventListener('click', () => toggleVote(doc(db, 'posts', postId, 'comments', id), c, 'down'));
      el.querySelector('[data-kebab]').appendChild(buildKebabMenu(menuItemsForComment(c, postId)));
      el.querySelector('[data-reply-id]').addEventListener('click', () => startCommentReply(c));
    });
    flushTextPreviews();

    if (highlightId) {
      const el = document.getElementById('comment-' + highlightId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function renderCommentForm() {
    const wrap = document.getElementById('commentFormWrap');
    if (!wrap) return;
    if (!currentUser()) {
      wrap.innerHTML = `<div class="comment-form-locked">Sign in to join the discussion.</div>`;
      return;
    }
    if (isBanned()) {
      wrap.innerHTML = `<div class="comment-form-locked">You've been banned from posting.</div>`;
      return;
    }
    wrap.innerHTML = `
      <div class="comment-reply-indicator" id="commentReplyIndicator" style="display:none;">
        <span id="commentReplyIndicatorText"></span>
        <button type="button" id="commentReplyCancelBtn" title="Cancel reply"><span class="material-symbols-rounded">close</span></button>
      </div>
      <form class="comment-form" id="commentForm">
        <textarea name="body" placeholder="add a comment…" maxlength="2000" required></textarea>
        <div class="image-attach" id="commentImageAttach"></div>
        <div class="comment-form-actions">
          <span></span>
          <button type="submit" class="btn primary small">Comment</button>
        </div>
      </form>
    `;
    const commentImageAttach = createImageAttach(document.getElementById('commentImageAttach'));
    attachMentionAutocomplete(document.querySelector('#commentForm textarea[name="body"]'));
    document.getElementById('commentReplyCancelBtn').addEventListener('click', cancelCommentReply);
    document.getElementById('commentForm').addEventListener('submit', async e => {
      e.preventDefault();
      const u = currentUser();
      const fd = new FormData(e.target);
      const body = fd.get('body').trim();
      if (!body || !openPostId || !u) return;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      const reply = replyingToComment;
      try {
        const file = commentImageAttach.getFile();
        const imageUrl = file
          ? await uploadFile(file, undefined, undefined, frac => { submitBtn.textContent = `Uploading… ${Math.round(frac * 100)}%`; })
          : null;
        await addDoc(collection(db, 'posts', openPostId, 'comments'), {
          body,
          imageUrl: imageUrl || null,
          authorEmail: u.email,
          authorName: u.displayName,
          authorPhoto: u.photoURL,
          upvoters: [],
          downvoters: [],
          createdAt: serverTimestamp(),
          ...(reply ? { replyToId: reply.id, replyToAuthorEmail: reply.authorEmail, replyToAuthorName: reply.authorName } : {}),
        });
        const p = posts.find(x => x.id === openPostId);
        await updateDoc(postRef(openPostId), { commentCount: (p?.commentCount || 0) + 1 });
        if (p) sendNotification({ recipientEmail: p.authorEmail, type: 'comment', targetKind: 'post', targetId: openPostId, preview: body.slice(0, 120) });
        if (reply && reply.authorEmail !== (p && p.authorEmail)) {
          sendNotification({ recipientEmail: reply.authorEmail, type: 'comment', targetKind: 'post', targetId: openPostId, preview: body.slice(0, 120) });
        }
        e.target.reset();
        commentImageAttach.reset();
        cancelCommentReply();
      } catch (err) {
        showToast('could not comment: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Comment';
      }
    });
  }

  function startCommentReply(c) {
    if (!currentUser()) { showToast('sign in to reply'); return; }
    replyingToComment = { id: c.id, authorEmail: c.authorEmail, authorName: nameOf(c) };
    const indicator = document.getElementById('commentReplyIndicator');
    const textEl = document.getElementById('commentReplyIndicatorText');
    if (!indicator || !textEl) return;
    textEl.textContent = `Replying to ${replyingToComment.authorName}`;
    indicator.style.display = 'flex';
    const handle = handleOf(c.authorEmail);
    const textarea = document.querySelector('#commentForm textarea[name="body"]');
    if (textarea) {
      if (handle && !textarea.value.trim()) textarea.value = `@${handle} `;
      textarea.focus();
    }
  }
  function cancelCommentReply() {
    replyingToComment = null;
    const indicator = document.getElementById('commentReplyIndicator');
    if (indicator) indicator.style.display = 'none';
  }

  function closeThread() {
    threadOverlay.classList.remove('open');
    threadPanel.classList.remove('open');
    document.body.style.overflow = '';
    if (unsubComments.current) { unsubComments.current(); unsubComments.current = null; }
    openPostId = null;
    replyingToComment = null;
    document.title = 'Feed — oeper.dev';
    const descEl = document.querySelector('meta[name="description"]');
    if (descEl) descEl.setAttribute('content', 'Talk to other visitors of oeper.dev');
    history.pushState({}, '', '/feed');
  }
  document.getElementById('threadCloseBtn').addEventListener('click', closeThread);
  threadOverlay.addEventListener('click', closeThread);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeThread(); closeModal(); } });
}
</script>
</body>
</html>
