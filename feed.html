<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed — oeper.dev</title>
<meta name="description" content="Talk to other visitors of oeper.dev">
<meta property="og:title" content="Feed — oeper.dev">
<meta property="og:description" content="Talk to other visitors of oeper.dev">
<meta property="og:image" content="https://oeper.dev/icon.png">
<meta property="og:url" content="https://oeper.dev/feed">
<meta property="og:type" content="website">
<link rel="icon" href="https://oeper.dev/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="https://oeper.dev/icon.ico?v=3" type="image/x-icon">
<script src="./shared/theme-boot.js?v=14"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Freehand&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :focus { outline: none; }
  :focus-visible { outline: none; }

  :root {
    --md-sys-color-background: #111318;
    --md-sys-color-surface: #1a1c22;
    --md-sys-color-surface-variant: #2f353d;
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-on-primary: #062e6f;
    --md-sys-color-secondary-container: #33485d;
    --md-sys-color-on-secondary-container: #d2e4ff;
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c7c5;
    --md-sys-color-outline: #43474e;
    --md-sys-color-outline-variant: #8c9199;
    --md-sys-color-error: #ffb4ab;
    --md-sys-color-success: #a6d9a8;
  }

  body {
    min-height: 100vh;
    background-color: var(--md-sys-color-background);
    font-family: var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif);
    background-image: var(--oe-bg-image, none);
    color: var(--md-sys-color-on-surface);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page { position: relative; max-width: 840px; margin: 0 auto; padding: 56px 24px 100px; }

  .header { margin-bottom: 28px; }
  .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
  .header-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--md-sys-color-primary); text-decoration: none;
    font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 14px; font-weight: 500; transition: opacity 0.2s;
  }
  .header-link:hover { opacity: 0.8; }
  .header-link:visited { color: var(--md-sys-color-primary); }
  .header h1 {
    font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: clamp(2.5rem, 6vw, 3.5rem); font-weight: 400;
    margin-bottom: 12px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 12px;
  }
  .header h1 .material-symbols-rounded { font-size: 0.8em; color: var(--md-sys-color-primary); }

  /* Toolbar */
  .toolbar { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
  .search-wrap { position: relative; width: 100%; }
  .search-wrap .material-symbols-rounded {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
    color: var(--md-sys-color-on-surface-variant); font-size: 22px; pointer-events: none;
  }
  .search-input {
    width: 100%; background-color: var(--md-sys-color-surface); border: none;
    border-radius: 28px; padding: 16px 20px 16px 56px; color: var(--md-sys-color-on-surface);
    font-family: var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif);
    font-size: 16px; outline: none;
    transition: box-shadow 0.2s, background-color 0.2s;
  }
  .search-input::placeholder { color: var(--md-sys-color-on-surface-variant); }
  .search-input:focus { box-shadow: 0 0 0 2px var(--md-sys-color-primary); background-color: var(--md-sys-color-hover-surface); }

  .controls-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; background: var(--md-sys-color-surface-variant); border: none;
    border-radius: 8px; padding: 8px 16px; font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 14px; font-weight: 500;
    color: var(--md-sys-color-on-surface-variant); cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
  }
  .pill .material-symbols-rounded { font-size: 18px; }
  .pill:hover { background-color: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }
  .pill.active { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }

  .sort-select-slot { flex-shrink: 0; }
  .sort-select-slot .oe-dropdown-btn {
    background: transparent; border-radius: 8px; padding: 8px 14px;
    font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 14px; font-weight: 500;
  }

  .new-post-btn {
    display: inline-flex; align-items: center; gap: 8px; background-color: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary); border: none; border-radius: 100px; padding: 10px 20px;
    font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 14px; font-weight: 500; cursor: pointer; flex-shrink: 0;
  }
  .new-post-btn:hover { opacity: 0.9; }

  .stats { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 14px; color: var(--md-sys-color-on-surface-variant); margin-bottom: 24px; padding-left: 4px; }
  .stats strong { color: var(--md-sys-color-primary); font-weight: 500; }

  /* Post cards */
  .post-list { display: flex; flex-direction: column; gap: 12px; }
  .post-card {
    position: relative; display: flex; gap: 4px; background-color: var(--md-sys-color-surface);
    border-radius: 20px; cursor: pointer; transition: background-color 0.2s;
  }
  .post-card:hover { background-color: var(--md-sys-color-hover-surface); }

  /* Vote column: up arrow / count / down arrow, reused (rotated to row) in thread view */
  .vote-col { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 8px; flex-shrink: 0; }
  .vote-btn {
    width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent;
    color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .vote-btn .material-symbols-rounded { font-size: 20px; }
  .vote-btn:hover { background-color: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }
  .vote-btn.upvoted { color: var(--md-sys-color-primary); }
  .vote-btn.downvoted { color: var(--md-sys-color-error); }
  .vote-count { font-size: 13px; font-weight: 600; color: var(--md-sys-color-on-surface-variant); padding: 2px 0; }
  .vote-count.positive { color: var(--md-sys-color-primary); }
  .vote-count.negative { color: var(--md-sys-color-error); }

  .post-body { padding: 16px 44px 16px 4px; flex: 1; min-width: 0; }
  .post-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .post-tag {
    font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 8px;
    background-color: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface-variant);
  }
  .post-author { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
  .author-link { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; }
  .author-link:hover { color: var(--md-sys-color-primary); text-decoration: underline; }
  .post-author img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
  .post-title { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 18px; font-weight: 400; margin-bottom: 4px; line-height: 1.3; }
  .post-excerpt {
    font-size: 14px; color: var(--md-sys-color-on-surface-variant); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px;
  }
  .post-excerpt a, .comment-body a, .post-title a, .thread-title a { color: var(--md-sys-color-primary); }
  .post-excerpt a.md-btn {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif);
    font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 100px; background-color: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary); text-decoration: none; vertical-align: middle;
  }
  .post-excerpt a.md-btn .material-symbols-rounded { font-size: 13px; }
  .post-thumb-wrap { position: relative; margin-bottom: 8px; display: inline-block; max-width: 100%; }
  .post-thumb { max-width: 100%; max-height: 260px; border-radius: 12px; display: block; object-fit: cover; }
  .post-thumb-count {
    position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; font-size: 12px; font-weight: 500;
    padding: 3px 9px; border-radius: 100px; display: flex; align-items: center; gap: 4px;
  }
  .post-thumb-count .material-symbols-rounded { font-size: 14px; }
  .post-footer { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
  .post-footer span { display: inline-flex; align-items: center; gap: 4px; }
  .post-footer .material-symbols-rounded { font-size: 16px; }
  .post-save-btn {
    margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: none; border: none; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--md-sys-color-on-surface-variant); flex-shrink: 0;
  }
  .post-save-btn:hover { background: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }
  .post-save-btn.saved { color: var(--md-sys-color-primary); }
  .post-save-btn .material-symbols-rounded { font-size: 20px; }

  .empty { text-align: center; padding: 80px 0; color: var(--md-sys-color-on-surface-variant); display: none; }
  .empty .material-symbols-rounded { font-size: 48px; opacity: 0.5; margin-bottom: 16px; }

  /* Kebab / overflow menu — used on post cards, thread header, and comments */
  .kebab-slot { position: relative; }
  .post-card .kebab-slot { position: absolute; top: 10px; right: 10px; }
  .kebab-wrap { position: relative; }
  .kebab-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,0.25);
    color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .kebab-btn:hover { background: rgba(255,255,255,0.14); color: var(--md-sys-color-on-surface); }
  .kebab-btn .material-symbols-rounded { font-size: 19px; }
  .kebab-menu {
    position: absolute; top: calc(100% + 6px); right: 0; background: var(--md-sys-color-surface);
    border-radius: 14px; padding: 6px; min-width: 170px; z-index: 30;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); opacity: 0; transform: translateY(-6px) scale(0.97); pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
  }
  .kebab-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }
  .kebab-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 9px; border: none;
    background: transparent; color: var(--md-sys-color-on-surface); font-size: 13px; cursor: pointer; text-align: left; font-family: inherit;
  }
  .kebab-item:hover { background: var(--md-sys-state-hover); }
  .kebab-item.dangerous { color: var(--md-sys-color-error); }
  .kebab-item .material-symbols-rounded { font-size: 17px; }

  /* Thread panel (post detail + comments) */
  /* Same side-drawer pattern as videos.html's .watch-panel — kept in sync
     by hand across the two pages so opening any piece of content (post,
     video) feels like the same UI. */
  .thread-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.75); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .thread-overlay.open { opacity: 1; pointer-events: all; }
  .thread-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background-color: var(--md-sys-color-background);
    z-index: 201; transform: translateX(100%); transition: transform 0.25s; overflow-y: auto; padding: 24px;
  }
  .thread-panel.open { transform: translateX(0); }
  .thread-close-btn {
    position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--md-sys-color-surface); border: none; display: flex; align-items: center; justify-content: center;
    color: var(--md-sys-color-on-surface); cursor: pointer;
  }
  .thread-content { padding-bottom: 24px; }

  .thread-post-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; padding-right: 48px; }
  .thread-title { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 400; line-height: 1.25; margin-bottom: 16px; }
  .thread-body { font-size: 16px; line-height: 1.7; margin-bottom: 12px; }
  .thread-body p { margin-bottom: 1.2em; }
  .thread-body a { color: var(--md-sys-color-primary); }
  .thread-body strong { font-weight: 600; }
  .thread-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .thread-gallery img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; cursor: zoom-in; }
  .thread-gallery.single { grid-template-columns: 1fr; }
  .thread-gallery.single img { width: auto; max-width: 100%; height: auto; max-height: 480px; border-radius: 16px; }
  .thread-gallery .attach-video { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; }
  .thread-gallery.single .attach-video { width: 100%; height: auto; max-height: 480px; border-radius: 16px; }

  .thread-files { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .text-attach { display: flex; flex-direction: column; gap: 8px; }
  .code-preview {
    background: #1e2025; border-radius: 12px;
    padding: 14px 16px; font-family: monospace; font-size: 12px; line-height: 1.5;
    color: var(--md-sys-color-on-surface-variant); white-space: pre-wrap; word-break: break-word;
    max-height: 240px; overflow-y: auto;
  }

  .thread-actions { display: flex; flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--md-sys-color-outline); }
  .thread-actions-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .thread-actions .vote-col { flex-direction: row; padding: 4px; background: var(--md-sys-color-surface); border-radius: 100px; gap: 2px; }
  .thread-actions .vote-count { padding: 0 4px; }
  .save-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none; background: none; flex-shrink: 0;
    color: var(--md-sys-color-on-surface-variant); cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .save-btn:hover { background: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }
  .save-btn.saved { color: var(--md-sys-color-primary); }
  .save-btn .material-symbols-rounded { font-size: 24px; }
  .thread-liked-by { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--md-sys-color-on-surface-variant); padding-left: 4px; min-height: 20px; }
  .thread-liked-by img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--md-sys-color-surface-variant); }
  .thread-liked-by a { color: var(--md-sys-color-on-surface); font-weight: 500; text-decoration: none; }
  .thread-liked-by a:hover { text-decoration: underline; }

  .comments-heading { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 16px; font-weight: 500; margin-bottom: 16px; }
  .comment-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
  .comment {
    background-color: var(--md-sys-color-surface); border-radius: 16px; padding: 14px 18px; display: flex; gap: 10px;
    scroll-margin-top: 90px;
  }
  .comment.highlighted { box-shadow: 0 0 0 2px var(--md-sys-color-primary); }
  .comment .vote-col { flex-direction: row; padding: 0; gap: 4px; align-self: flex-start; }
  .comment .vote-btn { width: 24px; height: 24px; }
  .comment .vote-btn .material-symbols-rounded { font-size: 16px; }
  .comment .vote-count { font-size: 12px; }
  .comment-main { flex: 1; min-width: 0; }
  .comment-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .comment-meta img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
  .comment-meta .name { font-size: 13px; font-weight: 500; }
  .comment-meta .time { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
  .comment-body { font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  .comment-image { max-width: 100%; max-height: 300px; border-radius: 12px; display: block; margin-top: 8px; cursor: zoom-in; }
  .comment-reply-quote {
    display: block; border-left: 2px solid var(--md-sys-color-outline); opacity: 0.75; padding: 2px 8px; margin-bottom: 6px;
    font-size: 12px; color: var(--md-sys-color-on-surface-variant);
  }
  .comment-reply-btn {
    background: none; border: none; color: var(--md-sys-color-on-surface-variant); font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: inherit; padding: 0; margin-top: 4px;
  }
  .comment-reply-btn:hover { color: var(--md-sys-color-on-surface); text-decoration: underline; }
  .comment-reply-indicator {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--md-sys-color-surface-variant); border-radius: 12px; padding: 8px 12px; font-size: 12px;
  }
  .comment-reply-indicator button {
    width: 22px; height: 22px; border-radius: 50%; border: none; background: none; color: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .comment-reply-indicator button:hover { background: var(--md-sys-state-hover); }

  .comment-form { display: flex; flex-direction: column; gap: 10px; }
  .comment-form textarea {
    width: 100%; min-height: 80px; background-color: var(--md-sys-color-surface-variant); border: none;
    border-radius: 14px; padding: 12px 16px; color: var(--md-sys-color-on-surface); font-family: inherit; font-size: 14px; outline: none; resize: vertical;
  }
  .comment-form textarea:focus { box-shadow: 0 0 0 2px var(--md-sys-color-primary); }
  .comment-form-actions { display: flex; justify-content: space-between; align-items: center; }
  .comment-form-locked {
    text-align: center; padding: 20px; background: var(--md-sys-color-surface); border-radius: 16px;
    font-size: 14px; color: var(--md-sys-color-on-surface-variant);
  }

  /* Image attach controls (post form supports up to MAX_POST_IMAGES; comment form is single-image) */
  .image-attach { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .image-attach input[type="file"] { display: none; }
  .image-attach-btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--md-sys-color-surface-variant); border: none;
    color: var(--md-sys-color-on-surface-variant); border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .image-attach-btn:hover { color: var(--md-sys-color-on-surface); background: var(--md-sys-color-hover-surface); }
  .image-preview-wrap { position: relative; display: inline-block; }
  .image-preview-wrap img { max-height: 90px; border-radius: 10px; display: block; }
  .image-preview-remove {
    position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--md-sys-color-error); color: #410002; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .image-preview-remove .material-symbols-rounded { font-size: 14px; }

  /* Non-image attachments render as a file chip instead of an <img> */
  .file-chip-preview {
    display: inline-flex; align-items: center; gap: 6px; background: var(--md-sys-color-background);
    border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--md-sys-color-on-surface-variant); max-width: 140px;
  }
  .file-chip-preview .material-symbols-rounded { font-size: 18px; flex-shrink: 0; }
  .file-chip-preview .file-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip {
    display: inline-flex; align-items: center; gap: 8px; background: var(--md-sys-color-surface-variant);
    border-radius: 12px; padding: 12px 16px; color: var(--md-sys-color-on-surface); text-decoration: none; font-size: 13px; max-width: 100%;
  }
  .file-chip:hover { background: var(--md-sys-color-hover-surface); }
  .file-chip .material-symbols-rounded { font-size: 22px; flex-shrink: 0; color: var(--md-sys-color-primary); }
  .file-chip .file-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-gallery .file-chip { width: 100%; height: 140px; justify-content: center; }
  .post-thumb-wrap .file-chip { display: flex; }

  .audio-attach {
    display: flex; align-items: center; gap: 12px; background: var(--md-sys-color-surface-variant);
    border-radius: 12px; padding: 12px 16px; max-width: 100%;
  }
  .audio-attach-icon { font-size: 22px; flex-shrink: 0; color: var(--md-sys-color-primary); }

    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" onclick="event.stopPropagation()">$1</a>')
    .replace(/(?<!["'>])(https?:\/\/[^\s<]+[^\s<.,:;!?'")\]])/g, url => `<a href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${url}</a>`);

    .replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
    .replace(/^##\s+(.+)$/gm,  '<h2>$1</h2>')
    .replace(/^#\s+(.+)$/gm,   '<h1>$1</h1>')
    // Tables: a header row, a |---|---| separator row, then one or more data rows.
    .replace(/^(\|.+\|)\n(\|[ \t]*:?-{2,}:?[ \t]*(?:\|[ \t]*:?-{2,}:?[ \t]*)*\|?)\n((?:\|.*\|\n?)+)/gm, (m, headerLine, sepLine, bodyLines) => {

      const rows = bodyLines.trim().split('\n').filter(Boolean).map(splitRow);
      const thead = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
      const tbody = rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');

      `<ul>${match.trim().split('\n').map(l => `<li>${l.replace(/^[ \t]*[-*+][ \t]+/, '')}</li>`).join('')}</ul>\n`)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // [[Button label]](url) renders as a filled Material button instead of a plain link.
    .replace(/\[\[([^\]]+)\]\]\((https?:\/\/[^)]+)\)/g, '<a class="md-btn" href="$2" target="_blank" rel="noopener"><span class="material-symbols-rounded">arrow_forward</span>$1</a>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(?<!["'>])(https?:\/\/[^\s<]+[^\s<.,:;!?'")\]])/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  html = expandIconShorthand(html)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>')
    // Lists/tables already carry their own block markup — undo the <p>/<br> wrapping the two passes above just applied around them.
    .replace(/<p>(\s*<(?:ul|table)[\s\S]*?<\/(?:ul|table)>\s*)<\/p>/g, '$1')
    .replace(/<br>(\s*<(?:ul|table|\/ul|\/table))/g, '$1')
    .replace(/(<\/(?:ul|table)>)<br>/g, '$1')
    .replace(/<li><br>/g, '<li>').replace(/<br><\/li>/g, '</li>');

}
function timeAgo(date) {
  if (!date) return '';
  const s = Math.floor((Date.now() - date.getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  if (s < 2592000) return Math.floor(s/86400) + 'd ago';
  return date.toLocaleDateString();
}

async function reportItem(type, postId, commentId, itemId, url) {

// Legacy posts had a single `imageUrl` string; newer ones have `imageUrls: []`.

function attachmentsOf(item) {

const IMAGE_EXT_RE = /\.(jpe?g|png|gif|webp|bmp|svg|avif)$/i;
const VIDEO_EXT_RE = /\.(mp4|webm|mov|m4v|ogv)$/i;
const AUDIO_EXT_RE = /\.(mp3|wav|ogg|m4a|flac|aac|opus|weba)$/i;
const ARCHIVE_EXT_RE = /\.(zip|rar|7z|tar|gz|bz2|xz)$/i;
const TEXT_EXT_RE = /\.(txt|md|log|csv|json|ya?ml|xml|js|jsx|ts|tsx|mjs|cjs|py|rb|php|java|c|h|cpp|hpp|cs|go|rs|swift|kt|html?|css|scss|sql|sh|bash|ini|conf|toml)$/i;

function isImageUrl(url) { return IMAGE_EXT_RE.test((url || '').split('?')[0]); }
function fileKind(url) {
  const clean = (url || '').split('?')[0];
  if (IMAGE_EXT_RE.test(clean)) return 'image';
  if (VIDEO_EXT_RE.test(clean)) return 'video';
  if (AUDIO_EXT_RE.test(clean)) return 'audio';
  if (ARCHIVE_EXT_RE.test(clean)) return 'archive';
  if (TEXT_EXT_RE.test(clean)) return 'text';
  return 'file';
}
function fileNameFromUrl(url) {
  try { return decodeURIComponent(new URL(url).pathname.split('/').pop()) || 'file'; }
  catch { return 'file'; }
}

// Text/code preview fetches are deferred and batched so the feed (which
// never opts in) never triggers them — only the open thread does.
const pendingPreviews = [];
function queueTextPreview(id, url) { pendingPreviews.push({ id, url }); }
async function flushTextPreviews() {
  const batch = pendingPreviews.splice(0, pendingPreviews.length);
  await Promise.all(batch.map(async ({ id, url }) => {
    const el = document.getElementById(id);
    if (!el) return;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      let text = await res.text();
      const truncated = text.length > 2000;
      el.textContent = text.slice(0, 2000) + (truncated ? '\n…(truncated — open the file to see the rest)' : '');
    } catch (err) {
      el.textContent = 'Could not load preview.';
    }
  }));
}

function attachmentHtml(url, opts) {
  opts = opts || {};
  const cls = opts.className || '';
  const kind = fileKind(url);

  if (kind === 'image') {
    return `<img class="${cls}" src="${url}" alt="" loading="lazy" ${opts.onclick ? `onclick="${opts.onclick}"` : ''}>`;
  }
  if (kind === 'video') {
    return `<video class="${cls} attach-video" src="${url}" controls preload="metadata"></video>`;
  }
  if (kind === 'audio' && !cls.includes('post-thumb')) {
    return `
      <div class="audio-attach ${cls}">
        <span class="material-symbols-rounded audio-attach-icon">music_note</span>
        <div class="audio-attach-body">
          <div class="file-chip-name">${escHtml(fileNameFromUrl(url))}</div>
          <audio controls preload="metadata" src="${url}"></audio>
        </div>
      </div>
    `;
  }

  const icon = kind === 'archive' ? 'folder_zip' : kind === 'text' ? 'description' : kind === 'audio' ? 'music_note' : 'draft';
  const chip = `
    <a class="file-chip ${cls}" href="${url}" target="_blank" rel="noopener" download>
      <span class="material-symbols-rounded">${icon}</span>
      <span class="file-chip-name">${escHtml(fileNameFromUrl(url))}</span>
    </a>
  `;
  if (kind === 'text' && opts.withPreview) {
    const pid = 'textprev-' + Math.random().toString(36).slice(2, 9);
    queueTextPreview(pid, url);
    return `<div class="text-attach">${chip}<pre class="code-preview" id="${pid}">Loading preview…</pre></div>`;
  }
  return chip;
}
