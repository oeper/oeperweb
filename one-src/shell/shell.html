<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>one</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='-70%200%20200%20200'%3E%3Cstyle%3Epath{fill:%235f6368}@media(prefers-color-scheme:dark){path{fill:%23d9d9d9}}%3C/style%3E%3Cpath%20d='M20%200H40A20%2020%200%200%201%2060%2020V180A20%2020%200%200%201%2020%20180V41A20%2020%200%200%201%200%2021V20A20%2020%200%200%201%2020%200Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap">
<style>/*M3_CSS*/</style>
<style>
:root{--seed:#3f5aa8}
body{overflow:auto;background:var(--surface)}
.home{min-height:100%;animation:fadeIn .5s var(--ease-dec)}
.home[hidden]{display:none}
.top{display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font:700 22px "Google Sans",sans-serif;letter-spacing:-.5px}
.brandmark{display:grid;place-items:center;width:30px;height:40px;color:var(--on-surface)}
.brandmark .onemark{height:34px;transition:transform .45s var(--spring)}
.brand:hover .onemark{transform:rotate(-8deg) scale(1.06)}
.top .grow{flex:1}
main{max-width:1120px;margin:0 auto;padding:12px 20px 60px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:18px 0 22px}
.hero h1{margin:0;font:500 clamp(28px,4vw,40px)/1.15 "Google Sans",sans-serif}
.hero p{margin:6px 0 0;color:var(--on-surface-variant)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.appcard{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:28px;background:var(--surface-low);text-align:left;overflow:hidden;transition:transform .4s var(--spring),box-shadow .3s var(--ease),border-radius .4s var(--spring);animation:fadeUp .5s var(--ease-dec) both;cursor:pointer;color:var(--on-surface)}
.appcard::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--c);opacity:.08;transition:transform .5s var(--spring)}
.appcard:hover{transform:translateY(-4px);box-shadow:var(--elev2);border-radius:36px}
.appcard:hover::after{transform:scale(1.5)}
.appcard:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.appcard .al{width:52px;height:52px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 22px "Google Sans",sans-serif;transition:border-radius .45s var(--spring),transform .45s var(--spring)}
.appcard:hover .al{border-radius:50%;transform:rotate(-8deg)}
.appcard .al .ms{font-size:28px;font-variation-settings:"FILL" 1}
.appcard b{font:600 18px "Google Sans",sans-serif;display:block}
.appcard small{color:var(--on-surface-variant)}
.appcard .row{display:flex;gap:6px;margin-top:auto;position:relative;z-index:1;align-items:center}
.sharebtn{display:none;width:34px;height:34px;border-radius:50%;place-items:center;color:var(--on-surface-variant);cursor:pointer;flex-shrink:0}
.cloud .sharebtn{display:inline-grid}
.sharebtn:hover,.sharebtn:focus-visible{background:var(--surface-highest);color:var(--on-surface);outline:none}
.appcard .row .sharebtn{margin-left:auto}
.sharebody .sharerow{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sharebody textarea.tf{resize:vertical;min-height:84px}
.appcard .btn{height:34px;padding:0 14px;font-size:13px}
.files-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:36px 0 12px}
.files-head h2{margin:0;font:500 22px "Google Sans",sans-serif;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{height:34px;padding:0 14px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--outline-variant);color:var(--on-surface-variant);font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background-color .2s,border-radius .35s var(--spring),box-shadow .2s}
.fchip i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.fchip.on{background:var(--secondary-container);color:var(--on-secondary-container);box-shadow:none;border-radius:17px}
.fchip small{opacity:.7}
.files{display:flex;flex-direction:column;gap:4px}
.file{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:18px;background:var(--surface-low);text-align:left;color:var(--on-surface);transition:background-color .2s,transform .3s var(--spring);animation:fadeUp .35s var(--ease-dec) both}
.file:hover{background:var(--surface-high);transform:translateX(3px)}
.file .fi{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 16px "Google Sans",sans-serif;flex:none}
.file .fi .ms{font-size:22px;font-variation-settings:"FILL" 1}
.file .grow{flex:1;min-width:0}
.file .grow b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .grow small{color:var(--on-surface-variant)}
.file time{color:var(--on-surface-variant);font-size:13px;white-space:nowrap}
.empty{padding:36px;text-align:center;color:var(--on-surface-variant);background:var(--surface-low);border-radius:24px}
.note{margin-top:28px;color:var(--on-surface-variant);font-size:13px;display:flex;gap:8px;align-items:flex-start}
.note .ms{font-size:18px}
/* app frames */
.frames{position:fixed;inset:0;z-index:20;background:var(--surface-cont)}
.frames[hidden]{display:none}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--surface-cont)}
.frames iframe.enter{animation:frameIn .38s var(--ease-dec)}
@keyframes frameIn{from{opacity:0;transform:scale(.985)}}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;background:var(--surface-cont);transition:opacity .3s}
.loading.gone{opacity:0}
.loading .al{width:64px;height:64px;border-radius:20px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 28px "Google Sans",sans-serif;animation:breathe 1.1s var(--ease) infinite alternate}
.loading .al .ms{font-size:32px}
@keyframes breathe{to{transform:scale(1.08);border-radius:50%}}
.cloudchip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border-radius:999px;background:var(--surface-high);color:var(--on-surface-variant);font:500 13px "Google Sans",sans-serif;transition:background-color .25s,color .25s;animation:fadeIn .4s}
.cloudchip:hover{background:var(--surface-highest);color:var(--on-surface)}
.cloudchip .ms{font-size:18px}
.cloudchip.synced{background:var(--secondary-container);color:var(--on-secondary-container)}
.cloudchip.syncing .ms{animation:spin 1.1s linear infinite}
.cloudchip.error{background:color-mix(in srgb,var(--error) 18%,var(--surface-high));color:var(--on-surface)}
@keyframes spin{to{transform:rotate(-360deg)}}
.cloudset .muted{color:var(--on-surface-variant);margin:0;line-height:1.55}.cloudset .small{font-size:12.5px}
.cloudset a{color:var(--primary)}
.acct{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 14px;border-radius:16px;background:var(--surface-high)}
.acct span{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.file .synced{font-size:16px;color:var(--primary);vertical-align:-3px;margin-left:6px}
@media (max-width:560px){.cloudchip span{display:none}.cloudchip{padding:0 9px}.apps{grid-template-columns:1fr 1fr}.appcard{padding:14px;border-radius:22px}.file time{display:none}}
</style>
</head>
<body>
<div class="home" id="home">
  <header class="top">
    <div class="brand"><span class="brandmark"><svg class="onemark" viewBox="0 0 60 200" aria-hidden="true"><path d="M20 0H40A20 20 0 0 1 60 20V180A20 20 0 0 1 20 180V41A20 20 0 0 1 0 21V20A20 20 0 0 1 20 0Z" fill="currentColor"/></svg></span>one</div>
    <span class="grow"></span>
    <span id="cloudSlot"></span>
    <button class="tb-btn" id="seedBtn" title="Color"><span class="ms" aria-hidden="true">palette</span></button>
    <button class="tb-btn" id="settingsBtn" title="Settings" hidden><span class="ms" aria-hidden="true">settings</span></button>
    <span id="avatarSlot"></span>
  </header>
  <main>
    <div class="hero">
      <div><h1 id="greet">Hello</h1><p>Documents, spreadsheets, slides, notes and PDFs. Everything stays in this browser.</p></div>
      <label class="home-search"><span class="ms" aria-hidden="true">search</span><input id="q" placeholder="Search all your files" aria-label="Search all your files"></label>
    </div>
    <section class="apps" id="apps" aria-label="Apps"></section>
    <div class="files-head"><h2>Your files</h2></div>
    <div class="chips" id="chips"></div>
    <div class="files" id="files"></div>
    <p class="note"><span class="ms" aria-hidden="true">lock</span><span>Files are kept in this browser’s storage for this page’s address, so they stay private to this device. Use each app’s File › Export to keep a copy elsewhere.</span></p>
  </main>
</div>
<div class="frames" id="frames" hidden></div>

<script>window.ONE_SHELL = true;</script>
<script>/*CORE_JS*/</script>
<script>
const APP_SRC = /*APP_SRC*/;
(() => {
'use strict';
const { $, el, esc, icon, store } = { $:s => document.querySelector(s), el:ONE.el, esc:ONE.esc, icon:ONE.icon, store:ONE.store };
ONE.boot('one', 'home');
const APPS = ONE.APPS, byId = Object.fromEntries(APPS.map(a => [a.id, a]));
const LIBS = { word:['ow-lib', 'description'], sheet:['os-lib', 'table_chart'], slide:['op-lib', 'slideshow'], idea:['oi-lib', 'book_2'] };
const NEW_LABEL = { word:'Blank document', sheet:'Blank workbook', slide:'New presentation', idea:'New notebook', pdf:'Open a PDF' };
const logo = a => a.icon ? icon(a.icon) : esc(a.letter);
let filter = 'all', files = [];

/* ---------- files from every app ---------- */
const meta = (id, m) => id === 'word' ? `${(m.words || 0).toLocaleString()} words` : id === 'sheet' ? `${m.sheets || 1} sheet${m.sheets > 1 ? 's' : ''}` : id === 'slide' ? `${m.slides || 0} slide${m.slides === 1 ? '' : 's'}` : id === 'idea' ? `${m.sections || 0} sections · ${m.pages || 0} pages` : '';
function pdfFiles(){
  return new Promise(ok => { try {
    const r = indexedDB.open('PdfToolsViewerDB'); r.onerror = () => ok([]);
    r.onupgradeneeded = () => { r.transaction.abort(); ok([]); };
    r.onsuccess = () => { const db = r.result; if (!db.objectStoreNames.contains('pdfs')) { db.close(); return ok([]); } const out = []; const c = db.transaction('pdfs', 'readonly').objectStore('pdfs').openCursor();
      c.onsuccess = () => { const cur = c.result; if (!cur) { db.close(); return ok(out); } const v = cur.value; out.push({ app:'pdf', id:v.id, title:v.name || 'PDF', updated:v.ts || 0, meta:v.data ? `${(v.data.byteLength / 1048576).toFixed(1)} MB` : 'PDF' }); cur.continue(); }; c.onerror = () => ok(out); };
  } catch { ok([]); } });
}
async function loadFiles(){
  const list = [];
  Object.entries(LIBS).forEach(([app, [key]]) => { const lib = store.get(key, { docs:{} }); Object.entries(lib.docs || {}).forEach(([id, m]) => list.push({ app, id, title:m.title || 'Untitled', updated:m.updated || 0, meta:meta(app, m) })); });
  list.push(...await pdfFiles());
  files = list.sort((a, b) => b.updated - a.updated);
  renderApps(); renderFiles();
}
const when = t => { if (!t) return ''; const d = Date.now() - t; if (d < 60000) return 'Just now'; if (d < 3600000) return Math.floor(d / 60000) + ' min ago'; if (d < 86400000) return Math.floor(d / 3600000) + ' h ago'; return new Date(t).toLocaleDateString(undefined, { month:'short', day:'numeric', year:new Date(t).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }); };

// Share button for an app card / file row (only shown in the oeper.dev build — see .cloud in the CSS).
function shareBtn(target, label){
  const go = e => { e.stopPropagation(); e.preventDefault(); if (window.ONE_CLOUD) window.ONE_CLOUD.share(target()); };
  return el('span', { class:'sharebtn', role:'button', tabindex:0, title:label, 'aria-label':label, html:icon('share'), onclick:go, onkeydown:e => { if (e.key === 'Enter' || e.key === ' ') go(e); } });
}
function renderApps(){
  const box = $('#apps'); box.innerHTML = '';
  APPS.forEach((a, i) => {
    const n = files.filter(f => f.app === a.id).length;
    const card = el('div', { class:'appcard', role:'button', tabindex:0, style:{ '--c':a.color, animationDelay:i * 60 + 'ms' }, 'aria-label':`Open ${a.name}` },
      el('span', { class:'al', html:logo(a) }), el('span', {}, el('b', { text:a.name }), el('small', { text:`${a.what} · ${n} file${n === 1 ? '' : 's'}` })),
      el('div', { class:'row' }, el('button', { class:'btn tonal', html:`${icon(a.id === 'pdf' ? 'upload_file' : 'add')}${a.id === 'pdf' ? 'Open' : 'New'}`, title:NEW_LABEL[a.id], onclick:e => { e.stopPropagation(); a.id === 'pdf' ? openApp('pdf') : openApp(a.id, { type:'new', template:'blank' }); } }),
        shareBtn(() => ({ kind:'tool', app:a.id, title:a.name }), `Share ${a.name}`)));
    card.onclick = () => openApp(a.id); card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openApp(a.id); } };
    box.append(card);
  });
}
function renderFiles(){
  const q = $('#q').value.trim().toLowerCase();
  const chips = $('#chips'); chips.innerHTML = '';
  [['all', 'All', null], ...APPS.map(a => [a.id, a.what, a.color])].forEach(([k, t, c]) => { const n = k === 'all' ? files.length : files.filter(f => f.app === k).length; chips.append(el('button', { class:'fchip' + (filter === k ? ' on' : ''), style:c ? { '--c':c } : null, html:`${c ? '<i></i>' : ''}${esc(t)} <small>${n}</small>`, onclick:() => { filter = k; renderFiles(); } })); });
  const list = files.filter(f => (filter === 'all' || f.app === filter) && (!q || f.title.toLowerCase().includes(q)));
  const box = $('#files'); box.innerHTML = '';
  if (!list.length) box.append(el('div', { class:'empty', text:q ? 'No files match that search.' : files.length ? 'Nothing here yet.' : 'No files yet. Start one from an app above.' }));
  list.slice(0, 300).forEach((f, i) => { const a = byId[f.app];
    box.append(el('button', { class:'file', style:{ '--c':a.color, animationDelay:Math.min(i, 20) * 20 + 'ms' }, onclick:() => openApp(f.app, { type:'open', id:f.id }) }, el('span', { class:'fi', html:logo(a) }), el('span', { class:'grow', html:`<b>${esc(f.title)}</b><small>${esc(a.name)}${f.meta ? ' · ' + esc(f.meta) : ''}${window.ONE_CLOUD && window.ONE_CLOUD.enabled() && window.ONE_CLOUD.isSynced(f.app, f.id) ? '<span class="ms synced" title="Saved to your oeper.dev account">cloud_done</span>' : ''}</small>` }), shareBtn(() => ({ kind:'file', app:f.app, id:f.id, title:f.title }), `Share ${f.title}`), el('time', { text:when(f.updated) }))); });
}
$('#q').addEventListener('input', renderFiles);
$('#seedBtn').onclick = e => ONE.seedMenu(e.currentTarget);
const hr = new Date().getHours(); $('#greet').textContent = hr < 5 ? 'Up late?' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';

/* ---------- app frames ---------- */
const frames = {}, ready = {}, queue = {};
let current = null;
function openApp(id, action, fromHistory){
  const a = byId[id]; if (!a || !APP_SRC[id]) return;
  let f = frames[id];
  if (!f) {
    if (action && action.type === 'open') { store.set('one-open', { app:id, id:action.id, t:Date.now() }); action = null; }
    const load = el('div', { class:'loading', style:{ '--c':a.color }, html:`<span class="al">${logo(a)}</span>` });
    f = frames[id] = el('iframe', { title:a.name, allow:'microphone; clipboard-read; clipboard-write; fullscreen', allowfullscreen:true });
    f.addEventListener('load', () => setTimeout(() => { load.classList.add('gone'); setTimeout(() => load.remove(), 300); }, 150));
    $('#frames').append(load, f); f.srcdoc = APP_SRC[id];
  }
  if (action) { if (ready[id]) send(id, action); else (queue[id] = queue[id] || []).push(action); }
  Object.entries(frames).forEach(([k, x]) => { x.hidden = k !== id; });
  if (current !== id) { f.classList.remove('enter'); void f.offsetWidth; f.classList.add('enter'); }
  current = id; $('#frames').hidden = false; $('#home').hidden = true; document.title = a.name + ' · one';
  if (!fromHistory) try { history.pushState({ app:id }, '', '#' + id); } catch {}
  setTimeout(() => { try { f.contentWindow.focus(); } catch {} }, 60);
}
const send = (id, action) => setTimeout(() => frames[id] && frames[id].contentWindow.postMessage(Object.assign({ one:true, to:id }, action), '*'), action.type === 'new' ? 200 : 0);
function showHome(fromHistory){
  current = null; $('#frames').hidden = true; $('#home').hidden = false; document.title = 'one'; loadFiles();
  if (!fromHistory) try { history.pushState({ app:null }, '', location.pathname + location.search); } catch {}
}
addEventListener('message', e => {
  const m = e.data; if (!m || !m.one || !m.from) return;
  const src = Object.entries(frames).find(([, f]) => f.contentWindow === e.source); if (!src || src[0] !== m.from) return;
  if (m.type === 'ready') { ready[m.from] = true; (queue[m.from] || []).forEach(a => send(m.from, a)); queue[m.from] = []; }
  if (m.type === 'home') showHome();
  if (m.type === 'switch' && byId[m.app]) openApp(m.app);
});
addEventListener('popstate', e => { const id = e.state && e.state.app; if (id && byId[id]) openApp(id, null, true); else showHome(true); });
let lt; addEventListener('storage', () => { if (!$('#home').hidden) { clearTimeout(lt); lt = setTimeout(loadFiles, 300); } });
ONE.mountAvatar(document.getElementById('avatarSlot'));
window.ONE_SHELL_API = { refresh:() => { if (!$('#home').hidden) loadFiles(); }, frameLoaded:id => !!frames[id] && !!ready[id], openApp };
loadFiles();
// #word opens an app; #open=word:<id> (the links oeper.dev/files uses) opens one document, once cloud sync had a chance to bring it in.
const clearHash = () => { try { history.replaceState({ app:null }, '', location.pathname + location.search); } catch {} };
async function openFromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (byId[h]) { clearHash(); return openApp(h); }
  if (h.startsWith('shared=')) {
    const rest = h.slice(7), i = rest.indexOf(':'); clearHash();
    if (i < 0) return;
    if (document.readyState === 'loading') await new Promise(r => addEventListener('DOMContentLoaded', r, { once:true }));
    await Promise.resolve(window.ONE_CLOUD && window.ONE_CLOUD.ready);
    if (!window.ONE_CLOUD) return ONE.toast('Open this link on oeper.dev/one to get your own copy.');
    const got = await window.ONE_CLOUD.openShared(rest.slice(0, i), rest.slice(i + 1));
    if (got) { await loadFiles(); openApp(got.app, { type:'open', id:got.id }); }
    return;
  }
  if (!h.startsWith('open=')) return;
  const [app, id] = h.slice(5).split(':'); clearHash();
  if (document.readyState === 'loading') await new Promise(r => addEventListener('DOMContentLoaded', r, { once:true }));
  await Promise.resolve(window.ONE_CLOUD && window.ONE_CLOUD.ready);
  if (window.ONE_CLOUD && window.ONE_CLOUD.enabled()) await window.ONE_CLOUD.syncAll();
  await loadFiles();
  if (!byId[app]) return;
  if (files.some(f => f.app === app && String(f.id) === id)) return openApp(app, { type:'open', id });
  // Not on this device yet (cloud saving is off, or it hasn't synced): pull just this file from the account and open it.
  if (window.ONE_CLOUD && await window.ONE_CLOUD.fetchOne(app, id)) {
    await loadFiles();
    if (files.some(f => f.app === app && String(f.id) === id)) return openApp(app, { type:'open', id });
  }
  ONE.toast('That file couldn’t be found in your oeper.dev account.');
}
addEventListener('hashchange', openFromHash);
openFromHash();
})();
</script>
