<!DOCTYPE html>
<html lang="en">

<meta property="og:description" content="Chat with epic AI, self-hosted on oeper.dev">

<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Freehand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared/fonts.css?v=1">

<!-- KaTeX renders $inline$ and $$block$$ math in assistant replies (see
     renderMathOrFallback/parseAiMarkdown below). Loaded with defer so it
     doesn't block first paint, but still executes before our own
     type="module" script further down — defer scripts and module scripts
     run in document order once parsing finishes, so window.katex is
     guaranteed ready by the time any message actually renders. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :focus { outline: none; }
  :focus-visible { outline: none; }

  :root {
    --md-sys-color-background: #111318;
    --md-sys-color-surface: #1a1c22;
    --md-sys-color-surface-variant: #2f353d;
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-on-primary: #062e6f;
    --md-sys-color-secondary-container: #33485d;
    --md-sys-color-on-secondary-container: #d2e4ff;
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c7c5;
    --md-sys-color-outline: #43474e;
    --md-sys-color-outline-variant: #8c9199;
    --md-sys-color-error: #ffb4ab;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse 900px 500px at 50% -10%, var(--md-sys-color-secondary-container) 0%, var(--md-sys-color-background) 60%);
    background-color: var(--md-sys-color-background);
    font-family: var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif);
    color: var(--md-sys-color-on-surface);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Gemini-style shell: a chats sidebar next to the main chat column. The
     sidebar (#chatsPanel) is a fixed-position off-canvas drawer at narrow
     widths (unchanged interaction from before, just moved to the left) and
     becomes a permanently-visible in-flow column at >=900px — see the
     media query near .chats-panel below. .ai-shell only actually matters
     as a flex row on desktop; on mobile the drawer is position:fixed and
     doesn't participate in flex layout, so .page fills the width either way. */
  .ai-shell { display: flex; align-items: flex-start; }

  .page { position: relative; flex: 1; min-width: 0; max-width: 760px; margin: 0 auto; padding: 40px 24px 24px; min-height: 100vh; display: flex; flex-direction: column; }

  /* Sticky so the sidebar toggle/new-chat shortcut stay reachable without
     scrolling back to the top of a long conversation — this is what "i
     dont wanna have to scroll all the way up to look at my chats" was
     about. Sticks right below the sitewide topnav (72px, see topnav.js). */
  .header {
    position: sticky; top: 72px; z-index: 90; margin: -10px -24px 10px; padding: 10px 24px;
    background: var(--md-sys-color-background);
  }
  .header-row { display: flex; align-items: center; gap: 12px; }
  .header h1 {
    flex: 1; display: flex; align-items: center; gap: 8px;
    font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 400;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--md-sys-color-primary), var(--md-sys-color-on-secondary-container));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  /* The gradient text-fill above would otherwise apply to the icon glyph
     too (it's just another text glyph as far as background-clip:text is
     concerned), rendering it with a half-transparent gradient instead of
     a normal filled icon — reset both back to a plain solid color. */
  .header h1 .material-symbols-rounded {
    font-size: 0.8em; background: none; -webkit-text-fill-color: var(--md-sys-color-primary); color: var(--md-sys-color-primary);
  }
  .header-icon-btn {
    width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--md-sys-color-surface-variant);
    color: var(--md-sys-color-on-surface); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .header-icon-btn:hover { background-color: var(--md-sys-state-hover); }
  /* Only meaningful on mobile, where the sidebar is a drawer someone has to
     open — hidden at the desktop breakpoint since the sidebar's always
     visible there and its own "new chat" button already covers this. */
  .sidebar-toggle-group { display: flex; gap: 8px; }

  .chat-shell { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .chat-messages { flex: 1; display: flex; flex-direction: column; padding-bottom: 16px; transition: opacity 0.15s ease; }

  .chat-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--md-sys-color-on-surface-variant); text-align: center; gap: 12px; min-height: 240px;
  }
  .chat-empty .material-symbols-rounded { font-size: 40px; color: var(--md-sys-color-primary); }

  .msg { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start; animation: msgIn 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .msg.user { flex-direction: row-reverse; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
  }
  .msg-avatar .material-symbols-rounded { font-size: 18px; }
  .msg-col { display: flex; flex-direction: column; max-width: 78%; }
  .msg.user .msg-col { align-items: flex-end; }
  .msg-attach-img { max-width: 220px; max-height: 220px; border-radius: 14px; object-fit: cover; margin-bottom: 6px; display: block; }
  .msg-bubble {
    padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.55;
    white-space: pre-wrap; word-wrap: break-word; background: var(--md-sys-color-surface); max-width: 100%;
  }
  .msg.user .msg-bubble { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border-bottom-right-radius: 4px; }
  .msg.assistant .msg-bubble { border-bottom-left-radius: 4px; }
  .msg-bubble.error { color: var(--md-sys-color-error); }
  .msg-actions { display: flex; margin-top: 4px; }
  .msg.user .msg-actions { justify-content: flex-end; }
  .msg-action-btn {
    width: 26px; height: 26px; border-radius: 50%; border: none; background: none; cursor: pointer;
    color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; justify-content: center;
  }
  .msg-action-btn:hover { background: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }
  .msg-action-btn .material-symbols-rounded { font-size: 16px; }
  .msg-bubble.thinking::after {
    content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--md-sys-color-primary); animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  /* Markdown rendering inside assistant bubbles */
  /* Real block HTML (p/ul/blockquote/etc, not just inline replaces) is now
     emitted for the answer, so it needs normal whitespace collapsing —
     .msg-bubble's own pre-wrap (kept for the raw fallback/plain-text case)
     would otherwise turn the newlines *between* these block tags into
     extra visible blank lines, same issue .thinking-content ran into. */
  .msg-bubble .answer-content { white-space: normal; }
  .msg-bubble a { color: inherit; text-decoration: underline; }
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3, .msg-bubble h4, .msg-bubble h5, .msg-bubble h6 {
    font-weight: 600; margin: 10px 0 4px; line-height: 1.3;
  }
  .msg-bubble h1:first-child, .msg-bubble h2:first-child, .msg-bubble h3:first-child,
  .msg-bubble h4:first-child, .msg-bubble h5:first-child, .msg-bubble h6:first-child { margin-top: 0; }
  .msg-bubble h1 { font-size: 1.3em; } .msg-bubble h2 { font-size: 1.2em; } .msg-bubble h3 { font-size: 1.1em; }
  .msg-bubble h4, .msg-bubble h5, .msg-bubble h6 { font-size: 1em; }
  .msg-bubble p { margin: 4px 0; }
  .msg-bubble p:first-child { margin-top: 0; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble ul, .msg-bubble ol { margin: 4px 0; padding-left: 22px; }
  .msg-bubble ul ul, .msg-bubble ul ol, .msg-bubble ol ul, .msg-bubble ol ol { margin: 2px 0; }
  .msg-bubble li { margin-bottom: 3px; }
  .msg-bubble .md-task-checkbox { margin: 0 4px 0 -18px; vertical-align: middle; }
  .msg-bubble hr { border: none; border-top: 1px solid rgba(127,127,127,0.35); margin: 10px 0; }
  .msg-bubble blockquote {
    margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--md-sys-color-primary);
    opacity: 0.85; color: inherit;
  }
  .msg-bubble blockquote p { margin: 4px 0; }
  .msg-bubble del { opacity: 0.65; }
  .msg-bubble .md-img { max-width: 100%; border-radius: 10px; margin: 6px 0; display: block; }
  .msg-bubble code { background: rgba(127,127,127,0.2); border-radius: 4px; padding: 1px 5px; font-size: 0.9em; }
  .msg-bubble .math-block { margin: 8px 0; overflow-x: auto; overflow-y: hidden; }
  .msg-bubble .math-inline { overflow-x: auto; overflow-y: hidden; display: inline-block; max-width: 100%; vertical-align: middle; }
  .msg-bubble .katex { color: inherit; font-size: 1.05em; }
  .msg-bubble .katex-display { margin: 0; }
  .msg-bubble .code-block-wrap {
    background: rgba(0,0,0,0.25); border-radius: 10px; margin: 8px 0; overflow: hidden;
  }
  .msg-bubble .code-block-header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 8px 6px 14px; background: rgba(0,0,0,0.18); font-size: 12px;
  }
  .msg-bubble .code-block-lang { opacity: 0.7; text-transform: lowercase; }
  .msg-bubble .code-block-copy-btn {
    display: inline-flex; align-items: center; gap: 4px; border: none; background: none; color: inherit;
    opacity: 0.7; cursor: pointer; font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 6px;
  }
  .msg-bubble .code-block-copy-btn:hover { opacity: 1; background: rgba(127,127,127,0.2); }
  .msg-bubble .code-block-copy-btn .material-symbols-rounded { font-size: 15px; }
  .msg-bubble pre.code-block {
    padding: 12px 14px; margin: 0; overflow-x: auto; font-size: 13px; line-height: 1.5;
  }
  .msg-bubble pre.code-block code { background: none; padding: 0; }
  .msg-bubble a.md-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
    padding: 6px 12px; border-radius: 100px; background: rgba(127,127,127,0.2);
    color: inherit; text-decoration: none; margin: 4px 6px 4px 0; vertical-align: middle;
  }
  .msg-bubble a.md-btn:hover { background: rgba(127,127,127,0.32); }
  .msg-bubble a.md-btn .material-symbols-rounded { font-size: 14px; }
  .msg-bubble .md-table { border-collapse: collapse; margin: 8px 0; font-size: 0.9em; max-width: 100%; display: block; overflow-x: auto; }
  .msg-bubble .md-table th, .msg-bubble .md-table td { border: 1px solid rgba(127,127,127,0.35); padding: 5px 9px; text-align: left; }
  .msg-bubble .md-table th { background: rgba(127,127,127,0.15); font-weight: 600; }

  /* white-space: normal overrides the pre-wrap inherited from .msg-bubble
     (needed there to preserve line breaks in message text). Without this,
     the whitespace/newlines between this block's own <div> tags in the
     template literal render as actual blank lines instead of collapsing —
     that was the real cause of the "show thinking area is too big" gap,
     nothing to do with the open/collapse animation itself. .thinking-content
     below re-enables pre-wrap specifically for the reasoning text, which
     does need its line breaks preserved. */
  .thinking-block { margin-bottom: 8px; font-size: 13px; white-space: normal; }
  .thinking-summary {
    cursor: pointer; color: var(--md-sys-color-on-surface-variant); font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px; user-select: none; line-height: 1.2;
  }
  .thinking-summary:hover { color: var(--md-sys-color-on-surface); }
  /* Material Symbols glyphs carry a much taller line-height than their
     font-size implies (the font's own internal metrics, not something
     font-size alone controls) — without line-height:1 here this icon alone
     was stretching the whole summary row noticeably taller than the text
     next to it needed. */
  .thinking-caret { font-size: 18px; line-height: 1; transition: transform 0.2s ease; }
  .thinking-block.open .thinking-caret { transform: rotate(180deg); }
  /* Used to animate open/close via the CSS grid 0fr->1fr row trick, but
     that collapsed unreliably in practice — the wrap/content elements
     measured 0 height on their own, yet .thinking-block (their parent)
     still reserved ~90px of dead space below the "Show thinking" line
     even while fully collapsed, visible as a large empty gap. Plain
     display:none/block has no such ambiguity; a short fade-in on open
     is enough of a transition without touching layout height at all. */
  .thinking-content-wrap { display: none; }
  .thinking-block.open .thinking-content-wrap { display: block; animation: thinkingFadeIn 0.2s ease; }
  @keyframes thinkingFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .thinking-content {
    color: var(--md-sys-color-on-surface-variant); white-space: pre-wrap; line-height: 1.5;
  }
  .thinking-content-inner {
    margin-top: 6px; padding: 8px 12px; border-left: 2px solid var(--md-sys-color-outline);
  }

  .attach-preview { display: flex; padding: 0 4px 10px; }
  .attach-preview-item { position: relative; width: 64px; height: 64px; animation: popIn 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .attach-preview-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
  @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  .attach-remove-btn {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--md-sys-color-background);
    background: var(--md-sys-color-error); color: #410002; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    transition: transform 0.15s;
  }
  .attach-remove-btn:hover { transform: scale(1.1); }
  .attach-remove-btn .material-symbols-rounded { font-size: 14px; }

  /* Groups attach-preview + model-bar + chat-inputbar into one sticky unit.
     Only chat-inputbar used to be sticky on its own — in an empty chat
     (nothing above it to push it down through normal flex flow) that let
     model-bar end up sitting at the same spot the sticky input bar pins
     itself to, hidden underneath it: the model picker was invisible and
     unclickable for anyone opening a fresh chat. Sticking the whole group
     together means model-bar is always positioned right above the input,
     regardless of how much (or how little) is above it. */
  .chat-input-area { position: sticky; bottom: 16px; }
  /* shared/topnav.js's mobile bottom nav bar (Home/Create/Profile) sits
     fixed at the very bottom of the screen below 600px — without this,
     it covers this sticky input bar instead of sitting below it. */
  @media (max-width: 600px) {
    .chat-input-area { bottom: calc(64px + env(safe-area-inset-bottom, 0px) + 16px); }
  }
  .model-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; padding: 0 4px; }
  .model-bar .oe-dropdown-btn { font-size: 12px; font-weight: 500; padding: 5px 12px; }
  /* This dropdown sits right above the sticky input bar at the very
     bottom of the screen — dropdown.js's default open-downward behavior
     (shared by every dropdown site-wide, not worth changing generally)
     would clip the option list under the input bar here specifically, so
     just this instance opens upward instead. */
  .model-bar .oe-dropdown-list { top: auto; bottom: calc(100% + 6px); }

  .chat-inputbar {
    display: flex; align-items: flex-end; gap: 4px;
    background: var(--md-sys-color-surface-variant); border: none;
    border-radius: 100px; padding: 8px 8px 8px 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .attach-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; flex-shrink: 0; background: transparent;
    color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .attach-btn:hover { color: var(--md-sys-color-on-surface); background: var(--md-sys-state-hover); }
  .attach-btn input { display: none; }
  #chatInput {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--md-sys-color-on-surface); font-family: var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif);
    font-size: 15px; line-height: 1.5; max-height: 160px; padding: 8px 0;
  }
  #chatInput::placeholder { color: var(--md-sys-color-on-surface-variant); }

  .send-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: opacity 0.2s, background-color 0.2s, transform 0.12s;
  }
  .send-btn:active:not(:disabled) { transform: scale(0.9); }
  .send-btn:disabled { opacity: 0.4; cursor: default; }
  .send-btn .material-symbols-rounded { transition: transform 0.2s ease; }
  .send-btn.stop { background: var(--md-sys-color-error); color: #410002; }

  .chat-footnote {
    text-align: center; font-size: 12px; color: var(--md-sys-color-on-surface-variant);
    margin-top: 12px; line-height: 1.5;
  }
  .link-btn {
    background: none; border: none; color: var(--md-sys-color-primary); font-size: 12px;
    font-family: inherit; cursor: pointer; text-decoration: underline; padding: 0;
  }

  /* Chats sidebar — an off-canvas drawer on the left below ~900px (open via
     #chatsBtn, closed via the backdrop or #chatsCloseBtn), and a permanent
     in-flow sidebar next to .page above that, Gemini-style. Same DOM/JS
     either way (openChatsPanel/closeChatsPanel just toggle the .open class,
     which is harmless-but-irrelevant once the desktop rule below forces it
     visible) — only the CSS positioning changes per breakpoint. */
  .chats-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .chats-overlay.open { opacity: 1; pointer-events: all; }
  .chats-panel {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 84vw); background: var(--md-sys-color-background);
    box-shadow: 12px 0 32px rgba(0,0,0,0.4); z-index: 201; transform: translateX(-100%);
    transition: transform 0.25s; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px;
  }
  .chats-panel.open { transform: translateX(0); }
  .chats-panel-header { display: flex; align-items: center; justify-content: space-between; }
  .chats-panel-header h3 { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 18px; font-weight: 500; }
  .new-chat-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
    border: none; border-radius: 100px; padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .new-chat-btn:hover { opacity: 0.9; }
  .chats-list { display: flex; flex-direction: column; gap: 4px; }
  .chats-empty { color: var(--md-sys-color-on-surface-variant); font-size: 13px; text-align: center; padding: 20px 0; }
  .chat-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; cursor: pointer;
    color: var(--md-sys-color-on-surface-variant);
  }
  .chat-row:hover { background: var(--md-sys-state-hover); }
  .chat-row.active { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
  .chat-row .material-symbols-rounded:first-child { font-size: 18px; flex-shrink: 0; }
  .chat-row-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .chat-row-delete {
    width: 28px; height: 28px; border-radius: 50%; border: none; background: none; color: inherit; opacity: 0.6;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .chat-row-delete:hover { opacity: 1; background: rgba(0,0,0,0.15); }
  .chat-row-delete .material-symbols-rounded { font-size: 16px; }

  @media (min-width: 900px) {
    .chats-panel {
      position: sticky; top: 72px; height: calc(100vh - 72px); flex-shrink: 0;
      transform: none; box-shadow: none; border-right: 1px solid var(--md-sys-color-outline-variant);
    }
    .chats-overlay { display: none; }
    .chats-panel-header, #chatsCloseBtn { display: none; }
    .sidebar-toggle-group { display: none; }
  }

  /* Memory viewer — a centered modal (not a drawer like the chats sidebar
     above) since it's just a short, flat list to skim and prune, not
     something worth a whole permanent sidebar slot. */
  .memory-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 220; opacity: 0; pointer-events: none;
    transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .memory-overlay.open { opacity: 1; pointer-events: all; }

<script type="module">
import { db, SERVER_ENDPOINT, getCurrentUser, onAccountChange } from './shared/account.js?v=32';
import { mountTopNav } from './shared/topnav.js?v=29';
import { mountFooter } from './shared/footer.js?v=5';
import { createDropdown } from './shared/dropdown.js?v=2';
import { oeAlert, oeConfirm, oePrompt } from './shared/dialog.js?v=4';
import { observeList } from './shared/motion.js?v=1';
import { doc, onSnapshot, setDoc, arrayUnion, arrayRemove } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
mountTopNav();
mountFooter();

const AI_ENDPOINT = 'https://oeper-ai.oeper.workers.dev';

// Sent as the first message on every request, never shown in the UI or
// persisted as a visible chat message — just steers tone/formatting.
//
// The site-info section exists so the AI can actually answer "what is this
// site" / "how do I do X here" questions instead of guessing or claiming
// ignorance — it used to have zero information about oeper.dev beyond its
// own name. Kept at the level of "what pages exist and what they're for"
// rather than exhaustive feature-by-feature detail, since that's the part
// unlikely to go stale as the site keeps changing; page contents (which
// posts exist, who's signed in, etc.) are never included here regardless —
// this is static instructions, not live site data (that's what the
// lookup_oeper_user tool is for).
//
// No longer asks for an explicit <think>...</think> wrapper — this model
// already streams its own reasoning through a separate native channel
// (see reasoning_content handling in cf-ai-worker), so that instruction was
// pure redundancy left over from an earlier model that didn't have one.
// Worse than redundant, actually: since the model already reasons on its
// own channel, telling it to ALSO wrap reasoning in literal <think> tags
// inside its visible answer sometimes made it do exactly that — writing
// <think>...</think> out as plain text in the answer, on top of the
// already-separate reasoning stream, which is what "the AI got stuck /
// showed raw <think> tags" was.
const SYSTEM_PROMPT = `You are a helpful, friendly AI assistant embedded on a personal website (oeper.dev). Be concise but thorough when it actually helps. Format responses using Markdown — headings, **bold**, *italic*, ~~strikethrough~~, blockquotes, ordered/unordered/task lists, tables, horizontal rules, and fenced \`\`\` code blocks — whenever it improves readability, especially for code, structured data, or step-by-step instructions. For math and equations, use LaTeX: $...$ for inline math and $$...$$ on its own line for display/block equations — never describe an equation in plain words or ASCII art when LaTeX would render it properly. Never write <think> tags, "the user is asking...", or any other visible commentary about your own reasoning — go straight to the answer.

Here's what's on oeper.dev, so you can actually help people navigate or use it instead of guessing or claiming you don't know:
- Home (/) — an Instagram-style feed of posts and videos from everyone on the site, with stories, likable/repliable comments, and search.
- Feed (/feed) — forum-style text posts, organized by tag (general, showcase, help, feedback), with voting, comments, and polls.
- Videos (/videos) — longer-form video uploads, with comments and voting.
- Files (/files) — personal file storage: upload and organize files into folders, share links, or browse public downloads other users have shared.
- Messages (/messages) — direct messages and group chats, supporting image/video/file attachments, voice messages (DMs only), replies, and message reactions.
- You (epic AI, at /ai) — this chat. You have three tools: search_web for current information on the live web, lookup_oeper_user for real, live data about a specific oeper.dev user by their @handle (display name, bio, badge, member-since date), and remember_fact to save something worth recalling in future conversations with this user. Use lookup_oeper_user whenever someone asks about a specific @handle — don't guess or say you have no way to check. Use remember_fact when the user shares a genuinely useful fact or preference (has no effect if they're not signed in) — see the tool's own description for what's worth remembering.
- Tools (/tools) — small standalone utilities: a Music Composer (melody grid), onePDF (in-browser PDF splitting/merging/editing), and a QR code maker.
- Articles (/articles) and Downloads (/downloads) — curated articles and downloadable resources.
- Profiles (/profile?u=handle) — a user's posts, a saved-items tab, follower/following counts, and badges (an OFFICIAL badge marks the site's owners; anyone can also be granted a custom badge by an owner).
- Settings (/settings) — theme picker, profile editing, a signed-in-devices log, and badge management.
Sign-in is Google-only, site-wide.`;

function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const EMOJI_SHORTCODES = {
  smile: '😄', laugh: '😂', wink: '😉', heart: '❤️', fire: '🔥', thumbsup: '👍',
  thumbsdown: '👎', clap: '👏', wave: '👋', thinking: '🤔', eyes: '👀', tada: '🎉',
  rocket: '🚀', check: '✅', x: '❌', star: '⭐', warning: '⚠️', 100: '💯',
};
function expandShortcodes(text) {
  return text.replace(/:([a-z0-9_+-]+):/g, (m, name) => EMOJI_SHORTCODES[name] || m);
}

// Renders a LaTeX expression via KaTeX (loaded in <head>, see the comment
// there) into ready-to-embed HTML. Falls back to showing the raw $...$/
// $$...$$ source, escaped, rather than throwing or silently eating the
// text — both if KaTeX hasn't loaded yet for some reason and if the LaTeX
// itself is malformed (throwOnError: false already covers the latter, but
// katex.renderToString can still throw for a few edge cases it doesn't
// consider "parse errors").
function renderMathOrFallback(expr, display) {
  const raw = display ? `$$${expr}$$` : `$${expr}$`;
  if (typeof katex === 'undefined') return escHtml(raw);
  try {
    return katex.renderToString(expr.trim(), { throwOnError: false, displayMode: display, output: 'htmlAndMathml' });
  } catch {
    return escHtml(raw);
  }
}

// Inline formatting: bold/italic (incl. combined ***bold italic***),
// strikethrough, images, the [[Button]](url) styled-link syntax, links,
// and bare autolinks. Applied to already-HTML-escaped text (entities and
// stashed placeholders only) coming out of a single block's content, so
// none of this ever sees raw < > & from the model's own output.
function parseInline(text) {
  return text
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g, '<em>$1</em>')
    .replace(/(?<!_)__(.+?)__(?!_)/g, '<strong>$1</strong>')
    .replace(/(?<!\w)_([^_\n]+?)_(?!\w)/g, '<em>$1</em>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>')
    .replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g, '<img class="md-img" src="$2" alt="$1" loading="lazy">')
    .replace(/\[\[([^\]]+)\]\]\((https?:\/\/[^)]+)\)/g, '<a class="md-btn" href="$2" target="_blank" rel="noopener"><span class="material-symbols-rounded">arrow_forward</span>$1</a>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(?<!["'>])(https?:\/\/[^\s<]+[^\s<.,:;!?'")\]])/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}

// Groups consecutive '- '/'* '/'+ ' or '1. ' lines (tracking indentation
// depth in units of 2 spaces) into a real, possibly-nested <ul>/<ol> tree.
// '- [ ] '/'- [x] ' items render as disabled checkboxes instead of bullets.
// Returns null if `lines` isn't actually a list so the block parser can
// fall through to its other block types.
function parseListBlock(lines) {
  const itemRe = /^([ \t]*)(?:([-*+])|(\d+)\.)[ \t]+(.*)$/;
  if (!itemRe.test(lines[0])) return null;
  let i = 0;
  function parseAt(indentLevel) {
    const items = [];
    let ordered = null;
    while (i < lines.length) {
      const m = lines[i].match(itemRe);
      if (!m) break;
      const indent = m[1].replace(/\t/g, '  ').length;
      if (indent !== indentLevel) break; // shallower: belongs to caller. deeper: consumed by the recursive call below, never seen here.
      if (ordered === null) ordered = m[3] !== undefined;
      i++;
      let content = m[4];
      let checkbox = '';
      const task = content.match(/^\[( |x|X)\][ \t]+(.*)$/);
      if (task) {
        checkbox = `<input type="checkbox" class="md-task-checkbox" disabled ${task[1] !== ' ' ? 'checked' : ''}> `;
        content = task[2];
      }
      let sub = '';
      if (i < lines.length) {
        const nextM = lines[i].match(itemRe);
        const nextIndent = nextM ? nextM[1].replace(/\t/g, '  ').length : -1;
        if (nextM && nextIndent > indent) sub = parseAt(nextIndent);
      }
      items.push(`<li>${checkbox}${parseInline(content)}${sub}</li>`);
    }
    const tag = ordered ? 'ol' : 'ul';
    return `<${tag}>${items.join('')}</${tag}>`;
  }
  return parseAt(0);
}

// Splits already-placeholder-stashed, HTML-escaped text into blocks
// (headings, horizontal rules, blockquotes, lists, tables, paragraphs) and
// runs parseInline() over each block's own text. This is a real line-based
// block parser rather than one flat regex chain — needed once lists can
// nest and blockquotes can span multiple lines, since those don't compose
// cleanly as independent global replaces.
function parseBlocks(src) {
  const lines = src.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    if (!line.trim()) { i++; continue; }

    // Stashed placeholder (code block / math block) sitting alone on its
    // own line — emit as-is, not wrapped in a paragraph.
    if (/^\u0000\d+\u0000$/.test(line.trim())) { out.push(line.trim()); i++; continue; }

    const heading = line.match(/^(#{1,6})[ \t]+(.+)$/);
    if (heading) {
      out.push(`<h${heading[1].length}>${parseInline(heading[2])}</h${heading[1].length}>`);
      i++; continue;
    }

    if (/^[ \t]*([-*_])(?:[ \t]*\1){2,}[ \t]*$/.test(line)) {
      out.push('<hr>'); i++; continue;
    }

    // '>' shows up here as '&gt;' — this text has already been through
    // escHtml() by the time parseBlocks sees it (has to be, so raw prose
    // is never unescaped HTML), so every block-syntax check needs to
    // match the escaped form. '#', '-', '*', '+', '|', digits and '.'
    // aren't touched by escHtml, so only this one needs it.
    if (/^[ \t]*&gt;[ \t]?/.test(line)) {
      // A non-quote line is allowed to continue the quote as long as it's
      // non-blank and we're already inside one ("lazy continuation") —
      // a blank line always ends it.
      const quoteLines = [];
      while (i < lines.length && (/^[ \t]*&gt;[ \t]?/.test(lines[i]) || (lines[i].trim() && quoteLines.length))) {
        quoteLines.push(lines[i].replace(/^[ \t]*&gt;[ \t]?/, ''));
        i++;
      }
      out.push(`<blockquote>${parseBlocks(quoteLines.join('\n'))}</blockquote>`);
      continue;
    }

    const tableMatch = lines.slice(i).join('\n').match(/^(\|.+\|)\n(\|[ \t]*:?-{2,}:?[ \t]*(?:\|[ \t]*:?-{2,}:?[ \t]*)*\|?)\n((?:\|.*\|\n?)*)/);
    if (tableMatch && tableMatch.index === 0) {
      const [full, headerLine, , bodyLines] = tableMatch;
      const splitRow = row => row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const headers = splitRow(headerLine);
      const rows = bodyLines.trim().split('\n').filter(Boolean).map(splitRow);
      const thead = `<tr>${headers.map(h => `<th>${parseInline(h)}</th>`).join('')}</tr>`;
      const tbody = rows.map(r => `<tr>${r.map(c => `<td>${parseInline(c)}</td>`).join('')}</tr>`).join('');
      out.push(`<table class="md-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`);
      i += full.split('\n').length;
      continue;
    }

    if (/^[ \t]*(?:[-*+]|\d+\.)[ \t]+/.test(line)) {
      // Only actual "- "/"1. " item lines are collected here — a plain
      // indented continuation line wouldn't match parseListBlock's itemRe
      // and would otherwise get silently dropped rather than rendered, so
      // it's better left for the next paragraph to pick up.
      const listLines = [];
      while (i < lines.length && /^[ \t]*(?:[-*+]|\d+\.)[ \t]+/.test(lines[i])) {
        listLines.push(lines[i]); i++;
      }
      out.push(parseListBlock(listLines));
      continue;
    }

    // Paragraph: a run of plain, non-blank lines. Single \n between them
    // becomes a soft <br> (this block output goes through .answer-content,
    // which is white-space: normal — unlike raw chat bubbles, real block
    // HTML here means bare newlines would otherwise just collapse away).
    const paraLines = [];
    while (i < lines.length && lines[i].trim() && !/^\u0000\d+\u0000$/.test(lines[i].trim())
      && !/^(#{1,6})[ \t]+/.test(lines[i]) && !/^[ \t]*&gt;[ \t]?/.test(lines[i])
      && !/^[ \t]*(?:[-*+]|\d+\.)[ \t]+/.test(lines[i]) && !/^[ \t]*([-*_])(?:[ \t]*\1){2,}[ \t]*$/.test(lines[i])) {
      paraLines.push(lines[i]); i++;
    }
    if (paraLines.length) out.push(`<p>${parseInline(paraLines.join('\n')).replace(/\n/g, '<br>')}</p>`);
  }
  return out.join('');
}

// Markdown for assistant replies — the full common set: headings, bold/
// italic/bold-italic, strikethrough, blockquotes, ordered/unordered/task
// lists (nested), tables, horizontal rules, images, links, the
// [[Button]](url) styled-link syntax, emoji shortcodes, fenced ``` code
// blocks, and $...$/$$...$$ LaTeX math via KaTeX. Code blocks and math are
// pulled out into stashed placeholders before anything else runs, so
// nothing downstream (escaping, emphasis, list/table parsing) ever
// touches their contents — LaTeX especially is full of _, *, {, } that
// would otherwise get mangled by the emphasis passes.
function parseAiMarkdown(text) {
  const stash = [];
  const hold = html => { stash.push(html); return `\u0000${stash.length - 1}\u0000`; };

  let src = String(text || '').replace(/\r\n/g, '\n');

  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => hold(`
    <div class="code-block-wrap">
      <div class="code-block-header">
        <span class="code-block-lang">${escHtml(lang || 'text')}</span>
        <button type="button" class="code-block-copy-btn" data-copy-code><span class="material-symbols-rounded">content_copy</span>copy</button>
      </div>
      <pre class="code-block"><code>${escHtml(code.replace(/\n$/, ''))}</code></pre>
    </div>
  `));

  // $ must hug its content (no space right inside) so ordinary prose like
  // "$5 and $10" is never misread as the start of a math span.
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (m, expr) => hold(`<div class="math-block">${renderMathOrFallback(expr, true)}</div>`));
  src = src.replace(/\$(?!\s)((?:\\\$|[^$\n])+?)(?<!\s)\$/g, (m, expr) => hold(`<span class="math-inline">${renderMathOrFallback(expr, false)}</span>`));

  src = src.replace(/`([^`\n]+)`/g, (m, code) => hold(`<code>${escHtml(code)}</code>`));

  src = expandShortcodes(escHtml(src));

  const html = parseBlocks(src);
  return html.replace(/\u0000(\d+)\u0000/g, (m, i) => stash[Number(i)]);
}

// The small local model occasionally repeats its entire answer verbatim
// right after finishing it (e.g. "Hello! ...oeper.dev?\nHello! ...oeper.dev?")
// instead of stopping. Collapse exact, consecutive duplicate lines in the
// final answer rather than showing/saving the repeat — only touches lines
// that are identical to the one directly before them, so it can't affect
// legitimately repeated words/phrases within otherwise-different lines.
function dedupeRepeatedLines(text) {
  const lines = text.split('\n');
  const out = [];
  for (const line of lines) {
    const t = line.trim();
    if (t && out.length && out[out.length - 1].trim() === t) continue;
    out.push(line);
  }
  return out.join('\n');
}

// Splits a raw assistant reply into "thinking" (reasoning-model output,
// either a separate reasoning_content stream field or an inline <think>
// tag) and the real answer, so the UI can show reasoning as a collapsible
// "Show thinking" block instead of dumping it inline with the answer.
function splitThinking(reasoningBuf, contentBuf, done) {
  if (reasoningBuf) {
    // Reasoning is already covered by the native reasoning_content channel
    // above — but the model occasionally also writes a redundant
    // <think>...</think> block as plain text inside content on top of
    // that (see the system-prompt comment for why). Strip it out entirely
    // rather than let raw reasoning text leak into the visible answer.
    const openIdx = contentBuf.indexOf('<think>');
    if (openIdx === -1) {
      return { thinking: reasoningBuf, answer: contentBuf, stillThinking: contentBuf.length === 0 };
    }
    const closeIdx = contentBuf.indexOf('</think>', openIdx);
    if (closeIdx === -1) {
      // Still mid-block — hide it rather than show a partial raw dump.
      return { thinking: reasoningBuf, answer: contentBuf.slice(0, openIdx), stillThinking: true };
    }
    const answer = (contentBuf.slice(0, openIdx) + contentBuf.slice(closeIdx + 8)).trim();
    return { thinking: reasoningBuf, answer, stillThinking: answer.length === 0 };
  }
  const openIdx = contentBuf.indexOf('<think>');
  if (openIdx === -1) {
    const answer = contentBuf.replace(/<\/?think>/g, '').trim();
    return { thinking: '', answer: done ? dedupeRepeatedLines(answer) : answer, stillThinking: false };
  }
  const closeIdx = contentBuf.indexOf('</think>', openIdx);
  if (closeIdx === -1) {
    // The small local model sometimes never emits a closing </think> and
    // just rambles until it runs out of tokens without ever giving a real
    // answer. While still streaming we can't tell the difference from a
    // slow thinker, so keep showing it as reasoning. Once the stream is
    // actually done, don't dump that raw rambling in as if it were the
    // answer — it reads as broken (an earlier version of this did exactly
    // that, and it looked like the AI wasn't responding at all). Keep it
    // tucked behind "Show thinking" like normal, and give a plain fallback
    // answer instead, since there's no real answer to show.
    if (done) {
      return {
        thinking: contentBuf.slice(openIdx + 7).trim(),
        answer: "(Didn't quite finish that thought — mind trying again?)",
        stillThinking: false,
      };
    }
    return { thinking: contentBuf.slice(openIdx + 7), answer: contentBuf.slice(0, openIdx), stillThinking: true };
  }
  const rawAnswer = (contentBuf.slice(0, openIdx) + contentBuf.slice(closeIdx + 8)).replace(/<\/?think>/g, '').trim();
  return {
    thinking: contentBuf.slice(openIdx + 7, closeIdx).trim(),
    // The small local model occasionally emits a stray extra </think> after
    // the real answer (<think>...</think>Hello!</think>) — only the first
    // </think> is the real close, so strip any leftover tag text instead of
    // letting it leak into the visible reply. It also sometimes repeats the
    // whole answer verbatim right after finishing — dedupeRepeatedLines()
    // collapses that once the stream is done.
    answer: done ? dedupeRepeatedLines(rawAnswer) : rawAnswer,
    stillThinking: false,
  };
}

// Custom-animated collapse (see .thinking-content-wrap's grid-rows trick in
// the CSS) instead of native <details>, which has no animation hook in any
// browser. Open state is tracked via a class we control, so it can still
// respect a manual click across re-renders — re-rendering the bubble's
// innerHTML on every streamed chunk would otherwise reset a native
// <details>'s open attribute every time too.
//
// Stays collapsed by default even while actively streaming reasoning —
// only a manual click opens it, live-streaming reasoning included.
//
// Used to rebuild via bubble.innerHTML = html on every single streamed
// token — simple, but that fully destroyed and recreated the thinking
// block's DOM every time, including .thinking-content-wrap, whose CSS
// fade-in (.thinking-block.open .thinking-content-wrap { animation:
// thinkingFadeIn ... }) got RESTARTED from scratch on every one of those
// recreations. Tokens can easily arrive faster than the 0.2s fade
// duration, so an opened block never actually finished fading in — it
// just kept snapping back toward transparent, which is what "the ai's
// texts aren't animated" and "thinking is still too tall" both actually
// were: real reasoning text, correctly sized, rendering behind an
// animation that could never settle. Updating the existing elements'
// text in place instead — rather than replacing them — lets the block
// (and its animation) actually persist across chunks like any other DOM
// node would.
function renderAssistantContent(bubble, reasoningBuf, contentBuf, done) {
  const { thinking, answer, stillThinking } = splitThinking(reasoningBuf, contentBuf, done);

  if (thinking) {
    let block = bubble.querySelector('.thinking-block');
    if (!block) {
      block = document.createElement('div');
      block.className = 'thinking-block';
      block.dataset.userToggled = '0';
      block.innerHTML = `
        <div class="thinking-summary"><span class="material-symbols-rounded thinking-caret">expand_more</span><span class="thinking-label"></span></div>
        <div class="thinking-content-wrap"><div class="thinking-content"><div class="thinking-content-inner"></div></div></div>
      `;
      bubble.insertBefore(block, bubble.firstChild);
    }
    block.querySelector('.thinking-label').textContent = stillThinking ? 'Thinking…' : 'Show thinking';
    block.querySelector('.thinking-content-inner').textContent = thinking;
  } else {
    bubble.querySelector('.thinking-block')?.remove();
  }

  let answerEl = bubble.querySelector('.answer-content');
  if (answer) {
    if (!answerEl) {
      answerEl = document.createElement('div');
      answerEl.className = 'answer-content';
      bubble.appendChild(answerEl);
    }
    answerEl.innerHTML = parseAiMarkdown(answer);
  } else {
    answerEl?.remove();
  }
}

// ── Model dropdown ───────────────────────────────────────────
// Real, currently-loaded models (ai-proxy.js's /api/models, which asks
// LM Studio directly) come first — this is what "the list is wrong"
// actually needed: a hand-maintained list drifts from reality the moment
// a model gets swapped. config/aiModels (admin.html-editable) still
// merges in afterward as extra entries, for models worth offering even
// when not currently loaded.
const modelDropdown = createDropdown([{ value: '', label: 'a small local model (default)' }], { value: '' });
document.getElementById('modelBar').appendChild(modelDropdown.el);
let defaultModelName = 'a small local model';
let liveModels = [];
let configuredModels = [];

function renderModelSelect() {
  const prevValue = modelDropdown.getValue();
  const seen = new Set();
  const options = [{ value: '', label: `${defaultModelName} (default)` }];
  for (const m of [...liveModels, ...configuredModels]) {
    if (!m || !m.id || seen.has(m.id)) continue;
    seen.add(m.id);
    options.push({ value: m.id, label: m.label || m.id });
  }
  modelDropdown.setOptions(options, true);
  if (!options.some(o => o.value === prevValue)) modelDropdown.setValue('');
}

onSnapshot(doc(db, 'config', 'aiModels'), snap => {
  configuredModels = (snap.exists() && snap.data().models) || [];
  renderModelSelect();
});

// The worker returns its raw model catalog id (e.g. '@cf/google/gemma-4-26b-a4b-it'),
// which reads as backend implementation detail, not something to show a
// visitor. Falls back to the raw id for anything not in this list, so a
// future model swap never goes silently blank.
const FRIENDLY_MODEL_NAMES = {
  '@cf/google/gemma-4-26b-a4b-it': 'Gemma 4',
};
async function loadModelName() {
  try {
    const res = await fetch(AI_ENDPOINT + '/api/model');
    if (!res.ok) return;
    const data = await res.json();
    if (data.model) defaultModelName = FRIENDLY_MODEL_NAMES[data.model] || data.model;
  } catch {}
  renderModelSelect();
}
loadModelName();

async function loadLiveModels() {
  try {
    const res = await fetch(AI_ENDPOINT + '/api/models');
    if (!res.ok) return;
    const data = await res.json();
    liveModels = data.models || [];
  } catch {}
  renderModelSelect();
}
loadLiveModels();

// ── Multiple chats (localStorage always; also synced to Firestore under
// aiChats/{email} when signed in, so the same chats show up on another
// device — signed-out visitors still get full local-only persistence). ──
const CHATS_KEY = 'oe-ai-chats';
const CURRENT_CHAT_KEY = 'oe-ai-current-chat';

function loadChats() {
  try { return JSON.parse(localStorage.getItem(CHATS_KEY)) || []; } catch { return []; }
}
function saveChats() {
  // localStorage.setItem can throw (quota exceeded — chat history with a
  // lot of long AI replies adds up) and this gets called mid-way through
  // sendMessage(), before the assistant bubble even exists. An uncaught
  // throw here used to abort the whole send silently: setSending(true) had
  // already fired (button stuck on "stop"), but the code never reached the
  // try/finally further down that resets it, and no assistant bubble was
  // ever created — a permanently stuck send with no visible reply.
  try {
    localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
  } catch (err) {
    console.error('Could not save chats to localStorage:', err);
  }
  pushChatsToCloud();
}
function newChatId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function makeChat() { return { id: newChatId(), title: 'new chat', messages: [], updatedAt: Date.now() }; }

let chats = loadChats();
let currentChatId = localStorage.getItem(CURRENT_CHAT_KEY);
if (!chats.some(c => c.id === currentChatId)) {
  const chat = chats[0] || makeChat();
  if (!chats.length) chats.push(chat);
  currentChatId = chat.id;
}
localStorage.setItem(CURRENT_CHAT_KEY, currentChatId);

function getCurrentChat() { return chats.find(c => c.id === currentChatId); }

const messagesEl = document.getElementById('chatMessages');
const inputEl = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

// The page itself scrolls (chat-messages has no overflow of its own), so
// streaming used to call bubble.scrollIntoView() on every single SSE
// chunk — tens of times a second while a response streams in, each one
// an instant jump that fought any attempt to scroll up and read earlier
// messages while the reply was still coming in. isNearBottom() is
// checked BEFORE each render (against the *pre*-update scrollHeight) so
// scrolling only auto-follows when the reader was already at the bottom,
// same as any chat app's "stick to bottom unless you've scrolled away"
// behavior; scheduleScroll() then coalesces however many chunks land
// within one frame into a single scrollIntoView call via rAF, instead of
// one per chunk.
function isNearBottom() {
  return window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 120;
}
let scrollRAF = null;
function scheduleScroll(bubble) {
  if (scrollRAF) return;
  scrollRAF = requestAnimationFrame(() => {
    scrollRAF = null;
    bubble.scrollIntoView({ block: 'end' });
  });
}

// Delegated once (not per-render) since bubbles get their innerHTML
// replaced on every streamed chunk, which would drop a directly-attached
// listener each time.
messagesEl.addEventListener('click', e => {
  const copyBtn = e.target.closest('[data-copy-code]');
  if (copyBtn) {
    const code = copyBtn.closest('.code-block-wrap').querySelector('code').textContent;
    navigator.clipboard.writeText(code).then(() => {
      const original = copyBtn.innerHTML;
      copyBtn.innerHTML = '<span class="material-symbols-rounded">check</span>copied';
      setTimeout(() => { copyBtn.innerHTML = original; }, 1500);
    });
    return;
  }
  const summary = e.target.closest('.thinking-summary');
  if (!summary) return;
  const block = summary.closest('.thinking-block');
  block.classList.toggle('open');
  block.dataset.userToggled = '1';
});

// `index` is this message's position in chat.messages — only known (and
// only meaningful) for messages replayed from history via
// renderChatFromHistory(); live bubbles created while a send is in flight
// (the just-typed user message, the in-progress assistant reply) are
// created before they're settled into history, so they render without
// edit/regenerate controls until the next full re-render picks them up.
function addMessageEl(role, content, imageUrl, index) {
  document.getElementById('chatEmpty')?.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const actionsHtml = index === undefined ? '' : role === 'user'
    ? `<div class="msg-actions"><button type="button" class="msg-action-btn" data-edit-msg="${index}" title="edit"><span class="material-symbols-rounded">edit</span></button></div>`
    : `<div class="msg-actions"><button type="button" class="msg-action-btn" data-regen-msg="${index}" title="regenerate"><span class="material-symbols-rounded">refresh</span></button></div>`;
  wrap.innerHTML = `
    <div class="msg-avatar"><span class="material-symbols-rounded">${role === 'user' ? 'person' : 'auto_awesome'}</span></div>
    <div class="msg-col">
      ${imageUrl ? `<img class="msg-attach-img" src="${escHtml(imageUrl)}" alt="">` : ''}
      <div class="msg-bubble"></div>
      ${actionsHtml}
    </div>
  `;
  messagesEl.appendChild(wrap);
  const bubble = wrap.querySelector('.msg-bubble');
  if (role === 'user') bubble.textContent = content;
  else if (content) renderAssistantContent(bubble, '', content, true);
  wrap.querySelector('[data-edit-msg]')?.addEventListener('click', () => editMessage(index));
  wrap.querySelector('[data-regen-msg]')?.addEventListener('click', () => regenerateResponse(index));
  wrap.scrollIntoView({ block: 'end', behavior: 'smooth' });
  return bubble;
}

function renderChatFromHistory() {
  const chat = getCurrentChat();
  messagesEl.style.opacity = '0';
  messagesEl.innerHTML = '';
  if (!chat.messages.length) {
    messagesEl.innerHTML = `<div class="chat-empty" id="chatEmpty"><span class="material-symbols-rounded">auto_awesome</span><p>ask epic AI anything.</p></div>`;
  } else {
    chat.messages.forEach((m, i) => addMessageEl(m.role, m.content, m.imageUrl, i));
  }
  requestAnimationFrame(() => { messagesEl.style.opacity = '1'; });
}

// Loads a past user message back into the composer and drops it (and
// everything after it) from history, so sending again continues from
// that point instead of appending after the now-stale follow-up
// messages — the same "edit and resend" pattern most chat apps use. Does
// not restore an attached image (this page's image flow is anonymous
// per-upload, not worth re-threading for an edit); text-only is the
// common case anyway.
function editMessage(index) {
  if (controller) return;
  const chat = getCurrentChat();
  const msg = chat.messages[index];
  if (!msg || msg.role !== 'user') return;
  chat.messages = chat.messages.slice(0, index);
  chat.updatedAt = Date.now();
  saveChats();
  renderChatFromHistory();
  inputEl.value = msg.content;
  autoGrow();
  inputEl.focus();
}

// Drops this assistant reply (and anything after it) and asks again from
// the same point in the conversation — useful when a reply was bad, cut
// off, or you just want another take.
async function regenerateResponse(index) {
  if (controller) return;
  const chat = getCurrentChat();
  const msg = chat.messages[index];
  if (!msg || msg.role !== 'assistant') return;
  chat.messages = chat.messages.slice(0, index);
  chat.updatedAt = Date.now();
  saveChats();
  renderChatFromHistory();
  setSending(true);
  try {
    await sendToModel(chat);
  } finally {
    setSending(false);
  }
  // Only re-render on success (something was actually appended to
  // chat.messages). A failed sendToModel() doesn't persist anything —
  // re-rendering unconditionally here would wipe out the live error
  // bubble it just displayed, silently reverting to no visible reply at
  // all, which is exactly the bug this whole session has been about.
  if (chat.messages.length > index) renderChatFromHistory();
}
renderChatFromHistory();
// The sidebar used to only get populated when the drawer was opened — fine
// when it was purely an on-demand overlay, but now it's permanently visible
// at the desktop breakpoint (see .chats-panel's media query), where nothing
// ever calls openChatsPanel() to trigger that lazy render.
renderChatsList();

function renderChatsList() {
  const list = document.getElementById('chatsList');
  observeList(list);
  if (!chats.length) { list.innerHTML = '<p class="chats-empty">no chats yet.</p>'; return; }
  const sorted = [...chats].sort((a, b) => b.updatedAt - a.updatedAt);
  list.innerHTML = sorted.map(c => `
    <div class="chat-row ${c.id === currentChatId ? 'active' : ''}" data-id="${c.id}">
      <span class="material-symbols-rounded">chat_bubble</span>
      <span class="chat-row-title">${escHtml(c.title)}</span>
      <button class="chat-row-delete" data-id="${c.id}" title="delete"><span class="material-symbols-rounded">delete</span></button>
    </div>
  `).join('');
  list.querySelectorAll('.chat-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.chat-row-delete')) return;
      switchChat(row.dataset.id);
    });
  });
  list.querySelectorAll('.chat-row-delete').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); deleteChat(btn.dataset.id); });
  });
}

function switchChat(id) {
  if (id === currentChatId) { closeChatsPanel(); return; }
  if (controller) controller.abort();
  currentChatId = id;
  localStorage.setItem(CURRENT_CHAT_KEY, id);
  renderChatFromHistory();
  renderChatsList();
  closeChatsPanel();
}
function startNewChat() {
  if (controller) controller.abort();
  const chat = makeChat();
  chats.unshift(chat);
  currentChatId = chat.id;
  localStorage.setItem(CURRENT_CHAT_KEY, currentChatId);
  saveChats();
  renderChatFromHistory();
  renderChatsList();
  closeChatsPanel();
}
function deleteChat(id) {
  chats = chats.filter(c => c.id !== id);
  saveChats();
  if (id === currentChatId) {
    if (!chats.length) { chats.push(makeChat()); saveChats(); }
    currentChatId = chats[0].id;
    localStorage.setItem(CURRENT_CHAT_KEY, currentChatId);
    renderChatFromHistory();
  }
  renderChatsList();
}

const chatsOverlay = document.getElementById('chatsOverlay');
const chatsPanel = document.getElementById('chatsPanel');
function openChatsPanel() { renderChatsList(); chatsOverlay.classList.add('open'); chatsPanel.classList.add('open'); }
function closeChatsPanel() { chatsOverlay.classList.remove('open'); chatsPanel.classList.remove('open'); }
document.getElementById('chatsBtn').addEventListener('click', openChatsPanel);
document.getElementById('chatsCloseBtn').addEventListener('click', closeChatsPanel);
chatsOverlay.addEventListener('click', closeChatsPanel);
document.getElementById('newChatBtn').addEventListener('click', startNewChat);

const memoryOverlay = document.getElementById('memoryOverlay');
function openMemoryPanel() { renderMemoryPanel(); memoryOverlay.classList.add('open'); }
function closeMemoryPanel() { memoryOverlay.classList.remove('open'); }
document.getElementById('memoryBtn').addEventListener('click', () => {
  if (!getCurrentUser()) { oeAlert('sign in to see what epic AI remembers about you.'); return; }
  openMemoryPanel();
});
document.getElementById('memoryCloseBtn').addEventListener('click', closeMemoryPanel);
memoryOverlay.addEventListener('click', e => { if (e.target === memoryOverlay) closeMemoryPanel(); });
document.getElementById('memoryList').addEventListener('click', e => {
  const btn = e.target.closest('.memory-forget-btn');
  if (btn) forgetFact(btn.dataset.fact);
});
document.getElementById('newChatHeaderBtn').addEventListener('click', startNewChat);

// ── Cross-device sync (Firestore, signed-in only) ──────────────────────
// Last-write-wins per chat (by updatedAt), not a full CRDT merge — good
// enough for "used it on my phone, now continuing on desktop" since
// updatedAt is bumped on every message, so simultaneous edits on two
// devices are the only case that can lose one side's newest message.
let cloudUnsub = null;
let applyingCloudSnapshot = false;

function mergeChats(local, cloud) {
  const byId = new Map();
  for (const c of local) byId.set(c.id, c);
  for (const c of cloud) {
    const existing = byId.get(c.id);
    if (!existing || (c.updatedAt || 0) > (existing.updatedAt || 0)) byId.set(c.id, c);
  }
  return [...byId.values()];
}

function pushChatsToCloud() {
  if (applyingCloudSnapshot) return;
  const user = getCurrentUser();
  if (!user) return;
  // Wrapped in try/catch, not just a .catch() on the returned promise —
  // Firestore's argument validation (e.g. rejecting an undefined field
  // buried in `chats`) can throw synchronously before setDoc() even
  // returns a promise. An uncaught throw here has no business propagating
  // out of a background sync call and aborting whatever caller happened
  // to trigger it (saveChats() has no catch of its own) — see the
  // imageUrl fix above for exactly that happening.
  try {
    setDoc(doc(db, 'aiChats', user.email), { chats }).catch(() => {});
  } catch (err) {
    console.error('Could not push chats to cloud:', err);
  }
}

// ── Cross-conversation memory (Firestore, signed-in only) ──────────────
// The model decides what's worth remembering (via the remember_fact tool
// — see cf-ai-worker) and streams it back as a {remember} SSE event; this
// file does the actual write, since the Worker itself holds no Firestore
// write credentials (see the streamToolLoop comment in cf-ai-worker for
// why). memoryFacts is kept live via onSnapshot, same pattern as the
// chats cloud-sync above, so a fact remembered from a "remember this"
// moment applies starting with the very next message, not just future
// sessions.
let memoryFacts = [];
let memoryUnsub = null;
function renderMemoryPanel() {
  const list = document.getElementById('memoryList');
  if (!list) return;
  list.innerHTML = memoryFacts.length
    ? memoryFacts.map(f => `
      <div class="memory-row">
        <span class="memory-fact">${escHtml(f)}</span>
        <button type="button" class="memory-forget-btn" data-fact="${escHtml(f)}" title="forget this"><span class="material-symbols-rounded">close</span></button>
      </div>
    `).join('')
    : '<div class="memory-empty">nothing remembered yet — epic AI saves things worth recalling as you chat.</div>';
}
async function rememberFact(fact) {
  const user = getCurrentUser();
  const trimmed = String(fact || '').trim().slice(0, 300);
  if (!user || !trimmed) return;
  try { await setDoc(doc(db, 'aiMemory', user.email), { facts: arrayUnion(trimmed) }, { merge: true }); }
  catch (err) { console.error('Could not save AI memory:', err); }
}
async function forgetFact(fact) {
  const user = getCurrentUser();
  if (!user) return;
  try { await setDoc(doc(db, 'aiMemory', user.email), { facts: arrayRemove(fact) }, { merge: true }); }
  catch (err) { console.error('Could not remove AI memory:', err); }
}

onAccountChange(user => {
  if (memoryUnsub) { memoryUnsub(); memoryUnsub = null; }
  memoryFacts = [];
  if (user) {
    memoryUnsub = onSnapshot(doc(db, 'aiMemory', user.email), snap => {
      memoryFacts = (snap.exists() && Array.isArray(snap.data().facts)) ? snap.data().facts : [];
      renderMemoryPanel();
    }, () => { memoryFacts = []; renderMemoryPanel(); });
  } else {
    renderMemoryPanel();
  }
});

onAccountChange(user => {
  if (cloudUnsub) { cloudUnsub(); cloudUnsub = null; }
  if (!user) return;
  cloudUnsub = onSnapshot(doc(db, 'aiChats', user.email), snap => {
    const cloudChats = (snap.exists() && snap.data().chats) || [];
    const merged = mergeChats(chats, cloudChats);
    const changed = JSON.stringify(merged) !== JSON.stringify(chats);
    chats = merged;
    if (!chats.some(c => c.id === currentChatId) && chats.length) currentChatId = chats[0].id;
    if (changed) {
      applyingCloudSnapshot = true;
      localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
      localStorage.setItem(CURRENT_CHAT_KEY, currentChatId);
      // Every saveChats() call (there are at least two per exchange — the
      // user's message, then the assistant's reply) round-trips through
      // Firestore and fires this listener again. Re-rendering unconditionally
      // used to wipe out the actively-streaming assistant bubble mid-reply —
      // messagesEl gets rebuilt purely from chat.messages, which doesn't
      // contain the in-progress reply until the stream finishes — so signed-
      // in users could send a message, watch it "complete" (button resets),
      // and never see any reply at all. Skip the destructive re-render while
      // a send is actually in flight; controller goes back to null before
      // the final saveChats() of that exchange, so the next snapshot after
      // the stream ends still catches up normally.
      if (!controller) renderChatFromHistory();
      renderChatsList();
      applyingCloudSnapshot = false;
      // Push back so a brand-new device (nothing in the cloud yet, or the
      // cloud copy was behind) ends up with the merged result on both sides.
      // Only do this when the merge actually changed something — this used
      // to run unconditionally on every snapshot, including the echo of
      // writes this same tab just made via pushChatsToCloud(). That turned
      // every saveChats() into a write -> snapshot -> write loop, and while
      // the assistant's reply was still streaming, a stale echo could land
      // right as controller cleared and wipe the just-finished reply.
      try {
        setDoc(doc(db, 'aiChats', user.email), { chats }).catch(() => {});
      } catch (err) {
        console.error('Could not push merged chats to cloud:', err);
      }
    }
  });
});

// ── Image attachment (anonymous upload — this page needs no sign-in, so
// it uses the same unauthenticated /upload-file path files.html's
// anonymous flow uses, rather than account.js's uploadFile() which
// requires being signed in). ────────────────────────────────────────
const attachInput = document.getElementById('attachInput');
const attachPreview = document.getElementById('attachPreview');
const attachPreviewImg = document.getElementById('attachPreviewImg');
let pendingImageFile = null;

// Downscales to at most maxDim on the longest side and re-encodes as JPEG
// — keeps the uploaded file (and later, the base64 payload sent to the
// model) reasonably sized regardless of how large the original photo is;
// phone camera photos routinely run 5-10MB+ before this.
async function resizeImage(file, maxDim = 1024, quality = 0.85) {
  const img = await new Promise((resolve, reject) => {
    const el = new Image();
    el.onload = () => resolve(el);
    el.onerror = () => reject(new Error('Could not read image'));
    el.src = URL.createObjectURL(file);
  });
  let { width, height } = img;
  if (width > maxDim || height > maxDim) {
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  URL.revokeObjectURL(img.src);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
  return new File([blob], 'image.jpg', { type: 'image/jpeg' });
}

async function handleAttachedImage(file) {
  if (!file.type.startsWith('image/')) { await oeAlert('only images are supported right now'); return; }
  try {
    pendingImageFile = await resizeImage(file);
  } catch {
    pendingImageFile = file;
  }
  attachPreviewImg.src = URL.createObjectURL(pendingImageFile);
  attachPreview.style.display = 'flex';
}

attachInput.addEventListener('change', async () => {
  const file = attachInput.files[0];
  attachInput.value = '';
  if (!file) return;
  await handleAttachedImage(file);
});
document.getElementById('attachRemoveBtn').addEventListener('click', () => {
  pendingImageFile = null;
  attachPreview.style.display = 'none';
  attachPreviewImg.src = '';
});

// Paste an image straight from the clipboard (screenshot, copied image,
// etc.) instead of only being able to attach via the file picker — the
// textarea still gets whatever pasted text there is normally, this just
// also catches an image if the clipboard has one.
inputEl.addEventListener('paste', async e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) {
        e.preventDefault();
        await handleAttachedImage(file);
      }
      break;
    }
  }
});

async function uploadAnonImage(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(SERVER_ENDPOINT + '/upload-file', { method: 'POST', body: fd });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return (await res.json()).url;
}

// LM Studio's vision support needs an actual base64 data URI in
// image_url.url — unlike OpenAI's real API, it won't fetch a remote URL
// itself. Images are still stored/persisted as short URLs (uploaded via
// uploadAnonImage), so localStorage stays lean; this is only used right
// before a message carrying an image is actually sent.
async function urlToDataUrl(url) {
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Could not read image'));
    reader.readAsDataURL(blob);
  });
}

function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
}
inputEl.addEventListener('input', autoGrow);

function setSending(sending) {
  if (sending) {
    sendBtn.classList.add('stop');
    sendBtn.title = 'Stop';
    sendBtn.innerHTML = '<span class="material-symbols-rounded">stop</span>';
  } else {
    sendBtn.classList.remove('stop');
    sendBtn.disabled = false;
    sendBtn.title = 'Send';
    sendBtn.innerHTML = '<span class="material-symbols-rounded">arrow_upward</span>';
  }
}

// Converts this chat's stored {role, content, imageUrl} messages into the
// OpenAI wire format (multi-part content for anything with an image, as a
// base64 data URI — see urlToDataUrl), with the system prompt always
// prepended. Async because fetching+encoding each image happens here.
//
// The worker rejects any request over MAX_MESSAGES=40 total (including the
// system prompt we prepend below) — sending the whole, ever-growing chat.
// messages array hit that wall permanently once a conversation passed
// ~39 turns, since every later send in that same chat carried the same
// over-cap history and failed with the identical "Too many messages"
// error forever, with no way out short of clearing the chat. Only the
// most recent messages are actually sent to the model; the full history
// still lives in chat.messages for display/storage/exporting.
const MAX_WIRE_HISTORY = 30;
async function toWireMessages(msgs) {
  const wire = await Promise.all(msgs.slice(-MAX_WIRE_HISTORY).map(async m => {
    if (m.imageUrl) {
      let dataUrl;
      try {
        dataUrl = await urlToDataUrl(m.imageUrl);
      } catch {
        dataUrl = m.imageUrl; // fall back to the plain URL; upstream will just error on it
      }
      return { role: m.role, content: [
        { type: 'text', text: m.content || '' },
        { type: 'image_url', image_url: { url: dataUrl } },
      ] };
    }
    return { role: m.role, content: m.content };
  }));
  const systemContent = memoryFacts.length
    ? `${SYSTEM_PROMPT}\n\nThings you remember about this user from past conversations (use naturally where relevant, don't just recite the list back at them):\n${memoryFacts.map(f => '- ' + f).join('\n')}`
    : SYSTEM_PROMPT;
  return [{ role: 'system', content: systemContent }, ...wire];
}

let controller = null;

async function sendMessage() {
  const text = inputEl.value.trim();
  if ((!text && !pendingImageFile) || controller) return;
  const chat = getCurrentChat();

  let imageUrl = null;
  const fileToUpload = pendingImageFile;
  pendingImageFile = null;
  attachPreview.style.display = 'none';
  attachPreviewImg.src = '';

  inputEl.value = '';
  autoGrow();
  setSending(true);

  // Everything from here on used to run outside any try/finally — if
  // anything threw (saveChats() hitting a localStorage quota error, say)
  // before reaching the fetch's own try block below, setSending(true) had
  // already fired but nothing ever set it back: a permanently stuck send
  // button with no assistant bubble ever created. This outer finally is a
  // safety net for that whole gap, not just the network call.
  try {
    if (fileToUpload) {
      const uploadingBubble = addMessageEl('user', text || '(image)');
      uploadingBubble.closest('.msg-col').querySelector('.msg-attach-img')?.remove();
      const placeholderImg = document.createElement('img');
      placeholderImg.className = 'msg-attach-img';
      placeholderImg.src = URL.createObjectURL(fileToUpload);
      uploadingBubble.parentElement.insertBefore(placeholderImg, uploadingBubble);
      try {
        imageUrl = await uploadAnonImage(fileToUpload);
      } catch (err) {
        uploadingBubble.textContent = 'Could not upload image: ' + err.message;
        uploadingBubble.classList.add('error');
        return;
      }
    } else {
      addMessageEl('user', text);
    }

    // Omit imageUrl entirely for plain-text messages rather than setting it
    // to undefined — Firestore's setDoc() rejects any write containing an
    // undefined field, which was the actual root cause of the "AI doesn't
    // respond when signed in" bug: for a plain-text message, this made every
    // cloud sync write throw, and that throw propagated straight out of
    // saveChats() (which has no catch of its own) and aborted sendMessage()
    // before it ever reached sendToModel() — no fetch, no assistant bubble,
    // no error shown. Only signed-in users hit this (pushChatsToCloud() is a
    // no-op when signed out) and only for messages without an image (a real
    // imageUrl string is a valid Firestore value) — which is exactly the
    // reported pattern.
    const userMsg = imageUrl ? { role: 'user', content: text, imageUrl } : { role: 'user', content: text };
    chat.messages.push(userMsg);
    if (chat.title === 'new chat' && text) chat.title = text.slice(0, 40) + (text.length > 40 ? '…' : '');
    chat.updatedAt = Date.now();
    saveChats();

    const lenBeforeReply = chat.messages.length;
    await sendToModel(chat);
    // Normalizes the live-streamed bubbles into indexed re-renders so this
    // exchange's messages get edit/regenerate controls too, not just ones
    // loaded from history. Safe here specifically because it's after the
    // full exchange has settled (controller is already null, the reply is
    // already saved) — re-rendering mid-stream is what caused the earlier
    // "reply never appears" bug this session. Only do it on success
    // (something actually got appended) — a failed sendToModel() doesn't
    // persist anything, so re-rendering unconditionally would wipe out the
    // live error bubble it just displayed instead of leaving it visible.
    if (chat.messages.length > lenBeforeReply) renderChatFromHistory();
  } finally {
    setSending(false);
  }
}

async function sendToModel(chat) {
  const bubble = addMessageEl('assistant', '');
  bubble.classList.add('thinking');

  controller = new AbortController();
  let reasoningBuf = '';
  let contentBuf = '';
  // Nothing here ever times out on its own — a fetch/ReadableStream can
  // hang forever if the connection drops without a clean close (very
  // plausible over a home network + Cloudflare Tunnel), leaving `controller`
  // set and the send button stuck on "stop" indefinitely with no error ever
  // firing. This aborts if no new bytes arrive for a while, so a dead
  // connection always resolves into a normal, recoverable error instead.
  const INACTIVITY_TIMEOUT_MS = 45000;
  let lastActivity = Date.now();
  let timedOut = false;
  const watchdog = setInterval(() => {
    if (Date.now() - lastActivity > INACTIVITY_TIMEOUT_MS) {
      timedOut = true;
      controller.abort();
    }
  }, 5000);
  try {
    const wireMessages = await toWireMessages(chat.messages);
    const res = await fetch(AI_ENDPOINT + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: wireMessages, model: modelDropdown.getValue() || undefined }),
      signal: controller.signal,
    });
    if (!res.ok || !res.body) {
      let msg = `Server error (${res.status})`;
      try { msg = (await res.json()).error || msg; } catch {}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let first = true;
    while (true) {
      const { done, value } = await reader.read();
      lastActivity = Date.now();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (!payload || payload === '[DONE]') continue;
        try {
          const json = JSON.parse(payload);
          if (json.remember) { rememberFact(json.remember); continue; }
          const delta = json.choices?.[0]?.delta || {};
          if (delta.reasoning_content) reasoningBuf += delta.reasoning_content;
          if (delta.content) contentBuf += delta.content;
          if (delta.reasoning_content || delta.content) {
            if (first) { bubble.classList.remove('thinking'); first = false; }
            const stick = isNearBottom();
            renderAssistantContent(bubble, reasoningBuf, contentBuf);
            if (stick) scheduleScroll(bubble);
          }
        } catch {}
      }
    }
    if (!reasoningBuf && !contentBuf) bubble.classList.remove('thinking');
    else renderAssistantContent(bubble, reasoningBuf, contentBuf, true);
  } catch (err) {
    bubble.classList.remove('thinking');
    if (timedOut) {
      bubble.textContent = contentBuf || 'The connection stalled and never responded — try again.';
      bubble.classList.add('error');
    } else if (err.name === 'AbortError') {
      if (!contentBuf) bubble.textContent = '(stopped)';
    } else {
      bubble.textContent = contentBuf || ('Could not reach the model: ' + err.message);
      bubble.classList.add('error');
    }
  } finally {
    clearInterval(watchdog);
    controller = null;
    setSending(false);
    // The final <think> tag (if inline, not a separate reasoning_content
    // field) is stripped from what gets persisted/re-sent, so reloading
    // history never re-shows old reasoning as if it were the answer. Pass
    // done=true so an unclosed <think> tag (the model doesn't always close
    // it) resolves to "show it as the answer" rather than vanishing —
    // falling back to the raw, un-stripped contentBuf here would re-persist
    // the literal <think> tag text into history.
    const { answer } = splitThinking(reasoningBuf, contentBuf, true);
    if (answer) {
      chat.messages.push({ role: 'assistant', content: answer });
      chat.updatedAt = Date.now();
      saveChats();
    }
    renderChatsList();
  }
}

sendBtn.addEventListener('click', () => {
  if (controller) { controller.abort(); return; }
  sendMessage();
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!controller) sendMessage();
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (controller) controller.abort();
  const chat = getCurrentChat();
  chat.messages = [];
  chat.title = 'new chat';
  saveChats();
  renderChatFromHistory();
  renderChatsList();
});
</script>
</body>
</html>
