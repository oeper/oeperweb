<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>oeper.dev — Portal</title>
<script src="./shared/theme-boot.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="icon" href="https://oeper.dev/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="https://oeper.dev/icon.ico?v=3" type="image/x-icon">
 
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--md-sys-color-primary, #a8c7fa); outline-offset: 2px; }

  :root {
    --md-sys-color-background: #111318;
    --md-sys-color-surface: #1a1c22;
    --md-sys-color-surface-variant: #2f353d;
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-secondary-container: #33485d;
    --md-sys-color-on-secondary-container: #d2e4ff;
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c7c5;
    --md-sys-color-outline-variant: #8c9199;
    
    --md-transition-duration: 400ms;
    --md-easing-standard: cubic-bezier(0.2, 0, 0, 1);
    --md-easing-emphasized: cubic-bezier(0.3, 0, 0, 1);
  }

  /* Structural document selection guard limits block drag-highlighting layout items */
  html, body, .navbar, .nav-links, .interactive-card, .card-icon-box {
    -webkit-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  body {
    min-height: 100vh;
    background-color: var(--md-sys-color-background);
    font-family: 'Google Sans', 'Roboto Flex', sans-serif;
    color: var(--md-sys-color-on-surface);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Slowly drifting glow behind the hero content — recolors automatically
     with the active theme since it's built from the theme's own variables. */
  .bg-aura {
    position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  }
  .bg-aura::before, .bg-aura::after {
    content: ''; position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
    filter: blur(90px); opacity: 0.16;
  }
  .bg-aura::before {
    top: -20vmax; left: -10vmax; background: var(--md-sys-color-primary);
    animation: auraDrift1 26s ease-in-out infinite alternate;
  }
  .bg-aura::after {
    bottom: -25vmax; right: -15vmax; background: var(--md-sys-color-secondary-container);
    animation: auraDrift2 32s ease-in-out infinite alternate;
  }
  @keyframes auraDrift1 {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(8vmax, 6vmax) scale(1.15); }
  }
  @keyframes auraDrift2 {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(-6vmax, -8vmax) scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg-aura::before, .bg-aura::after { animation: none; }
  }

  .page-container { position: relative; z-index: 1; }

  /* Top Navigation Bar */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background-color: rgba(17, 19, 24, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(67, 71, 78, 0.4);
    padding: 0 24px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--md-sys-color-on-surface);
    text-decoration: none;
    font-family: 'Google Sans', 'Product Sans', sans-serif;
    font-size: 22px;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-logo .material-symbols-rounded {
    color: var(--md-sys-color-primary);
    font-size: 28px;
  }

  .nav-right { display: flex; align-items: center; gap: 16px; min-width: 0; }

  .nav-icon-link {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    color: var(--md-sys-color-on-surface-variant); text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-icon-link .material-symbols-rounded { font-size: 24px; }
  .nav-icon-link:hover { color: var(--md-sys-color-on-surface); }

  .nav-hamburger {
    display: none; align-items: center; justify-content: center; width: 40px; height: 40px;
    border-radius: 50%; border: none; background: transparent; color: var(--md-sys-color-on-surface);
    cursor: pointer; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  }
  .nav-hamburger:hover { background-color: rgba(255,255,255,0.06); }
  .nav-hamburger .material-symbols-rounded { font-size: 24px; }

  .nav-links {
    display: flex;
    gap: 8px;
    height: 100%;
    align-items: center;
  }

  .nav-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    text-decoration: none;
    color: var(--md-sys-color-on-surface-variant);
    font-family: 'Google Sans', 'Product Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    border-radius: 20px;
    transition: color var(--md-transition-duration) var(--md-easing-standard);
    -webkit-tap-highlight-color: transparent; /* Kills flashing selection background on phone tap */
  }

  .nav-item .material-symbols-rounded { font-size: 20px; }

  .nav-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background-color: var(--md-sys-color-surface-variant);
    border-radius: 20px;
    opacity: 0;
    transform: scaleX(0.7);
    transition: opacity var(--md-transition-duration) var(--md-easing-standard),
                transform var(--md-transition-duration) var(--md-easing-emphasized);
    z-index: -1;
  }

  .nav-item:hover { color: var(--md-sys-color-on-surface); }
  .nav-item:hover::before { opacity: 0.5; transform: scaleX(1); }

  .nav-item.active { color: var(--md-sys-color-on-secondary-container); }
  .nav-item.active::before {
    background-color: var(--md-sys-color-secondary-container);
    opacity: 1;
    transform: scaleX(1);
  }

  /* Mobile nav: hamburger button opens a full-width dropdown list instead
     of cramming icons into the bar. */
  @media (max-width: 600px) {
    .navbar { padding: 0 12px; gap: 8px; }
    .nav-logo span:last-child { display: none; }
    .nav-hamburger { display: flex; }

    .nav-links {
      display: none;
      position: fixed; top: 72px; left: 0; right: 0; z-index: 150;
      flex-direction: column; align-items: stretch; height: auto; gap: 2px;
      background-color: var(--md-sys-color-surface); border-bottom: 1px solid var(--md-sys-color-outline-variant);
      padding: 8px; max-height: calc(100vh - 72px); overflow-y: auto;
      box-shadow: 0 12px 24px rgba(0,0,0,0.35);
    }
    .nav-links.mobile-open { display: flex; }

    .nav-item {
      width: auto; height: auto; border-radius: 14px; justify-content: flex-start;
      padding: 14px 16px; gap: 14px;
    }
    .nav-item::before { border-radius: 14px; }

    .nav-links.mobile-open .nav-item-label { display: inline; font-size: 15px; }

    #accountBar { flex-shrink: 0; }
  }

  /* Content Wrapper */
  .page-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 56px 24px 100px;
  }

  .page-content {
    display: none;
    opacity: 0;
    transform: translateY(24px);
    will-change: transform, opacity;
  }

  .page-content.active {
    display: block;
    animation: materialFadeIn var(--md-transition-duration) var(--md-easing-emphasized) forwards;
  }

  @keyframes materialFadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Explicitly re-enable text selection rules on user narrative copy blocks */
  .hero-section h1, .hero-section p, .interactive-card h3, .interactive-card p, .nav-logo span {
    -webkit-user-select: text;
    -ms-user-select: text;
    user-select: text;
  }

  .animate-text-hero {
    opacity: 0;
    clip-path: inset(0 0 100% 0);
    animation: textReveal 700ms cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
  }
  
  .animate-text-sub {
    opacity: 0;
    animation: fadeInSub 600ms var(--md-easing-standard) forwards;
    animation-delay: 200ms;
  }

  @keyframes textReveal {
    from { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateY(16px); }
    to { opacity: 1; clip-path: inset(0 0 0 0); transform: translateY(0); }
  }

  @keyframes fadeInSub {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-section { margin-bottom: 48px; }
  .hero-section.home-hero { text-align: center; }
  .hero-section.home-hero .home-search-form { margin-left: auto; margin-right: auto; }
  .hero-section.home-hero .home-search-engines { justify-content: center; }
  .hero-section h1 {
    font-family: 'Google Sans', 'Product Sans', sans-serif;
    font-size: clamp(2.8rem, 7vw, 4rem);
    font-weight: 400;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  .hero-section p {
    color: var(--md-sys-color-on-surface-variant);
    font-size: 18px;
    line-height: 1.6;
    max-width: 560px;
  }

  .home-search-form { margin-top: 28px; max-width: 560px; position: relative; }
  .home-search-wrap { position: relative; }
  .home-search-icon {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
    color: var(--md-sys-color-on-surface-variant); font-size: 22px; pointer-events: none;
  }
  .home-search-input {
    width: 100%; background-color: var(--md-sys-color-surface); border: 1px solid var(--md-sys-color-outline);
    border-radius: 28px; padding: 16px 20px 16px 56px; color: var(--md-sys-color-on-surface);
    font-family: 'Google Sans', 'Roboto Flex', sans-serif; font-size: 16px; outline: none;
    transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
  }
  .home-search-input::placeholder { color: var(--md-sys-color-on-surface-variant); }
  .home-search-input:focus { border-color: var(--md-sys-color-primary); background-color: #1f2329; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .home-search-engines { display: flex; gap: 6px; margin-top: 10px; }
  .home-search-engine {
    background: transparent; border: 1px solid var(--md-sys-color-outline); color: var(--md-sys-color-on-surface-variant);
    border-radius: 100px; padding: 5px 14px; font-size: 12px; font-family: 'Google Sans', 'Product Sans', sans-serif;
    font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .home-search-engine:hover { background: rgba(255,255,255,0.06); color: var(--md-sys-color-on-surface); }
  .home-search-engine.active { background: var(--md-sys-color-secondary-container); border-color: transparent; color: var(--md-sys-color-on-secondary-container); }

  .home-search-dropdown {
    position: absolute; top: 100%; margin-top: 8px; left: 0; right: 0;
    background: var(--md-sys-color-surface); border: 1px solid var(--md-sys-color-outline);
    border-radius: 20px; padding: 8px; max-height: 380px; overflow-y: auto; z-index: 20;
    opacity: 0; pointer-events: none; transform: translateY(-6px);
    transition: opacity 0.15s, transform 0.15s;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .home-search-dropdown.open { opacity: 1; pointer-events: all; transform: translateY(0); }
  .hsd-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px;
    cursor: pointer; text-decoration: none; color: inherit;
  }
  .hsd-row:hover, .hsd-row.active { background: rgba(255,255,255,0.06); }
  .hsd-icon {
    width: 36px; height: 36px; border-radius: 50%; background: var(--md-sys-color-surface-variant);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;
  }
  .hsd-icon img { width: 100%; height: 100%; object-fit: cover; }
  .hsd-icon .material-symbols-rounded { font-size: 18px; color: var(--md-sys-color-on-surface-variant); }
  .hsd-main { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hsd-name { font-weight: 500; }
  .hsd-cat { color: var(--md-sys-color-on-surface-variant); font-weight: 400; }
  .hsd-empty, .hsd-loading { padding: 20px; text-align: center; color: var(--md-sys-color-on-surface-variant); font-size: 13px; }

  .home-feed-section { margin: 40px 0; }
  .home-feed-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .home-feed-heading h2 { font-family: 'Google Sans', 'Product Sans', sans-serif; font-size: 22px; font-weight: 400; }
  .home-feed-heading .header-link { display: inline-flex; align-items: center; gap: 4px; }
  .home-feed-heading .header-link:visited { color: var(--md-sys-color-primary); }
  .home-feed-heading .header-link .material-symbols-rounded { font-size: 16px; }
  .home-feed { display: flex; flex-direction: column; gap: 24px; max-width: 470px; margin: 0 auto; }
  .home-feed-empty { color: var(--md-sys-color-on-surface-variant); font-size: 14px; padding: 24px 0; text-align: center; }
  .home-feed-load-more {
    display: block; margin: 4px auto 0; padding: 10px 24px; border-radius: 100px; border: 1px solid var(--md-sys-color-outline);
    background: transparent; color: var(--md-sys-color-on-surface); font-family: 'Google Sans', 'Product Sans', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .home-feed-load-more:hover { background: rgba(255,255,255,0.06); }

  /* Instagram-style post card */
  .ig-card {
    display: block; background: var(--md-sys-color-surface); border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: 12px; text-decoration: none; color: inherit; overflow: hidden; cursor: pointer;
  }
  .ig-caption a { color: var(--md-sys-color-primary); text-decoration: underline; }
  .ig-caption strong a { color: inherit; text-decoration: none; }
  .ig-caption strong a:hover { text-decoration: underline; }
  .ig-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .ig-card-header a { color: inherit; text-decoration: none; display: flex; align-items: center; }
  .ig-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--md-sys-color-surface-variant); flex-shrink: 0; }
  .ig-header-text { flex: 1; min-width: 0; }
  .ig-username { font-size: 13px; font-weight: 600; }
  .ig-username a:hover { text-decoration: underline; }
  .ig-subtag { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
  .ig-media { width: 100%; aspect-ratio: 4/5; background: #000; position: relative; }
  .ig-media img, .ig-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ig-play-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.15); pointer-events: none; transition: opacity 0.15s;
  }
  .ig-play-overlay .material-symbols-rounded {
    font-size: 30px; color: #fff; background: rgba(0,0,0,0.45); border-radius: 50%; padding: 14px;
  }
  .ig-media.playing .ig-play-overlay { opacity: 0; }
  .ig-audio-attach {
    display: flex; align-items: center; gap: 10px; margin: 12px 14px 0; padding: 12px 14px;
    background: var(--md-sys-color-surface-variant); border-radius: 12px; cursor: default;
  }
  .ig-audio-attach .material-symbols-rounded { font-size: 22px; color: var(--md-sys-color-primary); flex-shrink: 0; }
  .ig-audio-attach audio { flex: 1; min-width: 0; height: 32px; }
  .ig-actions { display: flex; align-items: center; gap: 4px; padding: 10px 14px 4px; }
  .ig-actions .material-symbols-rounded { font-size: 24px; color: var(--md-sys-color-on-surface); }
  .ig-action-count { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
  .ig-vote-btn, .ig-comment-btn {
    background: none; border: none; padding: 4px; margin: 0; cursor: pointer; display: flex; align-items: center;
    color: var(--md-sys-color-on-surface); border-radius: 50%;
  }
  .ig-vote-btn:hover, .ig-comment-btn:hover { background: rgba(255,255,255,0.06); }
  .ig-vote-btn.upvoted .material-symbols-rounded { color: #ff5c7a; font-variation-settings: 'FILL' 1; }
  .ig-vote-btn.downvoted .material-symbols-rounded { color: var(--md-sys-color-error); }
  .ig-vote-score { font-size: 13px; font-weight: 600; min-width: 16px; text-align: center; margin: 0 2px; }
  .ig-comment-btn { margin-left: 6px; }
  .ig-likes { padding: 4px 14px 0; font-size: 13px; font-weight: 600; }
  .ig-caption { padding: 6px 14px 0; font-size: 13px; line-height: 1.4; }
  .ig-caption strong { font-weight: 600; margin-right: 6px; }
  .ig-description {
    padding: 4px 14px 0; font-size: 13px; line-height: 1.4; color: var(--md-sys-color-on-surface-variant);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .ig-description a { color: var(--md-sys-color-primary); }
  .ig-view-comments { padding: 6px 14px 0; font-size: 13px; color: var(--md-sys-color-on-surface-variant); background: none; border: none; cursor: pointer; display: block; text-align: left; font-family: inherit; }
  .ig-view-comments:hover { text-decoration: underline; }
  .ig-timestamp { padding: 6px 14px 14px; font-size: 11px; color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; letter-spacing: 0.3px; }

  /* Inline comment modal for the home feed */
  .ig-comment-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 220; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .ig-comment-overlay.open { opacity: 1; pointer-events: all; }
  .ig-comment-modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -48%); width: min(480px, 92vw);
    max-height: 80vh; display: flex; flex-direction: column; background: var(--md-sys-color-surface);
    border-radius: 24px; z-index: 221; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  }
  .ig-comment-modal.open { opacity: 1; pointer-events: all; transform: translate(-50%, -50%); }
  .ig-comment-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--md-sys-color-outline-variant); flex-shrink: 0; }
  .ig-comment-modal-header h3 { font-size: 16px; font-weight: 500; }
  .ig-comment-close-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent; color: var(--md-sys-color-on-surface-variant); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ig-comment-close-btn:hover { background: rgba(255,255,255,0.06); }
  .ig-comment-list { flex: 1; overflow-y: auto; padding: 8px 20px; }
  .ig-comment-row { display: flex; gap: 10px; padding: 10px 0; }
  .ig-comment-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--md-sys-color-surface-variant); flex-shrink: 0; }
  .ig-comment-body-wrap { flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; }
  .ig-comment-body-wrap strong { font-weight: 600; margin-right: 6px; }
  .ig-comment-time { font-size: 11px; color: var(--md-sys-color-on-surface-variant); margin-top: 2px; }
  .ig-comment-empty { text-align: center; color: var(--md-sys-color-on-surface-variant); font-size: 13px; padding: 30px 0; }
  .ig-comment-form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--md-sys-color-outline-variant); flex-shrink: 0; }
  .ig-comment-input {
    flex: 1; background: var(--md-sys-color-background); border: 1px solid var(--md-sys-color-outline); border-radius: 20px;
    padding: 10px 16px; color: var(--md-sys-color-on-surface); font-family: inherit; font-size: 13px; outline: none; resize: none;
  }
  .ig-comment-send-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .ig-comment-send-btn:disabled { opacity: 0.4; cursor: default; }

  .grid-layout {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }

  .interactive-card {
    background-color: var(--md-sys-color-surface);
    border-radius: 28px;
    padding: 28px;
    text-decoration: none;
    color: inherit;
    border: 1px solid transparent;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 180px;
    -webkit-tap-highlight-color: transparent; /* Suppresses blue system feedback box over link geometry */
    transition: background-color 200ms var(--md-easing-standard),
                border-color 200ms var(--md-easing-standard),
                transform 250ms var(--md-easing-emphasized);
  }

  .interactive-card:hover {
    background-color: #21242c;
    border-color: var(--md-sys-color-outline-variant);
    transform: translateY(-4px);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .card-icon-box {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background-color: var(--md-sys-color-surface-variant);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--md-sys-color-primary);
  }

  .card-arrow {
    color: var(--md-sys-color-on-surface-variant);
    font-size: 22px;
    transition: transform 200ms var(--md-easing-standard);
  }

  .interactive-card:hover .card-arrow {
    transform: translate(2px, -2px) scale(1.05);
    color: var(--md-sys-color-primary);
  }

  .interactive-card h3 {
    font-family: 'Google Sans', 'Product Sans', sans-serif;
    font-size: 20px;
    font-weight: 400;
    margin-bottom: 6px;
  }

  .interactive-card p {
    font-size: 14px;
    line-height: 1.5;
    color: var(--md-sys-color-on-surface-variant);
  }
</style>
</head>
<body>

  <div class="bg-aura" aria-hidden="true"></div>

  <div class="page-container" id="pageContainer"></div>

  <div class="ig-comment-overlay" id="igCommentOverlay"></div>
  <div class="ig-comment-modal" id="igCommentModal">
    <div class="ig-comment-modal-header">
      <h3>Comments</h3>
      <button class="ig-comment-close-btn" id="igCommentCloseBtn"><span class="material-symbols-rounded">close</span></button>
    </div>
    <div class="ig-comment-list" id="igCommentList"></div>
    <form class="ig-comment-form" id="igCommentForm">
      <textarea class="ig-comment-input" id="igCommentInput" rows="1" placeholder="Add a comment…" maxlength="2000"></textarea>
      <button type="submit" class="ig-comment-send-btn" id="igCommentSendBtn"><span class="material-symbols-rounded">send</span></button>
    </form>
  </div>

<script type="module">
  import { db, getProfile, handleOf, ensureProfileLoaded, officialBadgeHtml, getCurrentUser, sendNotification } from './shared/account.js?v=12';
  import { mountTopNav } from './shared/topnav.js?v=5';
  import { mountFooter } from './shared/footer.js?v=3';
  import {
    collection, query, orderBy, limit, onSnapshot, doc, updateDoc, arrayUnion, arrayRemove, addDoc, serverTimestamp,
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  mountTopNav();
  mountFooter();

  function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function linkify(str) {
    return escHtml(str).replace(/(https?:\/\/[^\s<]+[^\s<.,:;!?'")\]])/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  }
  // Plain-text excerpt for a markdown post/video body — strips formatting
  // syntax (headings, bullets, tables, links, emphasis) rather than
  // rendering it, since a card excerpt has no room for real markdown layout
  // and raw ** / # / | syntax would just look like noise.
  function stripMarkdown(text, maxLen) {
    if (!text) return '';
    let s = text
      .replace(/\r\n/g, '\n')
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^#{1,6}[ \t]+/gm, '')
      .replace(/^>[ \t]?/gm, '')
      .replace(/^[ \t]*\|.*\|[ \t]*$/gm, '')
      .replace(/^[ \t]*(-{3,}|\*{3,}|_{3,})[ \t]*$/gm, '')
      .replace(/^[ \t]*[-*+][ \t]+/gm, '• ')
      .replace(/^[ \t]*\d+\.[ \t]+/gm, '')
      .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')
      .replace(/\[\[([^\]]+)\]\]\([^)]+\)/g, '$1')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .replace(/\*\*\*(.+?)\*\*\*/g, '$1')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/__(.+?)__/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/(?<!\w)_([^_\s][^_]*)_(?!\w)/g, '$1')
      .split('\n').map(l => l.trim()).filter(Boolean).join(' ')
      .replace(/[ \t]{2,}/g, ' ')
      .trim();
    if (maxLen && s.length > maxLen) s = s.slice(0, maxLen).replace(/\s+\S*$/, '') + '…';
    return s;
  }
  function timeAgo(date) {
    const s = Math.floor((Date.now() - date.getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 2592000) return Math.floor(s / 86400) + 'd ago';
    return date.toLocaleDateString();
  }
  const TAG_LABELS = { general: 'General', showcase: 'Showcase', help: 'Help', feedback: 'Feedback' };
  function firstImageUrl(p) {
    const urls = p.imageUrls && p.imageUrls.length ? p.imageUrls : (p.imageUrl ? [p.imageUrl] : []);
    const url = urls[0];
    return url && /\.(jpe?g|png|gif|webp|avif)$/i.test(url) ? url : null;
  }
  function firstVideoUrl(p) {
    const urls = p.imageUrls && p.imageUrls.length ? p.imageUrls : (p.imageUrl ? [p.imageUrl] : []);
    const url = urls[0];
    return url && /\.(mp4|webm|mov|m4v|ogv)$/i.test(url) ? url : null;
  }
  function firstAudioUrl(p) {
    const urls = p.imageUrls && p.imageUrls.length ? p.imageUrls : (p.imageUrl ? [p.imageUrl] : []);
    const url = urls[0];
    return url && /\.(mp3|wav|ogg|m4a|flac|aac|opus|weba)$/i.test(url) ? url : null;
  }

  const feedEl = document.getElementById('homeFeed');
  if (feedEl) {
    let latestPosts = [];
    let latestVideos = [];
    let gotPosts = false, gotVideos = false;
    let feedLimit = 20;

    function renderFeed() {
      if (!gotPosts || !gotVideos) return; // wait for both so items interleave by date, not by whichever loaded first
      const items = [...latestPosts, ...latestVideos].sort((a, b) => b._date - a._date).slice(0, feedLimit);
      if (items.length === 0) {
        feedEl.innerHTML = '<div class="home-feed-empty">Nothing posted yet — be the first to say something.</div>';
        return;
      }
      const canLoadMore = latestPosts.length >= feedLimit || latestVideos.length >= feedLimit;
      feedEl.innerHTML = items.map(item => item._kind === 'video' ? videoCardHtml(item) : postCardHtml(item)).join('')
        + (canLoadMore ? `<button type="button" class="home-feed-load-more" id="feedLoadMoreBtn">Load more</button>` : '');
      const loadMoreBtn = document.getElementById('feedLoadMoreBtn');
      if (loadMoreBtn) loadMoreBtn.addEventListener('click', () => {
        feedLimit += 20;
        gotPosts = false; gotVideos = false;
        subscribeFeed();
      });
    }

    function voteActionsHtml(item, kind) {
      const user = getCurrentUser();
      const score = (item.upvoters || []).length - (item.downvoters || []).length;
      const up = user && (item.upvoters || []).includes(user.uid);
      const down = user && (item.downvoters || []).includes(user.uid);
      return `
        <button type="button" class="ig-vote-btn ${up ? 'upvoted' : ''}" data-vote-up data-kind="${kind}" data-id="${item.id}" title="Upvote">
          <span class="material-symbols-rounded">${up ? 'favorite' : 'favorite_border'}</span>
        </button>
        <span class="ig-vote-score">${score}</span>
        <button type="button" class="ig-vote-btn ${down ? 'downvoted' : ''}" data-vote-down data-kind="${kind}" data-id="${item.id}" title="Downvote">
          <span class="material-symbols-rounded">arrow_downward</span>
        </button>
      `;
    }

    function authorNameHtml(email, profile) {
      const handle = handleOf(email);
      const inner = `${escHtml(profile.name)}${officialBadgeHtml(email)}`;
      return handle ? `<a href="/profile?u=${encodeURIComponent(handle)}">${inner}</a>` : `<span>${inner}</span>`;
    }

    function cardHeaderHtml(email, profile, subtag) {
      const handle = handleOf(email);
      const avatar = `<img class="ig-avatar" src="${profile.photo || ''}" alt="">`;
      return `
        <div class="ig-card-header">
          ${handle ? `<a href="/profile?u=${encodeURIComponent(handle)}">${avatar}</a>` : avatar}
          <div class="ig-header-text">
            <div class="ig-username">${authorNameHtml(email, profile)}</div>
            <div class="ig-subtag">${subtag}</div>
          </div>
        </div>
      `;
    }

    function postCardHtml(p) {
      const profile = getProfile(p.authorEmail, p.authorName, p.authorPhoto);
      const tag = (p.tags || [])[0];
      const img = firstImageUrl(p);
      const vid = !img ? firstVideoUrl(p) : null;
      const aud = !img && !vid ? firstAudioUrl(p) : null;
      const score = (p.upvoters || []).length - (p.downvoters || []).length;
      return `
        <div class="ig-card" data-kind="post" data-id="${p.id}" data-href="https://oeper.dev/forum?post=${p.id}">
          ${cardHeaderHtml(p.authorEmail, profile, tag ? escHtml(TAG_LABELS[tag] || tag) : 'oeper.dev')}
          ${img ? `<div class="ig-media"><img src="${img}" alt="" loading="lazy"></div>` : ''}
          ${vid ? `<div class="ig-media"><video src="${vid}" muted preload="metadata"></video></div>` : ''}
          ${aud ? `<div class="ig-audio-attach" onclick="event.stopPropagation()"><span class="material-symbols-rounded">music_note</span><audio controls preload="metadata" src="${aud}"></audio></div>` : ''}
          <div class="ig-actions">
            ${voteActionsHtml(p, 'post')}
            <button type="button" class="ig-comment-btn" data-open-comments data-kind="post" data-id="${p.id}" title="Comments">
              <span class="material-symbols-rounded">mode_comment</span>
            </button>
            <span class="material-symbols-rounded" style="margin-left:auto;">visibility</span>
            <span class="ig-action-count">${p.views || 0}</span>
          </div>
          <div class="ig-likes">${score} upvote${score === 1 ? '' : 's'}</div>
          <div class="ig-caption"><strong>${authorNameHtml(p.authorEmail, profile)}</strong>${linkify(p.title)}</div>
          ${p.body ? `<div class="ig-description">${linkify(stripMarkdown(p.body, 220))}</div>` : ''}
          <button type="button" class="ig-view-comments" data-open-comments data-kind="post" data-id="${p.id}">${p.commentCount ? `View all ${p.commentCount} comments` : 'Add a comment…'}</button>
          <div class="ig-timestamp">${timeAgo(p._date)}</div>
        </div>
      `;
    }

    function videoCardHtml(v) {
      const profile = getProfile(v.authorEmail, v.authorName, v.authorPhoto);
      const score = (v.upvoters || []).length - (v.downvoters || []).length;
      return `
        <div class="ig-card" data-kind="video" data-id="${v.id}" data-href="https://oeper.dev/videos?video=${v.id}">
          ${cardHeaderHtml(v.authorEmail, profile, 'Video')}
          <div class="ig-media" data-video-media>
            <video src="${v.url}" muted preload="metadata"></video>
            <div class="ig-play-overlay"><span class="material-symbols-rounded">play_arrow</span></div>
          </div>
          <div class="ig-actions">
            ${voteActionsHtml(v, 'video')}
            <button type="button" class="ig-comment-btn" data-open-comments data-kind="video" data-id="${v.id}" title="Comments">
              <span class="material-symbols-rounded">mode_comment</span>
            </button>
            <span class="material-symbols-rounded" style="margin-left:auto;">visibility</span>
            <span class="ig-action-count">${v.views || 0}</span>
          </div>
          <div class="ig-likes">${score} upvote${score === 1 ? '' : 's'}</div>
          <div class="ig-caption"><strong>${authorNameHtml(v.authorEmail, profile)}</strong>${linkify(v.title)}</div>
          ${v.description ? `<div class="ig-description">${linkify(stripMarkdown(v.description, 220))}</div>` : ''}
          <button type="button" class="ig-view-comments" data-open-comments data-kind="video" data-id="${v.id}">${v.commentCount ? `View all ${v.commentCount} comments` : 'Add a comment…'}</button>
          <div class="ig-timestamp">${timeAgo(v._date)}</div>
        </div>
      `;
    }

    async function toggleVote(kind, id, direction) {
      const user = getCurrentUser();
      if (!user) { alert('Sign in to vote'); return; }
      const list = kind === 'video' ? latestVideos : latestPosts;
      const item = list.find(x => x.id === id);
      if (!item) return;
      const uid = user.uid;
      const up = (item.upvoters || []).includes(uid);
      const down = (item.downvoters || []).includes(uid);
      const patch = {};
      if (direction === 'up') {
        patch.upvoters = up ? arrayRemove(uid) : arrayUnion(uid);
        if (down) patch.downvoters = arrayRemove(uid);
      } else {
        patch.downvoters = down ? arrayRemove(uid) : arrayUnion(uid);
        if (up) patch.upvoters = arrayRemove(uid);
      }
      try {
        await updateDoc(doc(db, kind === 'video' ? 'videos' : 'posts', id), patch);
        if (direction === 'up' && !up) {
          sendNotification({ recipientEmail: item.authorEmail, type: 'upvote', targetKind: kind, targetId: id, preview: item.title });
        }
      } catch (err) {
        alert('Could not vote: ' + err.message);
      }
    }

    // ── Inline comment modal (posts and videos both use posts/videos/{id}/comments) ──
    let openItemId = null;
    let openItemKind = null;
    let unsubComments = null;
    const commentOverlay = document.getElementById('igCommentOverlay');
    const commentModal = document.getElementById('igCommentModal');
    const commentList = document.getElementById('igCommentList');
    const commentForm = document.getElementById('igCommentForm');
    const commentInput = document.getElementById('igCommentInput');
    const commentSendBtn = document.getElementById('igCommentSendBtn');

    function renderComments(comments) {
      if (comments.length === 0) {
        commentList.innerHTML = '<div class="ig-comment-empty">No comments yet. Be the first!</div>';
        return;
      }
      commentList.innerHTML = comments.map(c => {
        const profile = getProfile(c.authorEmail, c.authorName, c.authorPhoto);
        return `
          <div class="ig-comment-row">
            <img class="ig-comment-avatar" src="${profile.photo || ''}" alt="">
            <div class="ig-comment-body-wrap">
              <div><strong>${escHtml(profile.name)}${officialBadgeHtml(c.authorEmail)}</strong>${linkify(c.body)}</div>
              <div class="ig-comment-time">${timeAgo(c._date)}</div>
            </div>
          </div>
        `;
      }).join('');
      commentList.scrollTop = commentList.scrollHeight;
    }

    function openComments(kind, itemId) {
      openItemKind = kind;
      openItemId = itemId;
      commentOverlay.classList.add('open');
      commentModal.classList.add('open');
      commentList.innerHTML = '<div class="ig-comment-empty">Loading…</div>';
      if (unsubComments) unsubComments();
      unsubComments = onSnapshot(
        query(collection(db, kind === 'video' ? 'videos' : 'posts', itemId, 'comments'), orderBy('createdAt', 'asc')),
        async snap => {
          const comments = snap.docs.map(d => {
            const data = d.data();
            return { id: d.id, ...data, _date: data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : new Date() };
          });
          await Promise.all(comments.map(c => ensureProfileLoaded(c.authorEmail)));
          if (openItemId === itemId) renderComments(comments);
        },
        () => { commentList.innerHTML = '<div class="ig-comment-empty">Could not load comments.</div>'; }
      );
    }

    function closeComments() {
      commentOverlay.classList.remove('open');
      commentModal.classList.remove('open');
      if (unsubComments) { unsubComments(); unsubComments = null; }
      openItemId = null;
      openItemKind = null;
    }
    commentOverlay.addEventListener('click', closeComments);
    document.getElementById('igCommentCloseBtn').addEventListener('click', closeComments);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeComments(); });

    commentForm.addEventListener('submit', async e => {
      e.preventDefault();
      const user = getCurrentUser();
      const body = commentInput.value.trim();
      if (!openItemId || !body) return;
      if (!user) { alert('Sign in to comment'); return; }
      commentSendBtn.disabled = true;
      try {
        const collectionName = openItemKind === 'video' ? 'videos' : 'posts';
        await addDoc(collection(db, collectionName, openItemId, 'comments'), {
          body,
          imageUrl: null,
          authorEmail: user.email,
          authorName: user.displayName,
          authorPhoto: user.photoURL,
          upvoters: [],
          downvoters: [],
          createdAt: serverTimestamp(),
        });
        const list = openItemKind === 'video' ? latestVideos : latestPosts;
        const item = list.find(x => x.id === openItemId);
        await updateDoc(doc(db, collectionName, openItemId), { commentCount: (item?.commentCount || 0) + 1 });
        if (item) sendNotification({ recipientEmail: item.authorEmail, type: 'comment', targetKind: openItemKind, targetId: openItemId, preview: body.slice(0, 120) });
        commentInput.value = '';
      } catch (err) {
        alert('Could not comment: ' + err.message);
      } finally {
        commentSendBtn.disabled = false;
      }
    });
    commentInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commentForm.requestSubmit(); }
    });

    feedEl.addEventListener('click', e => {
      if (e.target.closest('a')) return; // real links (linkified URLs) behave normally
      const voteUpBtn = e.target.closest('[data-vote-up]');
      const voteDownBtn = e.target.closest('[data-vote-down]');
      const commentBtn = e.target.closest('[data-open-comments]');
      if (voteUpBtn) { toggleVote(voteUpBtn.dataset.kind, voteUpBtn.dataset.id, 'up'); return; }
      if (voteDownBtn) { toggleVote(voteDownBtn.dataset.kind, voteDownBtn.dataset.id, 'down'); return; }
      if (commentBtn) { openComments(commentBtn.dataset.kind, commentBtn.dataset.id); return; }
      const videoMedia = e.target.closest('[data-video-media]');
      if (videoMedia) {
        const videoEl = videoMedia.querySelector('video');
        if (videoEl.paused) {
          videoEl.muted = false;
          videoEl.controls = true;
          videoEl.play();
          videoMedia.classList.add('playing');
        } else {
          videoEl.pause();
        }
        return;
      }
      const card = e.target.closest('.ig-card');
      if (!card) return;
      // Posts stay on the home feed and open inline (the comment modal doubles
      // as the post-detail view); videos still go to /videos for the real player.
      if (card.dataset.kind === 'post') { openComments('post', card.dataset.id); return; }
      if (card.dataset.href) window.location.href = card.dataset.href;
    });

    let unsubFeedPosts = null;
    let unsubFeedVideos = null;

    function subscribeFeed() {
      if (unsubFeedPosts) unsubFeedPosts();
      if (unsubFeedVideos) unsubFeedVideos();

      unsubFeedPosts = onSnapshot(
        query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(feedLimit)),
        async snap => {
          latestPosts = snap.docs.map(d => {
            const data = d.data();
            return { _kind: 'post', id: d.id, ...data, _date: data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : new Date() };
          });
          await Promise.all(latestPosts.map(p => ensureProfileLoaded(p.authorEmail)));
          gotPosts = true;
          renderFeed();
        },
        err => { feedEl.innerHTML = `<div class="home-feed-empty">Could not load the feed: ${escHtml(err.message)}</div>`; }
      );

      unsubFeedVideos = onSnapshot(
        query(collection(db, 'videos'), orderBy('createdAt', 'desc'), limit(feedLimit)),
        async snap => {
          latestVideos = snap.docs.map(d => {
            const data = d.data();
            return { _kind: 'video', id: d.id, ...data, _date: data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : new Date() };
          });
          await Promise.all(latestVideos.map(v => ensureProfileLoaded(v.authorEmail)));
          gotVideos = true;
          renderFeed();
        },
        () => { gotVideos = true; renderFeed(); } // videos rules may not be deployed yet on some setups — degrade to posts-only rather than blocking the feed forever
      );
    }
    subscribeFeed();
  }

  const SEARCH_ENGINES = {
    google: { action: 'https://www.google.com/search', param: 'q' },
    duckduckgo: { action: 'https://duckduckgo.com/', param: 'q' },
    bing: { action: 'https://www.bing.com/search', param: 'q' },
  };
  const searchForm = document.getElementById('homeSearchForm');
  if (searchForm) {
    const searchInput = document.getElementById('homeSearchInput');
    const engineButtons = document.querySelectorAll('#homeSearchEngines .home-search-engine');
    let engine = localStorage.getItem('oe-search-engine') || 'google';
    if (!SEARCH_ENGINES[engine]) engine = 'google';

    function applyEngine() {
      searchForm.action = SEARCH_ENGINES[engine].action;
      searchInput.name = SEARCH_ENGINES[engine].param;
      engineButtons.forEach(b => b.classList.toggle('active', b.dataset.engine === engine));
    }
    applyEngine();

    engineButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        engine = btn.dataset.engine;
        localStorage.setItem('oe-search-engine', engine);
        applyEngine();
        searchInput.focus();
      });
    });
  }
</script>
<script>
const PAGES = [
  {
    id: 'home',
    title: 'Home',
    icon: 'home',
    heroTitle: 'Welcome to oeper.dev!',
    heroSub: 'This is my website with a bunch of my stuff like my projects, articles and a lot more. Feel free to do whatever you want!',
    items: []
  },
  {
    id: 'forum',
    title: 'Feed',
    icon: 'forum',
    url: 'https://oeper.dev/forum',
    heroTitle: 'Talk to Other Visitors',
    heroSub: 'Post, tag, and discuss.',
    items: []
  },
  {
    id: 'videos',
    title: 'Videos',
    icon: 'smart_display',
    url: 'https://oeper.dev/videos',
    heroTitle: 'Long-Form Videos',
    heroSub: 'Watch and upload videos from anyone signed in.',
    items: []
  },
  {
    id: 'projects',
    title: 'Projects',
    icon: 'apps',
    url: 'https://oeper.dev/projects',
    heroTitle: 'What People Have Built',
    heroSub: 'Projects uploaded by anyone signed in.',
    items: []
  },
  {
    id: 'files',
    title: 'Files',
    icon: 'folder',
    url: 'https://oeper.dev/files',
    heroTitle: 'Shared Files',
    heroSub: 'Browse and download everything shared here.',
    items: []
  },
  {
    id: 'tools',
    title: 'Tools',
    icon: 'build',
    url: 'https://oeper.dev/tools',
    heroTitle: 'Free Tools',
    heroSub: 'No sign-up, no paywall.',
    items: []
  }
];

const pageContainer = document.getElementById('pageContainer');

PAGES.forEach((page, index) => {
  const isFirst = index === 0;

  if (page.url) return;

  const pageSection = document.createElement('div');
  pageSection.id = page.id;
  pageSection.className = `page-content ${isFirst ? 'active' : ''}`;

  const cardsHtml = page.items.map(item => `
    <a href="#" class="interactive-card" onclick="${item.action}">
      <div class="card-header">
        <div class="card-icon-box"><span class="material-symbols-rounded">${item.icon}</span></div>
        ${item.action !== '#' ? '<span class="material-symbols-rounded card-arrow">north_east</span>' : ''}
      </div>
      <div>
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
      </div>
    </a>
  `).join('');

  pageSection.innerHTML = `
    <div class="hero-section${isFirst ? ' home-hero' : ''}">
      <h1 class="${isFirst ? 'animate-text-hero' : ''}">${page.heroTitle}</h1>
      ${isFirst ? '' : `<p>${page.heroSub}</p>`}
      ${isFirst ? `
        <form class="home-search-form" id="homeSearchForm" action="https://www.google.com/search" method="GET" autocomplete="off">
          <div class="home-search-wrap">
            <span class="material-symbols-rounded home-search-icon">search</span>
            <input class="home-search-input" type="text" name="q" id="homeSearchInput" placeholder="Search the web…" autocomplete="off">
          </div>
          <div class="home-search-engines" id="homeSearchEngines">
            <button type="button" class="home-search-engine" data-engine="google">Google</button>
            <button type="button" class="home-search-engine" data-engine="duckduckgo">DuckDuckGo</button>
            <button type="button" class="home-search-engine" data-engine="bing">Bing</button>
          </div>
        </form>
      ` : ''}
    </div>
    ${isFirst ? `
      <div class="home-feed-section">
        <div class="home-feed-heading">
          <h2>Feed</h2>
        </div>
        <div class="home-feed" id="homeFeed"></div>
      </div>
    ` : ''}
    <div class="grid-layout">${cardsHtml}</div>
  `;

  pageContainer.appendChild(pageSection);
});
</script>
</body>
