<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — oeper.dev</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://oeper.dev/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="https://oeper.dev/icon.ico?v=3" type="image/x-icon">
<script src="./shared/theme-boot.js?v=10"></script>

<script>
// GitHub Pages has no server-side rewrites, so a clean URL like
// /feed/<postId> or /profile/<handle> 404s here instead of loading the
// real page directly. This is that fallback: recognize the known clean
// path shapes and redirect (not just link) to the real file + query
// string it corresponds to. Each of those pages then rewrites the address
// bar back to the clean form via history.replaceState once it has loaded
// the content — so this redirect only costs an extra hop on direct/
// external entry (typed, bookmarked, or shared links), never on normal
// in-site navigation, since internal links point straight at the real
// files already.
(function () {
  var path = window.location.pathname;
  var m;
  if ((m = path.match(/^\/profile\/([^/]+)\/?$/))) {
    location.replace('/profile.html?u=' + m[1]);
  } else if ((m = path.match(/^\/feed\/([^/]+)\/?$/))) {
    location.replace('/feed.html?post=' + m[1]);
  } else if ((m = path.match(/^\/videos\/([^/]+)\/?$/))) {
    location.replace('/videos.html?video=' + m[1]);
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.cdnfonts.com">

<style>

    --md-sys-color-surface-variant: #2f353d;

  .wrap { text-align: center; padding: 24px; max-width: 420px; }

  h1 { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 400; margin-bottom: 10px; }
  p { color: var(--md-sys-color-on-surface-variant); font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
  a.btn {
    display: inline-flex; align-items: center; gap: 8px; background-color: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary); text-decoration: none; font-weight: 500; font-size: 14px;
    padding: 12px 24px; border-radius: 100px;
  }
  a.btn:hover { opacity: 0.9; }
</style>
</head>

<div class="wrap">
  <div class="icon material-symbols-rounded">search_off</div>
  <h1>Page not found</h1>
  <p>There's nothing here. The link might be broken, or the page may have moved.</p>
  <a class="btn" href="/"><span class="material-symbols-rounded" style="font-size:18px;">home</span>Back to oeper.dev</a>
</div>

</body>
