<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — oeper.dev</title>
<meta name="description" content="Customize how oeper.dev looks">
<meta property="og:title" content="Settings — oeper.dev">
<meta property="og:description" content="Customize how oeper.dev looks">
<meta property="og:url" content="https://oeper.dev/settings">
<meta property="og:type" content="website">
<link rel="icon" href="https://oeper.dev/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="https://oeper.dev/icon.ico?v=3" type="image/x-icon">
<script src="./shared/theme-boot.js?v=7"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Freehand&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--md-sys-color-primary, #a8c7fa); outline-offset: 2px; }

  :root {
    --md-sys-color-background: #111318;
    --md-sys-color-surface: #1a1c22;
    --md-sys-color-surface-variant: #2f353d;
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-on-primary: #062e6f;
    --md-sys-color-secondary-container: #33485d;
    --md-sys-color-on-secondary-container: #d2e4ff;
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c7c5;
    --md-sys-color-outline: #43474e;
    --md-sys-color-outline-variant: #8c9199;
    --md-sys-color-error: #ffb4ab;
    --md-sys-color-success: #a6d9a8;
  }

  body {
    min-height: 100vh;
    background-color: var(--md-sys-color-background);
    font-family: var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif);
    background-image: var(--oe-bg-image, none);
    color: var(--md-sys-color-on-surface);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page { position: relative; max-width: 640px; margin: 0 auto; padding: 56px 24px 100px; }

  .header { margin-bottom: 36px; }
  .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
  .header-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--md-sys-color-primary); text-decoration: none;
    font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 14px; font-weight: 500; transition: opacity 0.2s;
  }
  .header-link:hover { opacity: 0.8; }
  .header-link:visited { color: var(--md-sys-color-primary); }
  .header h1 {
    font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: clamp(2.25rem, 6vw, 3rem); font-weight: 400;
    margin-bottom: 10px; letter-spacing: -0.5px;
  }
  .header p { color: var(--md-sys-color-on-surface-variant); font-size: 15px; max-width: 500px; line-height: 1.5; }

  .settings-section { margin-bottom: 36px; }
  .settings-section h2 {
    font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 20px; font-weight: 500; margin-bottom: 6px;
  }
  .settings-section .section-desc { color: var(--md-sys-color-on-surface-variant); font-size: 14px; line-height: 1.5; margin-bottom: 16px; max-width: 480px; }

  .group { background-color: var(--md-sys-color-surface); border-radius: 20px; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 16px; padding: 18px 22px;
    border-bottom: 1px solid var(--md-sys-state-hover);
  }
  .row:last-child { border-bottom: none; }
  .row-icon {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; background: var(--md-sys-color-surface-variant);
    display: flex; align-items: center; justify-content: center; color: var(--md-sys-color-on-surface-variant);
  }
  .row-icon .material-symbols-rounded { font-size: 20px; }
  .row-text { flex: 1; min-width: 0; }
  .row-title { font-size: 15px; font-weight: 500; }
  .row-sub { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin-top: 2px; }
  .row-block { padding: 4px 22px 22px; }

  .oe-theme-grid { display: flex; flex-wrap: wrap; gap: 12px; }

  .footnote { text-align: center; color: var(--md-sys-color-on-surface-variant); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<div class="page">
  <header class="header">
    <h1>Settings</h1>
  </header>

  <div class="settings-section">
    <h2>Appearance</h2>
    <div class="group">
      <div class="row">
        <div class="row-icon"><span class="material-symbols-rounded">palette</span></div>
        <div class="row-text">
          <div class="row-title">Theme</div>
          <div class="row-sub" id="themeSubtitle">Material Dark</div>
        </div>
      </div>
      <div class="row-block" id="themePicker"></div>
    </div>
  </div>

  <div class="settings-section">
    <h2>Account</h2>
    <div class="group">
      <a class="row" id="profileRow" href="#" style="text-decoration:none; color:inherit;">
        <div class="row-icon"><span class="material-symbols-rounded">person</span></div>
        <div class="row-text">
          <div class="row-title" id="profileRowTitle">Profile</div>
          <div class="row-sub" id="profileRowSub">Sign in to edit your display name, bio, and photo.</div>
        </div>
      </a>
    </div>
  </div>

  <div class="settings-section" id="badgeSection" style="display:none;">
    <h2>Your badge</h2>
    <div class="group">
      <div class="row">
        <div class="row-icon"><span class="material-symbols-rounded">verified</span></div>
        <div class="row-text">
          <div class="row-title">OFFICIAL badge</div>
          <div class="row-sub">Shown next to your name everywhere on the site.</div>
        </div>
      </div>
      <div class="row-block" id="badgeModeSlot"></div>
      <div class="row-block" id="badgeLabelSlot" style="display:none;">
        <input type="text" id="badgeLabelInput" maxlength="24" placeholder="Custom label (e.g. FOUNDER)"
          style="width:100%; background: var(--md-sys-color-background); border: 1px solid var(--md-sys-color-outline); border-radius: 12px; padding: 12px 14px; color: var(--md-sys-color-on-surface); font-size: 14px; font-family: inherit; outline: none;">
      </div>
      <button class="row" id="badgeSaveBtn" style="width:100%; border:none; background:none; text-align:left; cursor:pointer; font:inherit; color:var(--md-sys-color-primary);">
        <div class="row-icon"><span class="material-symbols-rounded">check</span></div>
        <div class="row-text"><div class="row-title">Save</div></div>
      </button>
    </div>
  </div>

  <div class="settings-section" id="accountActionsSection" style="display:none;">
    <div class="group">
      <button class="row" id="switchAccountRow" style="width:100%; border:none; background:none; text-align:left; cursor:pointer; font:inherit; color:inherit;">
        <div class="row-icon"><span class="material-symbols-rounded">swap_horiz</span></div>
        <div class="row-text">
          <div class="row-title">Switch account</div>
          <div class="row-sub">Sign in with a different Google account.</div>
        </div>
      </button>
      <button class="row" id="signOutRow" style="width:100%; border:none; background:none; text-align:left; cursor:pointer; font:inherit; color:var(--md-sys-color-error);">
        <div class="row-icon"><span class="material-symbols-rounded">logout</span></div>
        <div class="row-text">
          <div class="row-title">Sign out</div>
          <div class="row-sub">You'll need to sign in again to post, chat, or vote.</div>
        </div>
      </button>
    </div>
  </div>

  <p class="footnote"><a href="/status" class="header-link" style="font-size:12px;">Server status</a></p>
</div>

<script type="module">
import {
  getCurrentUser, onAccountChange, handleOf, signIn, signOutUser,
  isOwnerEmail, ensureProfileLoaded, getBadgeOverride, setOwnBadgeOverride,
} from './shared/account.js?v=22';
import { mountTopNav } from './shared/topnav.js?v=12';
import { mountThemePicker } from './shared/theme-picker.js?v=3';
import { mountFooter } from './shared/footer.js?v=4';
import { createDropdown } from './shared/dropdown.js?v=1';

mountTopNav();
mountFooter();

onAccountChange(user => {
  const row = document.getElementById('profileRow');
  const title = document.getElementById('profileRowTitle');
  const sub = document.getElementById('profileRowSub');
  const handle = user && handleOf(user.email);
  if (handle) {
    row.href = '/profile?u=' + encodeURIComponent(handle);
    title.textContent = 'View my profile';
    sub.textContent = 'See your posts, stats, and edit your bio and photo.';
  } else if (user) {
    row.href = '#';
    title.textContent = 'Setting up your profile…';
    sub.textContent = 'Just a moment — refresh if this doesn\'t update in a few seconds.';
  } else {
    row.href = '#';
    title.textContent = 'Profile';
    sub.textContent = 'Sign in to edit your display name, bio, and photo.';
  }
  document.getElementById('accountActionsSection').style.display = user ? '' : 'none';
  initBadgeSection(user);
});

// ── Your OFFICIAL badge (owner accounts only) ─────────────────────────
const badgeModeDropdown = createDropdown([
  { value: 'default', label: 'OFFICIAL (default)' },
  { value: 'custom', label: 'Custom label' },
  { value: 'hidden', label: 'Hidden' },
], {
  value: 'default',
  onChange: v => { document.getElementById('badgeLabelSlot').style.display = v === 'custom' ? '' : 'none'; },
});
document.getElementById('badgeModeSlot').appendChild(badgeModeDropdown.el);

let badgeSectionLoadedFor = null;
async function initBadgeSection(user) {
  const section = document.getElementById('badgeSection');
  if (!user || !isOwnerEmail(user.email)) { section.style.display = 'none'; return; }
  section.style.display = '';
  if (badgeSectionLoadedFor === user.email) return;
  badgeSectionLoadedFor = user.email;
  await ensureProfileLoaded(user.email);
  const override = getBadgeOverride(user.email);
  const mode = override === undefined ? 'default' : (!override || override.hidden ? 'hidden' : 'custom');
  badgeModeDropdown.setValue(mode);
  document.getElementById('badgeLabelSlot').style.display = mode === 'custom' ? '' : 'none';
  document.getElementById('badgeLabelInput').value = (override && override.label) || '';
}

document.getElementById('badgeSaveBtn').addEventListener('click', async () => {
  const user = getCurrentUser();
  if (!user) return;
  const mode = badgeModeDropdown.getValue();
  try {
    if (mode === 'default') {
      await setOwnBadgeOverride(undefined);
    } else if (mode === 'hidden') {
      await setOwnBadgeOverride({ hidden: true });
    } else {
      const label = document.getElementById('badgeLabelInput').value.trim();
      if (!label) { alert('Enter a label, or switch to Hidden/Default instead.'); return; }
      await setOwnBadgeOverride({ label });
    }
    alert('Badge updated.');
  } catch (err) {
    alert('Could not update badge: ' + err.message);
  }
});

document.getElementById('switchAccountRow').addEventListener('click', () => {
  signIn().catch(err => alert('Could not switch account: ' + err.message));
});
document.getElementById('signOutRow').addEventListener('click', () => {
  if (confirm('Sign out?')) signOutUser();
});

function updateSubtitle(id) {
  const t = window.OE_THEMES[id];
  document.getElementById('themeSubtitle').textContent = t ? t.name : 'Material Dark';
}

mountThemePicker(document.getElementById('themePicker'), id => updateSubtitle(id));
updateSubtitle(localStorage.getItem(window.OE_THEME_KEY) || 'material-dark');
</script>
</body>
</html>
