<style>

  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500; padding: 10px 18px; border-radius: 100px; text-decoration: none; transition: background-color .2s, transform .15s; white-space: nowrap; }
  .btn .material-symbols-rounded { font-size: 18px; }

  .search-input { width: 100%; background: var(--md-sys-color-surface); border: none; border-radius: 28px; padding: 16px 20px 16px 56px; color: var(--md-sys-color-on-surface); font: inherit; font-size: 16px; }

  .banner { display: flex; align-items: center; gap: 14px; background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-radius: 20px; padding: 14px 18px; margin-bottom: 20px; flex-wrap: wrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 14px; }

  .app-card:hover { background: var(--md-sys-color-hover-surface, var(--md-sys-color-surface-variant)); }

  @keyframes fadeout { to { opacity: 0; } }

  .sheet h3, .sheet .asset, .sheet .mine, .sheet .srcrow { animation: rise .3s both; }
  .sheet .asset:nth-child(2) { animation-delay: .04s; } .sheet .asset:nth-child(3) { animation-delay: .08s; } .sheet .asset:nth-child(n+4) { animation-delay: .12s; }
  @media (prefers-reduced-motion: reduce) { .app-card.new, .rowin, .rowout, .scrim, .sheet, .scrim.closing, .scrim.closing .sheet, .sheet h3, .sheet .asset, .sheet .mine, .sheet .srcrow { animation: none !important; } }
  .app-icon { width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0; background: var(--md-sys-color-surface-variant); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 500; color: var(--md-sys-color-primary); overflow: hidden; }
  .app-icon img { width: 100%; height: 100%; object-fit: cover; }
  .app-main { flex: 1; min-width: 0; }

  .app-main p { font-size: 14px; line-height: 1.45; color: var(--md-sys-color-on-surface-variant); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .plats { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }

  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 2px 8px; border-radius: 8px; }

  .badge.oeper { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
  .badge.community { background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface-variant); }
  .badge.custom { background: transparent; color: var(--md-sys-color-error); box-shadow: inset 0 0 0 1px var(--md-sys-color-error); }
  .badge.pending { background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface-variant); box-shadow: inset 0 0 0 1px var(--md-sys-color-outline); }
  .badge.approved { background: color-mix(in srgb, var(--md-sys-color-success) 22%, transparent); color: var(--md-sys-color-success); }
  .badge.rejected { background: color-mix(in srgb, var(--md-sys-color-error) 18%, transparent); color: var(--md-sys-color-error); }
  .get { align-self: center; }

  .app-card, .sheet, .banner, .search-input, .asset, .toast, .pill, .btn.tonal, .field input, .field textarea, .field select, .warn {
    backdrop-filter: var(--oe-glass-blur, none); -webkit-backdrop-filter: var(--oe-glass-blur, none);
  }
  .empty { text-align: center; padding: 70px 0; color: var(--md-sys-color-on-surface-variant); display: none; }
  .empty .material-symbols-rounded { font-size: 48px; opacity: .5; margin-bottom: 12px; }

  /* dialogs */
  .scrim { position: fixed; inset: 0; background: rgba(var(--md-sys-color-background-rgb, 0, 0, 0), .55); z-index: 200; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); border-radius: 28px 28px 0 0; width: min(720px, 100%); max-height: 92vh; overflow-y: auto; padding: 24px; animation: up .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @media (min-width: 760px) { .scrim { align-items: center; } .sheet { border-radius: 28px; } }
  .sheet h2 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .sheet h3 { font-size: 15px; font-weight: 500; margin: 20px 0 8px; color: var(--md-sys-color-primary); }
  .sheet p, .sheet li { font-size: 14px; line-height: 1.55; color: var(--md-sys-color-on-surface-variant); }
  .sheet .top { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
  .sheet .top .app-icon { width: 72px; height: 72px; font-size: 32px; }
  .sheet .close { margin-left: auto; align-self: flex-start; }
  .desc { white-space: pre-wrap; user-select: text; }
  .shots { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 8px; }
  .shots img { height: 180px; border-radius: 14px; flex-shrink: 0; background: var(--md-sys-color-surface-variant); }
  .warn { display: flex; gap: 10px; align-items: flex-start; background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface); box-shadow: inset 0 0 0 1px var(--md-sys-color-outline); border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.45; margin: 12px 0; }
  .warn .material-symbols-rounded { font-size: 20px; color: var(--md-sys-color-error); }
  .asset { display: flex; align-items: center; gap: 12px; background: var(--md-sys-color-surface-variant); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .asset.rec { outline: 2px solid var(--md-sys-color-primary); }
  .asset .material-symbols-rounded.pi { color: var(--md-sys-color-primary); }
  .asset .meta { flex: 1; min-width: 160px; }
  .asset .meta b { font-weight: 500; font-size: 14px; color: var(--md-sys-color-on-surface); }
  .asset .meta span { display: block; font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 2px; overflow-wrap: anywhere; }
  .asset .acts { display: flex; gap: 6px; align-items: center; }
  .ok { color: var(--md-sys-color-success); }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .note { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin-top: 6px; line-height: 1.5; }
  .note code { background: var(--md-sys-color-surface-variant); padding: 1px 6px; border-radius: 6px; font-size: 12px; }

  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin: 0 0 4px 4px; }
  .field input, .field textarea, .field select { width: 100%; background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface); border: 1px solid var(--md-sys-color-outline); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px; }
  .field textarea { min-height: 90px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--md-sys-color-primary); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .arow { display: grid; grid-template-columns: 110px 120px 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
  .arow .sub { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 100px 1fr; gap: 8px; }
  .arow input, .arow select { width: 100%; background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface); border: 1px solid var(--md-sys-color-outline); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 13px; }
  @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } .arow { grid-template-columns: 1fr 1fr auto; } .arow .url { grid-column: 1 / -1; order: 5; } .arow .sub { grid-template-columns: 1fr 1fr; } }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; } .msg.err { color: var(--md-sys-color-error); } .msg.ok { color: var(--md-sys-color-success); }
  .srcrow, .mine { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--md-sys-color-outline); flex-wrap: wrap; }
  .srcrow:last-child, .mine:last-child { border-bottom: none; }
  .srcrow .grow, .mine .grow { flex: 1; min-width: 160px; font-size: 14px; color: var(--md-sys-color-on-surface); overflow-wrap: anywhere; }
  .srcrow .grow small, .mine .grow small { display: block; color: var(--md-sys-color-on-surface-variant); font-size: 12px; }

  .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--md-sys-color-on-surface); color: var(--md-sys-color-background); box-shadow: 0 4px 16px rgba(0,0,0,.25); border-radius: 16px; padding: 14px 24px; font-size: 14px;  opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 300; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 480px) { .page { padding: 40px 16px 90px; } .app-card { padding: 14px; gap: 12px; } .get { display: none; } }
</style>

<body>

<div class="page">
  <header class="header">
    <div>
      <h1><span class="material-symbols-rounded">storefront</span>epicenter</h1>
      <p>apps from oeper.dev and the community, for Android, Windows, macOS, Linux, iPhone and the web. you can add other sources too.</p>
    </div>
    <div class="head-actions">
      <a class="btn tonal" href="/epicenter/developers"><span class="material-symbols-rounded">code</span>for developers</a>
      <button class="btn tonal" id="sourcesBtn"><span class="material-symbols-rounded">dns</span>sources</button>
      <button class="btn tonal" id="mineBtn"><span class="material-symbols-rounded">inventory_2</span>my apps</button>
      <button class="btn filled" id="submitBtn"><span class="material-symbols-rounded">add</span>submit an app</button>
    </div>
  </header>

  <div id="bannerSlot"></div>

  <div class="toolbar">
    <div class="search-wrap"><span class="material-symbols-rounded">search</span><input class="search-input" type="search" id="q" placeholder="search apps…" autocomplete="off"></div>
    <div class="pills" id="platPills"></div>
    <div class="pills small" id="catPills"></div>
  </div>

  <div class="stats"><span id="count"><strong>0</strong> apps</span><span id="loading"> · loading…</span>
    <span class="sortbox">sort <select id="sort"><option value="updated">recently updated</option><option value="name">name</option></select></span></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"><span class="material-symbols-rounded">search_off</span><p>no apps match.</p></div>
</div>
<div class="toast" id="toast"></div>

<script type="module" data-cfasync="false">
import { mountTopNav } from './shared/topnav.js?v=46';
import { mountFooter } from './shared/footer.js?v=7';
import { getCurrentUser, onAccountChange, signIn, isOwnerEmail } from './shared/account.js?v=43';
import { oeAlert, oeConfirm, oePrompt } from './shared/dialog.js?v=4';
import {
  WORKER, PLATFORMS, PLATFORM, FORMATS, CATEGORIES, CATEGORY, ANDROID_FORMATS, detectPlatform, githubToApp, parseRepo, isHttps,
  normalizeCatalog, platformsOf, assetsFor, fmtSize, matches, resolveManifests,
} from './shared/epicenter-core.js?v=2';
mountTopNav();
mountFooter();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const me = detectPlatform();
const SRC_KEY = 'epicenter-sources';
const readSources = () => { try { const s = JSON.parse(localStorage.getItem(SRC_KEY) || '[]'); return Array.isArray(s) ? s : []; } catch { return []; } };
const writeSources = s => { try { localStorage.setItem(SRC_KEY, JSON.stringify(s)); } catch { /* private window */ } };
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }

const when = a => Number(a.releasedAt || a.updated || (a.date && Date.parse(a.date)) || 0);
function ago(ms) {
  if (!ms) return '';
  const d = Math.floor((Date.now() - ms) / 86400000);
  return d < 1 ? 'today' : d === 1 ? 'yesterday' : d < 30 ? d + ' days ago' : d < 365 ? Math.floor(d / 30) + ' mo ago' : Math.floor(d / 365) + ' y ago';
}
const fresh = a => when(a) && Date.now() - when(a) < 14 * 86400000;
let sortBy = 'updated';
const shownIds = new Set();
let apps = [];
let platFilter = ['android', 'windows', 'macos', 'linux', 'ios'].includes(me) ? 'mine' : 'all';
let catFilter = '';

// ── loading catalogs ──
async function getJson(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }
async function githubSource(repo) {
  const info = await getJson('https://api.github.com/repos/' + repo);
  let rel; try { rel = await getJson('https://api.github.com/repos/' + repo + '/releases/latest'); } catch { rel = { assets: [], tag_name: '', body: '' }; }
  return { epicenter: 1, name: 'GitHub ' + repo, apps: [githubToApp(repo, rel, { ...info, homepage: info.homepage && isHttps(info.homepage) ? info.homepage : '' })] };
}
async function loadAll() {
  const jobs = [
    getJson('./epicenter/index.json').then(j => normalizeCatalog(j, 'oeper', 'oeper.dev')),
    getJson(WORKER + '/api/epicenter/catalog').then(j => normalizeCatalog(j, 'community', 'Epicenter community')),
    ...readSources().map(s => (s.kind === 'github' ? githubSource(s.value) : getJson(s.value)).then(j => normalizeCatalog(j, 'custom', s.name || (j && j.name) || s.value))),
  ];
  const results = await Promise.allSettled(jobs);
  const seen = new Set(), out = [];
  results.forEach((r, i) => {
    if (r.status !== 'fulfilled') { if (i >= 2) toast('Could not load a source you added.'); return; }
    for (const a of r.value) if (!seen.has(a.id)) { seen.add(a.id); out.push(a); }
  });
  apps = out;
  $('loading').textContent = '';
  render();
  openFromHash();
  resolveManifests(apps).then(render);
}

// ── page ──
function platPills() {
  const items = [...(me !== 'web' ? [{ id: 'mine', label: 'for my device', icon: PLATFORM[me] ? PLATFORM[me].icon : 'devices' }] : []), { id: 'all', label: 'all', icon: 'clear_all' }, ...PLATFORMS];
  $('platPills').innerHTML = items.map(p => `<button class="pill${platFilter === p.id ? ' active' : ''}" data-p="${p.id}"><span class="material-symbols-rounded">${p.icon}</span>${esc(p.label)}</button>`).join('');
  $('catPills').innerHTML = [{ id: '', label: 'any category', icon: 'category' }, ...CATEGORIES].map(c => `<button class="pill${catFilter === c.id ? ' active' : ''}" data-c="${c.id}"><span class="material-symbols-rounded">${c.icon}</span>${esc(c.label)}</button>`).join('');
}
function trustBadge(a) {
  return a._trust === 'oeper' ? '<span class="badge oeper"><span class="material-symbols-rounded">verified</span>oeper.dev</span>'

// ── dialogs ──
function modal(html, onMount) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    document.removeEventListener('keydown', onKey);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { scrim.remove(); return; }
    scrim.classList.add('closing'); setTimeout(() => scrim.remove(), 230);
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) close(); });
  scrim.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  document.body.appendChild(scrim);
  if (onMount) onMount(scrim.firstElementChild, close);
  return { close, root: scrim.firstElementChild };
}
const OPEN_FORMATS = ['pwa', 'link', 'store', 'appstore', 'testflight', 'altstore'];
const HASH_HELP = { windows: 'In PowerShell: <code>Get-FileHash file.exe -Algorithm SHA256</code>', macos: 'In Terminal: <code>shasum -a 256 file.dmg</code>', linux: 'In a terminal: <code>sha256sum file</code>', android: 'The Epicenter app checks this for you.', ios: '', web: '' };

  const androidNote = me === 'android' && app.assets.some(a => a.platform === 'android' && ANDROID_FORMATS.includes(a.format))
    ? '<p class="note">On Android, open the downloaded file and allow your browser to install apps when asked. The Epicenter app does this and updates in one tap.</p>' : '';

    <p>${esc(app.summary)}</p>
    ${warn}
    ${app.screenshots && app.screenshots.length ? `<div class="shots">${app.screenshots.map(s => `<img src="${esc(s)}" alt="" loading="lazy" referrerpolicy="no-referrer">`).join('')}</div>` : ''}
    ${app.description ? `<h3>about</h3><p class="desc">${esc(app.description)}</p>` : ''}
    ${app.notes ? `<h3>what's new${app.version ? ' in ' + esc(app.version) : ''}</h3><p class="desc">${esc(app.notes)}</p>` : ''}
    <h3>get it</h3>
    ${[...plats].sort((a, b) => (a === me ? -1 : 0) - (b === me ? -1 : 0)).map(p => assetsFor(app, p).map(a => assetRow(a, app)).join('')).join('')}
    ${androidNote}${otherNote}
    <p class="note">${Object.entries(HASH_HELP).filter(([k, v]) => v && plats.includes(k) && app.assets.some(a => a.platform === k && a.sha256)).map(([k, v]) => PLATFORM[k].label + ': ' + v).join('<br>')}</p>
    <div class="actions">${app.homepage ? `<a class="btn text" href="${esc(app.homepage)}" target="_blank" rel="noopener"><span class="material-symbols-rounded">home</span>website</a>` : ''}${app.source ? `<a class="btn text" href="${esc(app.source)}" target="_blank" rel="noopener"><span class="material-symbols-rounded">code</span>source</a>` : ''}<button class="btn tonal" data-close>close</button></div>`);
  m.root.addEventListener('click', async e => {
    const c = e.target.closest('[data-copy],[data-sha]'); if (!c) return;
    try { await navigator.clipboard.writeText(c.dataset.copy || c.dataset.sha); toast(c.dataset.sha ? 'Checksum copied' : 'Link copied'); } catch { toast('Could not copy'); }
  });

function showSources() {
  let box = null;
  const draw = () => {
    const list = readSources();
    box.querySelector('#srcList').innerHTML = `
      <div class="srcrow"><span class="material-symbols-rounded">verified</span><div class="grow">oeper.dev<small>made by oeper</small></div></div>
      <div class="srcrow"><span class="material-symbols-rounded">how_to_reg</span><div class="grow">Epicenter community<small>submitted by people, approved by oeper.dev</small></div></div>
      ${list.map((s, i) => `<div class="srcrow"><span class="material-symbols-rounded">${s.kind === 'github' ? 'code' : 'dns'}</span><div class="grow">${esc(s.name || s.value)}<small>${esc(s.kind === 'github' ? 'GitHub ' + s.value : s.value)} · unreviewed</small></div><button class="btn danger" data-rm="${i}">remove</button></div>`).join('')}`;
  };
  const m = modal(`
    <div class="top"><div><h2>sources</h2><p>where Epicenter looks for apps.</p></div><button class="btn text close" data-close aria-label="close"><span class="material-symbols-rounded">close</span></button></div>
    <div id="srcList"></div>
    <h3>add a source</h3>
    <label class="field"><span>a GitHub repo (owner/repo or its link) or the link of an Epicenter catalog (https, format in epicenter/README.md)</span><input id="srcIn" placeholder="github:owner/repo  or  https://example.com/catalog.json"></label>
    <div class="warn"><span class="material-symbols-rounded">warning</span><div>Apps from sources you add are not reviewed by oeper.dev. Anyone can publish anything there, so add only sources you trust.</div></div>
    <div class="msg" id="srcMsg"></div>
    <div class="actions"><button class="btn tonal" data-close>done</button><button class="btn filled" id="srcAdd">add</button></div>`, root => { box = root; draw(); });
  m.root.addEventListener('click', e => { const r = e.target.closest('[data-rm]'); if (r) { const l = readSources(); l.splice(+r.dataset.rm, 1); writeSources(l); draw(); loadAll(); } });
  m.root.querySelector('#srcAdd').addEventListener('click', async () => {
    const v = m.root.querySelector('#srcIn').value.trim(), msg = m.root.querySelector('#srcMsg');
    const set = (t, ok) => { msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'err'); };
    let src; const repo = !isHttps(v) && parseRepo(v) || (/^https:\/\/(www\.)?github\.com\//.test(v) ? parseRepo(v) : '');
    if (repo) src = { kind: 'github', value: repo, name: repo };
    else if (isHttps(v)) src = { kind: 'catalog', value: v };
    else return set('Enter owner/repo, a GitHub link, or an https catalog link.', false);
    if (readSources().some(s => s.value.toLowerCase() === src.value.toLowerCase())) return set('That source is already added.', false);
    set('Checking…', true);
    try {
      const j = src.kind === 'github' ? await githubSource(src.value) : await getJson(src.value);
      const found = normalizeCatalog(j, 'custom', '').length;
      if (!found) return set(src.kind === 'github' ? 'That repo has no release files Epicenter can use.' : 'That catalog has no usable apps.', false);
      src.name = (j && j.name) || src.value;
      writeSources([...readSources(), src]); draw(); loadAll(); m.root.querySelector('#srcIn').value = ''; set(`Added: ${found} app${found === 1 ? '' : 's'}.`, true);
    } catch (err) { set(src.kind === 'catalog' ? 'Could not read that catalog. It must be https, return the Epicenter format and allow requests from oeper.dev (CORS).' : 'Could not read that repo.', false); }
  });
}

// account helpers
async function authed(path, method, body) {
  let u = getCurrentUser();
  if (!u) { try { await signIn(); } catch { /* cancelled */ } u = getCurrentUser(); }
  if (!u) throw new Error('Sign in first.');
  const r = await fetch(WORKER + path, { method, headers: { Authorization: 'Bearer ' + await u.getIdToken(), ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong (' + r.status + ').');
  return j;
}

    };

  });
}

    <button class="btn text" data-newkey><span class="material-symbols-rounded">key</span>make a publish key</button>
    <p class="note">New releases are picked up on their own every 6 hours when a download has a <code>manifest</code> (an update.json next to it). Check now to skip the wait.</p>
    <div class="actions"><button class="btn text" data-refresh><span class="material-symbols-rounded">refresh</span>check for new versions</button><button class="btn tonal" data-close>close</button></div>`;
  m.root.addEventListener('click', async ev => {
    if (ev.target.closest('[data-close]')) return m.close();
    const b = ev.target.closest('[data-edit],[data-del],[data-ok],[data-no],[data-refresh],[data-newkey],[data-revoke]'); if (!b) return;
    try {
      if (b.hasAttribute('data-newkey')) {
        const label = await oePrompt('What is this key for? (a name to recognise it by)', { maxLength: 40, placeholder: 'my other session' }); if (label === null) return;
        const r = await authed('/api/epicenter/keys', 'POST', { label }); m.close(); showNewKey(r.key); return;
      }
      if (b.dataset.revoke) { if (await oeConfirm('Revoke this key? Anything using it stops working.', { danger: true, okLabel: 'revoke' })) { await authed('/api/epicenter/keys/revoke', 'POST', { id: b.dataset.revoke }); m.close(); toast('Revoked.'); showMine(); } return; }
      if (b.hasAttribute('data-refresh')) { const r = await authed('/api/epicenter/refresh', 'POST', {}); m.close(); toast(r.changed ? r.changed + ' updated.' : r.checked ? 'Everything is up to date.' : 'No download has a manifest to check.'); if (r.changed) loadAll(); }
      else if (b.dataset.edit) { const x = mine.find(y => y.id === b.dataset.edit); m.close(); showSubmit(x.app); }
      else if (b.dataset.del) { if (await oeConfirm('Remove this app from Epicenter?', { danger: true, okLabel: 'remove' })) { await authed('/api/epicenter/remove', 'POST', { id: b.dataset.del }); m.close(); toast('Removed.'); loadAll(); } }
      else if (b.dataset.ok) { await authed('/api/epicenter/review', 'POST', { id: b.dataset.ok, action: 'approve' }); m.close(); toast('Approved.'); loadAll(); }
      else if (b.dataset.no) { const note = await oePrompt('Reason (shown to the submitter):', { maxLength: 300 }); if (note === null) return; await authed('/api/epicenter/review', 'POST', { id: b.dataset.no, action: 'reject', note }); m.close(); toast('Rejected.'); }
    } catch (err) { toast(err.message); }
  });
}

// a new publish key is shown once: the server keeps only a hash
function showNewKey(key) {
  const m = modal(`
    <div class="top"><div><h2>your publish key</h2><p>copy it now. it is not shown again.</p></div></div>
    <label class="field"><span>key</span><input id="nk" readonly class="mono" value="${esc(key)}"></label>
    <h3>use it</h3>
    <p class="note">Add or update an app (only the fields you send change for an app you already have):</p>
    <p class="note"><code>curl -X PUT https://oeper-ai.oeper.workers.dev/api/epicenter/publish -H "Authorization: Bearer YOUR_KEY" -H "Content-Type: application/json" -d '{"app":{"id":"com.example.app","version":"1.2","versionCode":12,"notes":"what is new"}}'</code></p>
    <div class="actions"><button class="btn tonal" id="nkc"><span class="material-symbols-rounded">content_copy</span>copy</button><button class="btn filled" data-close>done</button></div>`);
  m.root.querySelector('#nk').select();
  m.root.querySelector('#nkc').addEventListener('click', async () => { try { await navigator.clipboard.writeText(key); toast('Key copied'); } catch { toast('Could not copy: select it and copy by hand'); } });
}

$('sourcesBtn').addEventListener('click', showSources);
$('submitBtn').addEventListener('click', async () => { if (!getCurrentUser()) { try { await signIn(); } catch {} } if (getCurrentUser()) showSubmit(); else toast('Sign in to submit an app.'); });
$('mineBtn').addEventListener('click', async () => { if (!getCurrentUser()) { try { await signIn(); } catch {} } if (getCurrentUser()) showMine(); else toast('Sign in to see your apps.'); });
// epicenter.html#app=<id> opens that app (this is what an app's "update available" button links to)
function openFromHash() {
  const m = /^#app=(.+)$/.exec(location.hash); if (!m || openFromHash.done) return;
  const app = apps.find(a => a.id.toLowerCase() === decodeURIComponent(m[1]).toLowerCase());
  if (app) { openFromHash.done = true; showApp(app); }
}
if (location.hash === '#submit') $('submitBtn').click();
loadAll();
</script>
