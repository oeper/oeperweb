<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Activity — oeper.dev</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://oeper.dev/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="https://oeper.dev/icon.ico?v=3" type="image/x-icon">
<script src="./shared/theme-boot.js?v=10"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Freehand&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :focus { outline: none; }
  :focus-visible { outline: none; box-shadow: 0 0 0 2px var(--md-sys-color-primary, #a8c7fa); }

  :root {
    --md-sys-color-background: #111318;
    --md-sys-color-surface: #1a1c22;
    --md-sys-color-surface-variant: #2f353d;
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-on-primary: #062e6f;
    --md-sys-color-secondary-container: #33485d;
    --md-sys-color-on-secondary-container: #d2e4ff;
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c7c5;
    --md-sys-color-outline: #43474e;
    --md-sys-color-outline-variant: #8c9199;
    --md-sys-color-error: #ffb4ab;
  }

  body {
    min-height: 100vh;
    background-color: var(--md-sys-color-background);
    font-family: var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif);
    background-image: var(--oe-bg-image, none);
    color: var(--md-sys-color-on-surface);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page { position: relative; max-width: 720px; margin: 0 auto; padding: 56px 24px 100px; }

  .header { margin-bottom: 28px; }
  .header h1 { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 400; margin-bottom: 8px; }
  .header p { color: var(--md-sys-color-on-surface-variant); font-size: 14px; line-height: 1.5; }

  .signin-note { background: var(--md-sys-color-surface); border-radius: 20px; padding: 40px 24px; text-align: center; color: var(--md-sys-color-on-surface-variant); }
  .signin-note .material-symbols-rounded { font-size: 40px; opacity: 0.6; margin-bottom: 12px; display: block; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat-card { background: var(--md-sys-color-surface); border-radius: 16px; padding: 16px; text-align: center; }
  .stat-value { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 24px; font-weight: 500; color: var(--md-sys-color-primary); }
  .stat-label { font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 4px; }

  .section-heading { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: 16px; font-weight: 500; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-heading .material-symbols-rounded { font-size: 20px; color: var(--md-sys-color-primary); }

  .highlight-card {
    background: linear-gradient(135deg, var(--md-sys-color-secondary-container), var(--md-sys-color-surface) 70%);
    border-radius: 20px; padding: 20px; margin-bottom: 32px; text-decoration: none; color: inherit; display: block;
  }
  .highlight-card:hover { filter: brightness(1.06); }
  .highlight-score { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--md-sys-color-on-secondary-container); margin-bottom: 10px; }
  .highlight-score .material-symbols-rounded { font-size: 16px; }
  .highlight-body { font-size: 15px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; }
  .highlight-meta { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

  .activity-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .activity-tab {
    display: inline-flex; align-items: center; gap: 6px; background: var(--md-sys-color-surface-variant); border: none;
    border-radius: 100px; padding: 8px 16px; font-family: inherit; font-size: 14px; font-weight: 500;
    color: var(--md-sys-color-on-surface-variant); cursor: pointer;
  }
  .activity-tab .material-symbols-rounded { font-size: 18px; }
  .activity-tab:hover { background: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }
  .activity-tab.active { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }

  .activity-list { display: flex; flex-direction: column; gap: 10px; }
  .activity-row {
    display: flex; gap: 12px; align-items: flex-start; background: var(--md-sys-color-surface);
    border-radius: 16px; padding: 14px 18px; text-decoration: none; color: inherit; cursor: pointer;
  }
  .activity-row:hover { background: var(--md-sys-color-hover-surface); }
  .activity-row-icon {
    width: 36px; height: 36px; border-radius: 50%; background: var(--md-sys-color-surface-variant); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: var(--md-sys-color-on-surface-variant); overflow: hidden;
  }
  .activity-row-icon img { width: 100%; height: 100%; object-fit: cover; }
  .activity-row-main { flex: 1; min-width: 0; }
  .activity-row-text { font-size: 14px; line-height: 1.4; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .activity-row-meta { font-size: 12px; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .activity-row-meta span { display: inline-flex; align-items: center; gap: 3px; }
  .activity-row-meta .material-symbols-rounded { font-size: 14px; }

  .empty-note { color: var(--md-sys-color-on-surface-variant); font-size: 14px; padding: 40px 0; text-align: center; }
  .loading-note { color: var(--md-sys-color-on-surface-variant); font-size: 14px; padding: 60px 0; text-align: center; }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <h1>Your Activity</h1>
    <p>Everything you've posted, commented on, liked, and saved — in one place.</p>
  </div>
  <div id="content"><div class="loading-note">Loading…</div></div>
</div>

<script type="module">
import { onAccountChange, db } from './shared/account.js?v=26';
import { mountTopNav } from './shared/topnav.js?v=19';
import { mountFooter } from './shared/footer.js?v=4';
import {
  collection, collectionGroup, query, where, getDocs,
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

mountTopNav();
mountFooter();

function escHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function timeAgo(date) {
  const s = Math.floor((Date.now() - date.getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 2592000) return Math.floor(s / 86400) + 'd ago';
  return date.toLocaleDateString();
}
function score(item) { return (item.upvoters || []).length - (item.downvoters || []).length; }

// A collectionGroup('comments') query spans both posts/{id}/comments and
// videos/{id}/comments (Firestore matches by subcollection name regardless
// of parent) — walk the doc's own ref to recover which one a given comment
// actually belongs to, so its link/preview can point at the right place.
function commentParent(docSnap) {
  const parentDocRef = docSnap.ref.parent.parent;
  return { kind: parentDocRef.parent.id === 'videos' ? 'video' : 'post', id: parentDocRef.id };
}
function itemHref(kind, id) {
  return kind === 'video' ? `/videos?video=${id}` : `/feed?post=${id}`;
}
function commentHref(kind, id, commentId) {
  return kind === 'video' ? `/videos?video=${id}` : `/feed?post=${id}&comment=${commentId}`;
}

const content = document.getElementById('content');
let activeTab = 'comments';
let data = null; // populated by loadActivity()

async function loadActivity(user) {
  const email = user.email;
  const uid = user.uid;
  const [
    postsSnap, videosSnap, commentsSnap,
    likedPostsSnap, likedVideosSnap, likedCommentsSnap,
    savedPostsSnap, savedVideosSnap,
  ] = await Promise.all([
    getDocs(query(collection(db, 'posts'), where('authorEmail', '==', email))),
    getDocs(query(collection(db, 'videos'), where('authorEmail', '==', email))),
    getDocs(query(collectionGroup(db, 'comments'), where('authorEmail', '==', email))),
    getDocs(query(collection(db, 'posts'), where('upvoters', 'array-contains', uid))),
    getDocs(query(collection(db, 'videos'), where('upvoters', 'array-contains', uid))),
    getDocs(query(collectionGroup(db, 'comments'), where('upvoters', 'array-contains', uid))),
    getDocs(query(collection(db, 'posts'), where('savedBy', 'array-contains', uid))),
    getDocs(query(collection(db, 'videos'), where('savedBy', 'array-contains', uid))),
  ]);

  const toItem = kind => d => { const data = d.data(); return { _kind: kind, id: d.id, ...data, _date: data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : new Date() }; };
  const authoredPosts = postsSnap.docs.map(toItem('post'));
  const authoredVideos = videosSnap.docs.map(toItem('video'));
  const comments = commentsSnap.docs.map(d => {
    const c = d.data();
    const parent = commentParent(d);
    return {
      id: d.id, ...c, parentKind: parent.kind, parentId: parent.id,
      _date: c.createdAt && c.createdAt.toDate ? c.createdAt.toDate() : new Date(), _score: score(c),
    };
  }).sort((a, b) => b._score - a._score || b._date - a._date);
  const likedPosts = likedPostsSnap.docs.map(toItem('post'));
  const likedVideos = likedVideosSnap.docs.map(toItem('video'));
  const savedItems = [...savedPostsSnap.docs.map(toItem('post')), ...savedVideosSnap.docs.map(toItem('video'))]
    .sort((a, b) => b._date - a._date);
  const likedItems = [...likedPosts, ...likedVideos].sort((a, b) => b._date - a._date);

  const karma = [...authoredPosts, ...authoredVideos].reduce((sum, p) => sum + score(p), 0)
    + comments.reduce((sum, c) => sum + c._score, 0);

  data = {
    postCount: authoredPosts.length + authoredVideos.length,
    comments,
    likedItems,
    likesGiven: likedItems.length + likedCommentsSnap.docs.length,
    likesReceived: karma,
    savedItems,
  };
}

function statsHtml() {
  return `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${data.postCount}</div><div class="stat-label">Posts</div></div>
      <div class="stat-card"><div class="stat-value">${data.comments.length}</div><div class="stat-label">Comments</div></div>
      <div class="stat-card"><div class="stat-value">${data.likesReceived}</div><div class="stat-label">Likes received</div></div>
      <div class="stat-card"><div class="stat-value">${data.likesGiven}</div><div class="stat-label">Likes given</div></div>
      <div class="stat-card"><div class="stat-value">${data.savedItems.length}</div><div class="stat-label">Saved</div></div>
    </div>
  `;
}

function mostLikedCommentHtml() {
  const top = data.comments[0];
  if (!top || top._score <= 0) return '';
  return `
    <a class="highlight-card" href="${commentHref(top.parentKind, top.parentId, top.id)}">
      <div class="highlight-score"><span class="material-symbols-rounded">favorite</span>Your most liked comment · ${top._score} like${top._score === 1 ? '' : 's'}</div>
      <div class="highlight-body">${escHtml(top.body || '').slice(0, 240)}</div>
      <div class="highlight-meta">${timeAgo(top._date)} · on a ${top.parentKind}</div>
    </a>
  `;
}

function commentRowHtml(c) {
  const sc = c._score;
  return `
    <a class="activity-row" href="${commentHref(c.parentKind, c.parentId, c.id)}">
      <div class="activity-row-icon"><span class="material-symbols-rounded">chat_bubble</span></div>
      <div class="activity-row-main">
        <div class="activity-row-text">${escHtml(c.body || '')}</div>
        <div class="activity-row-meta">
          <span><span class="material-symbols-rounded">favorite</span>${sc}</span>
          <span>${timeAgo(c._date)}</span>
          <span>on a ${c.parentKind}</span>
        </div>
      </div>
    </a>
  `;
}

function itemRowHtml(item) {
  const isVideo = item._kind === 'video';
  return `
    <a class="activity-row" href="${itemHref(item._kind, item.id)}">
      <div class="activity-row-icon"><span class="material-symbols-rounded">${isVideo ? 'movie' : 'article'}</span></div>
      <div class="activity-row-main">
        <div class="activity-row-text">${escHtml(item.title || (isVideo ? 'Untitled video' : 'Untitled post'))}</div>
        <div class="activity-row-meta">
          <span><span class="material-symbols-rounded">favorite</span>${score(item)}</span>
          <span>${timeAgo(item._date)}</span>
        </div>
      </div>
    </a>
  `;
}

function render() {
  if (!data) return;
  const tabs = [
    { id: 'comments', label: 'Comments', icon: 'chat_bubble' },
    { id: 'liked', label: 'Liked', icon: 'favorite' },
    { id: 'saved', label: 'Saved', icon: 'bookmark' },
  ];
  const listHtml = activeTab === 'comments'
    ? (data.comments.length ? data.comments.map(commentRowHtml).join('') : '<div class="empty-note">No comments yet.</div>')
    : activeTab === 'liked'
    ? (data.likedItems.length ? data.likedItems.map(itemRowHtml).join('') : '<div class="empty-note">You haven\'t liked anything yet.</div>')
    : (data.savedItems.length ? data.savedItems.map(itemRowHtml).join('') : '<div class="empty-note">Nothing saved yet — tap the bookmark icon on a post or video to save it here.</div>');

  content.innerHTML = `
    ${statsHtml()}
    ${mostLikedCommentHtml()}
    <div class="activity-tabs">
      ${tabs.map(t => `<button type="button" class="activity-tab ${activeTab === t.id ? 'active' : ''}" data-tab="${t.id}"><span class="material-symbols-rounded">${t.icon}</span>${t.label}</button>`).join('')}
    </div>
    <div class="activity-list">${listHtml}</div>
  `;
  content.querySelectorAll('[data-tab]').forEach(el => {
    el.addEventListener('click', () => { activeTab = el.dataset.tab; render(); });
  });
}

async function init(user) {
  if (!user) {
    content.innerHTML = `
      <div class="signin-note">
        <span class="material-symbols-rounded">insights</span>
        Sign in to see your activity.
      </div>
    `;
    return;
  }
  content.innerHTML = '<div class="loading-note">Loading your activity…</div>';
  try {
    await loadActivity(user);
    render();
  } catch (err) {
    content.innerHTML = `<div class="empty-note">Could not load activity: ${escHtml(err.message)}</div>`;
  }
}

let initialized = false;
onAccountChange(user => {
  // Firebase can re-fire the same signed-in user on tab focus etc. — only
  // reload from scratch the first time, or when the signed-in state
  // actually flips (sign in/out), not on every redundant callback.
  if (initialized && user && data) return;
  initialized = true;
  init(user);
});
</script>
</body>
</html>
