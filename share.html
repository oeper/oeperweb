<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared conversation — epic AI</title>
<meta name="description" content="A conversation someone shared from epic AI on oeper.dev.">
<meta property="og:title" content="A conversation with epic AI">
<meta property="og:description" content="Someone shared a conversation they had with epic AI.">
<meta property="og:image" content="https://oeper.dev/icon.png">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="icon" href="https://oeper.dev/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="https://oeper.dev/icon.ico?v=3" type="image/x-icon">
<script src="./shared/theme-boot.js?v=16" data-cfasync="false"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared/fonts.css?v=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--md-sys-color-primary, #a8c7fa); outline-offset: 2px; }

  :root {
    --md-sys-color-background: #111318;
    --md-sys-color-surface: #1a1c22;
    --md-sys-color-surface-variant: #2f353d;
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-on-primary: #062e6f;
    --md-sys-color-secondary-container: #33485d;
    --md-sys-color-on-secondary-container: #d2e4ff;
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c7c5;
    --md-sys-color-outline: #43474e;
    --md-sys-color-outline-variant: #8c9199;
    --md-sys-color-error: #ffb4ab;
    --md-sys-state-hover: rgba(255,255,255,0.08);
  }

  body {
    min-height: 100vh; background-color: var(--md-sys-color-background);
    font-family: var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif);
    background-image: var(--oe-bg-image, none); color: var(--md-sys-color-on-surface);
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  .page { position: relative; max-width: 760px; margin: 0 auto; padding: 56px 24px 120px; }
  .head { margin-bottom: 26px; }
  .head .tag { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin-bottom: 10px; }
  .head .tag svg { width: 16px; height: 16px; }
  .head h1 { font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif); font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 400; letter-spacing: -0.4px; line-height: 1.25; word-break: break-word; }
  .head .meta { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin-top: 8px; }

  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 100px; border: none; cursor: pointer;
    font: 500 14px var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif); text-decoration: none;
    background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
  }
  .btn.main { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
  .btn:hover { filter: brightness(1.1); }
  .btn .material-symbols-rounded { font-size: 18px; }

  .msg { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
  .msg-avatar svg { width: 16px; height: 16px; }
  .msg-col { display: flex; flex-direction: column; max-width: 82%; min-width: 0; }
  .msg.user .msg-col { align-items: flex-end; }
  .msg-bubble { padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; background: var(--md-sys-color-surface); max-width: 100%; }
  .msg.user .msg-bubble { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border-bottom-right-radius: 4px; }
  .msg.assistant .msg-bubble { border-bottom-left-radius: 4px; }

  .msg-bubble .answer-content { white-space: normal; }
  .msg-bubble a { color: inherit; text-decoration: underline; }
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3, .msg-bubble h4, .msg-bubble h5, .msg-bubble h6 { font-weight: 600; margin: 10px 0 4px; line-height: 1.3; }
  .msg-bubble h1:first-child, .msg-bubble h2:first-child, .msg-bubble h3:first-child, .msg-bubble h4:first-child, .msg-bubble h5:first-child, .msg-bubble h6:first-child { margin-top: 0; }
  .msg-bubble h1 { font-size: 1.3em; } .msg-bubble h2 { font-size: 1.2em; } .msg-bubble h3 { font-size: 1.1em; }
  .msg-bubble h4, .msg-bubble h5, .msg-bubble h6 { font-size: 1em; }
  .msg-bubble p { margin: 4px 0; }
  .msg-bubble p:first-child { margin-top: 0; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble ul, .msg-bubble ol { margin: 4px 0; padding-left: 22px; }
  .msg-bubble ul ul, .msg-bubble ul ol, .msg-bubble ol ul, .msg-bubble ol ol { margin: 2px 0; }
  .msg-bubble li { margin-bottom: 3px; }
  .msg-bubble .md-task-checkbox { margin: 0 4px 0 -18px; vertical-align: middle; }
  .msg-bubble hr { border: none; border-top: 1px solid rgba(127,127,127,0.35); margin: 10px 0; }
  .msg-bubble blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--md-sys-color-primary); opacity: 0.85; color: inherit; }
  .msg-bubble blockquote p { margin: 4px 0; }
  .msg-bubble del { opacity: 0.65; }
  .ai-diagram { margin: 10px 0; padding: 10px; border-radius: 14px; background: rgba(127,127,127,.10); overflow-x: auto; }
  .ai-diagram .ai-diagram-wait, .ai-diagram .ai-diagram-fail { font-size: 13px; opacity: .7; }
  .ai-diagram svg { max-width: 100%; height: auto; } .ai-diagram .ai-diagram-img { width: 100%; max-width: 640px; display: block; margin: 0 auto; }
  .ai-diagram .ai-diagram-src { white-space: pre-wrap; font-size: 12px; opacity: .7; margin: 6px 0 0; }
  .msg-bubble .md-img { max-width: 100%; border-radius: 10px; margin: 6px 0; display: block; }
  .msg-bubble code { background: rgba(127,127,127,0.2); border-radius: 4px; padding: 1px 5px; font-size: 0.9em; }
  .msg-bubble .math-block { margin: 8px 0; overflow-x: auto; overflow-y: hidden; }
  .msg-bubble .math-inline { overflow-x: auto; overflow-y: hidden; display: inline-block; max-width: 100%; vertical-align: middle; }
  .msg-bubble .katex { color: inherit; font-size: 1.05em; }
  .msg-bubble .katex-display { margin: 0; }
  .msg-bubble a.md-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 100px; background: rgba(127,127,127,0.2); color: inherit; text-decoration: none; margin: 4px 6px 4px 0; vertical-align: middle; }
  .msg-bubble a.md-btn:hover { background: rgba(127,127,127,0.32); }
  .msg-bubble a.md-btn .material-symbols-rounded { font-size: 14px; }
  .msg-bubble .md-table { border-collapse: collapse; margin: 8px 0; font-size: 0.9em; max-width: 100%; display: block; overflow-x: auto; }
  .msg-bubble .md-table th, .msg-bubble .md-table td { border: 1px solid rgba(127,127,127,0.35); padding: 5px 9px; text-align: left; }
  .msg-bubble .md-table th { background: rgba(127,127,127,0.15); font-weight: 600; }

  .pic { margin-top: 10px; position: relative; display: inline-block; max-width: min(100%, 520px); }
  .pic img { display: block; max-width: 100%; height: auto; border-radius: 18px; background: var(--md-sys-color-surface-variant); cursor: zoom-in; }
  .pic-lightbox { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,0.88); display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
  .pic-lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; }

  .state { text-align: center; color: var(--md-sys-color-on-surface-variant); padding: 70px 10px; line-height: 1.6; }
  .state .material-symbols-rounded { font-size: 44px; color: var(--md-sys-color-primary); margin-bottom: 10px; display: block; }
  .foot { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--md-sys-color-outline); font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); line-height: 1.6; display: flex; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
  .foot a, .foot button { color: var(--md-sys-color-primary); background: none; border: none; font: inherit; cursor: pointer; text-decoration: underline; padding: 0; }

  .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); padding: 12px 22px; border-radius: 100px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 9999; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 600px) { .page { padding: 36px 16px 120px; } .msg-col { max-width: 88%; } .toast { bottom: calc(64px + env(safe-area-inset-bottom, 0px) + 32px); } }
</style>
</head>
<body>

<div class="page">
  <div id="content"><div class="state"><span class="material-symbols-rounded">hourglass_top</span>opening the conversation…</div></div>
</div>
<div class="toast" id="toast"></div>

<script type="module" data-cfasync="false">
import { mountTopNav } from './shared/topnav.js?v=48';
import { mountFooter } from './shared/footer.js?v=7';
import { call, fmtDate } from './shared/codes-api.js?v=2';
import { oeConfirm } from './shared/dialog.js?v=4';
import { copyToClipboard, injectCodeBlockStyles } from './shared/code-block.js?v=3';
import { escHtml, parseAiMarkdown, splitThinking } from './shared/ai-markdown.js?v=2';
import { hydrateDiagrams } from './shared/ai-diagrams.js?v=1';

mountTopNav();
mountFooter();
injectCodeBlockStyles();

const EPIC_MARK_SVG = '<svg viewBox="0 0 381 486" aria-hidden="true"><g fill="currentColor"><rect x="2" width="80" height="300" rx="40"/><rect x="297" width="80" height="300" rx="40"/></g><path d="M40 421C140 454.333 240 454.333 340 421" fill="none" stroke="currentColor" stroke-width="80" stroke-linecap="round"/></svg>';
const $content = document.getElementById('content');
const id = (new URLSearchParams(location.search).get('c') || '').trim();
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800); }
function problem(icon, text) { $content.innerHTML = '<div class="state"><span class="material-symbols-rounded">' + icon + '</span>' + escHtml(text) + '<div class="btnrow" style="justify-content:center"><a class="btn main" href="/ai"><span class="material-symbols-rounded">chat</span>Open epic AI</a></div></div>'; }

let shared = null;

function renderPics(images) {
  return (images || []).map((p, i) => '<div class="pic"><img data-pic="' + i + '" alt="' + escHtml(p.prompt || 'a picture epic AI drew') + '"></div>').join('');
}

function render() {
  document.title = shared.title + ' — epic AI';
  const when = shared.updated && shared.updated > shared.created + 60000 ? 'updated ' + fmtDate(shared.updated) : 'shared ' + fmtDate(shared.created);
  $content.innerHTML = `
    <div class="head">
      <div class="tag">${EPIC_MARK_SVG.replace('<svg ', '<svg style="width:16px;height:16px" ')} Shared conversation with epic AI</div>
      <h1>${escHtml(shared.title)}</h1>
      <div class="meta">${escHtml(when)} · ${shared.messages.length} message${shared.messages.length === 1 ? '' : 's'}</div>
      <div class="btnrow">
        <button class="btn main" id="cont" type="button"><span class="material-symbols-rounded">forum</span>Continue this chat</button>
        <button class="btn" id="copy" type="button"><span class="material-symbols-rounded">link</span>Copy link</button>
      </div>
    </div>
    <div id="msgs"></div>
    <div class="foot"><span>Shared by someone using epic AI. epic AI can make mistakes, so double-check anything important. The person who shared it can stop sharing at any time.</span><button type="button" id="report">Report this</button></div>`;
  const box = document.getElementById('msgs');
  shared.messages.forEach((m, mi) => {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
    wrap.innerHTML = (m.role === 'user' ? '' : '<div class="msg-avatar">' + EPIC_MARK_SVG + '</div>') + '<div class="msg-col"><div class="msg-bubble"></div>' + renderPics(m.images) + '</div>';
    const bubble = wrap.querySelector('.msg-bubble');
    if (m.role === 'user') bubble.textContent = m.text;
    else if (m.text) { const a = document.createElement('div'); a.className = 'answer-content'; a.innerHTML = parseAiMarkdown(splitThinking('', m.text, true).answer); bubble.append(a); hydrateDiagrams(a); }
    else bubble.remove();
    wrap.querySelectorAll('img[data-pic]').forEach(img => { const p = m.images[+img.dataset.pic]; img.src = 'data:' + p.mime + ';base64,' + p.data; });
    box.append(wrap);
  });
  box.addEventListener('click', e => {
    const copyBtn = e.target.closest('[data-copy-code]');
    if (copyBtn) {
      const code = copyBtn.closest('.code-block-wrap').querySelector('code').textContent, original = copyBtn.innerHTML;
      copyToClipboard(code).then(ok => { copyBtn.innerHTML = ok ? '<span class="material-symbols-rounded">check</span>copied' : '<span class="material-symbols-rounded">error</span>couldn\'t copy'; setTimeout(() => { copyBtn.innerHTML = original; }, 1500); });
      return;
    }
    const img = e.target.closest('.pic img');
    if (img) { const lb = document.createElement('div'); lb.className = 'pic-lightbox'; lb.innerHTML = '<img alt="">'; lb.querySelector('img').src = img.src; lb.addEventListener('click', () => lb.remove()); document.body.append(lb); }
  });
  document.getElementById('copy').onclick = async () => { toast(await copyToClipboard(location.href) ? 'Link copied.' : 'Couldn\'t copy. Copy it from the address bar.'); };
  document.getElementById('cont').onclick = continueChat;
  document.getElementById('report').onclick = async () => {
    if (!await oeConfirm('Report this shared conversation to the oeper.dev team?')) return;
    try { await call('POST', '/api/feedback', { kind: 'legal', message: 'Reported shared conversation ' + id + ' (' + shared.title + ')', page: location.href, app: 'site' }); toast('Thanks, we will take a look.'); }
    catch (e) { toast(e.message); }
  };
}

// "Continue this chat": copies the conversation into this browser's epic AI chats (same storage ai.html reads) and opens it, so it carries on from where it ended.
async function continueChat() {
  try {
    const chats = JSON.parse(localStorage.getItem('oe-ai-chats') || '[]');
    const cid = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const pics = [];
    const messages = shared.messages.map((m, mi) => {
      const o = { role: m.role === 'user' ? 'user' : 'assistant', content: m.text || '' };
      if (m.images && m.images.length) o.images = m.images.map((p, i) => { const pid = 'p' + cid + '-' + mi + '-' + i; pics.push({ id: pid, mime: p.mime, data: p.data, w: p.w, h: p.h, prompt: p.prompt, at: Date.now() }); return { id: pid, w: p.w, h: p.h, prompt: p.prompt }; });
      return o;
    });
    if (pics.length) await new Promise(res => {
      const r = indexedDB.open('epic-pictures', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('p', { keyPath: 'id' });
      r.onerror = () => res();
      r.onsuccess = () => { const t = r.result.transaction('p', 'readwrite'); pics.forEach(p => t.objectStore('p').put(p)); t.oncomplete = t.onerror = t.onabort = () => res(); };
    });
    chats.unshift({ id: cid, title: shared.title.slice(0, 60), messages, updatedAt: Date.now() });
    localStorage.setItem('oe-ai-chats', JSON.stringify(chats));
    localStorage.setItem('oe-ai-current-chat', cid);
    location.href = '/ai';
  } catch (e) { toast('Couldn\'t copy it into your chats.'); }
}

(async () => {
  if (!/^[A-Za-z0-9_-]{6,24}$/.test(id)) return problem('link_off', 'This link is not a shared conversation.');
  try { shared = await call('GET', '/api/share/' + id); }
  catch (e) { return problem(e.status === 404 ? 'link_off' : 'cloud_off', e.message); }
  render();
})();
</script>
</body>
</html>
