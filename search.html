<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — oeper.dev</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://oeper.dev/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="https://oeper.dev/icon.ico?v=3" type="image/x-icon">
<script src="./shared/theme-boot.js?v=16" data-cfasync="false"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Freehand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared/fonts.css?v=1">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--md-sys-color-primary, #a8c7fa); outline-offset: 2px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline-offset: 0; }

  :root {
    --md-sys-color-background: #111318;
    --md-sys-color-surface: #1a1c22;
    --md-sys-color-surface-variant: #2f353d;
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-on-primary: #062e6f;
    --md-sys-color-secondary-container: #33485d;
    --md-sys-color-on-secondary-container: #d2e4ff;
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c7c5;
    --md-sys-color-outline: #43474e;
    --md-sys-color-outline-variant: #8c9199;
    --md-sys-color-error: #ffb4ab;
    --oe-search-url-color: #8bc9a0;
  }

  body {
    min-height: 100vh;
    background-color: var(--md-sys-color-background);
    font-family: var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif);
    background-image: var(--oe-bg-image, none);
    color: var(--md-sys-color-on-surface);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page { position: relative; max-width: 760px; margin: 0 auto; padding: 40px 24px 100px; }

  .search-header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .search-logo { display: flex; align-items: center; flex-shrink: 0; color: var(--md-sys-color-primary); }
  .search-logo svg { width: 28px; height: 28px; }
  .search-bar-wrap { position: relative; flex: 1; }
  .search-bar-wrap .material-symbols-rounded {
    position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    color: var(--md-sys-color-on-surface-variant); font-size: 20px; pointer-events: none;
  }
  .search-bar-input {
    width: 100%; background: var(--md-sys-color-surface); border: none; border-radius: 100px;
    padding: 13px 18px 13px 50px; color: var(--md-sys-color-on-surface); font-family: inherit; font-size: 15px; outline: none;
  }
  .search-bar-input:focus { box-shadow: 0 0 0 2px var(--md-sys-color-primary); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 18px; }
  .chip { font: inherit; font-size: 13px; font-weight: 500; border: 1px solid var(--md-sys-color-outline); background: transparent; color: var(--md-sys-color-on-surface-variant); border-radius: 999px; padding: 6px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .chip:hover { background: var(--md-sys-color-hover-surface, rgba(255,255,255,.06)); }
  .chip.on { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-color: transparent; }
  .chip small { opacity: .7; font-weight: 400; }
  .meta { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin: 0 4px 6px; }
  .note { margin: 0 4px 14px; font-size: 14px; color: var(--md-sys-color-on-surface-variant); }
  .note a, .empty-note a { color: var(--md-sys-color-primary); cursor: pointer; font-weight: 500; text-decoration: none; }
  .result-row { display: flex; gap: 14px; padding: 14px 10px; border-radius: 14px; text-decoration: none; color: inherit; }
  a.result-row:hover, a.result-row:focus-visible { background: var(--md-sys-color-hover-surface, rgba(255,255,255,.06)); }
  .result-icon { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; overflow: hidden; background: var(--md-sys-color-surface-variant); }
  .result-icon img { width: 100%; height: 100%; object-fit: cover; }
  .result-icon .material-symbols-rounded { font-size: 20px; color: var(--md-sys-color-on-surface-variant); }
  .result-main { min-width: 0; flex: 1; }
  .result-breadcrumb { font-size: 12.5px; color: var(--oe-search-url-color); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-title { font-size: 18px; color: var(--md-sys-color-primary); margin-bottom: 3px; line-height: 1.3; }
  .result-row:hover .result-title { text-decoration: underline; }
  .result-snippet { font-size: 14px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  mark { background: color-mix(in srgb, var(--md-sys-color-primary) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
  .more { display: block; margin: 14px auto; font: inherit; font-weight: 500; border: 0; border-radius: 999px; padding: 10px 24px; background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); cursor: pointer; }
  .empty-note { color: var(--md-sys-color-on-surface-variant); font-size: 14px; padding: 24px 8px; }
  .search-prompt { text-align: center; padding: 48px 8px 24px; color: var(--md-sys-color-on-surface-variant); }
  .search-prompt > .material-symbols-rounded { font-size: 40px; opacity: 0.5; margin-bottom: 12px; }
  .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 18px; text-align: left; }
  .quick a { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); text-decoration: none; font-size: 14px; border: 1px solid var(--md-sys-color-outline); }
  .quick a:hover { background: var(--md-sys-color-surface-variant); }
  .quick .material-symbols-rounded { color: var(--md-sys-color-primary); font-size: 20px; }
  .api-note { text-align: center; font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); margin-top: 28px; }
  .api-note a { color: var(--md-sys-color-primary); }
</style>
<script type="module" src="/shared/motion-global.js?v=1"></script>
</head>
<body>

<div class="page">
  <div class="search-header">
    <a class="search-logo" href="/"><svg viewBox="0 0 98 118" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M97.21 104.246C99.8214 110.812 94.9842 117.941 87.918 117.941H10.0098C2.94348 117.941 -1.89373 110.812 0.717769 104.246L24.9966 43.2019C25.2993 42.4406 26.0357 41.941 26.855 41.941H71.0728C71.892 41.941 72.6284 42.4406 72.9312 43.2019L97.21 104.246ZM39.6719 6.30428C43.0151 -2.10143 54.9127 -2.10143 58.2559 6.30428L65.3744 24.2018C65.8967 25.515 64.9293 26.941 63.516 26.941H34.4117C32.9985 26.941 32.031 25.515 32.5533 24.2018L39.6719 6.30428Z"/></svg></a>
    <form class="search-bar-wrap" id="searchForm" action="/search" method="GET" autocomplete="off">
      <span class="material-symbols-rounded">search</span>
      <input type="text" class="search-bar-input" id="searchInput" name="q" placeholder="search oeper.dev…  ( / )" autocomplete="off" enterkeyhint="search">
    </form>
  </div>
  <div class="chips" id="chips" hidden></div>
  <div id="content"></div>
  <p class="api-note">search is also an API: <a href="/search-api">use it from your own code</a></p>
</div>

<script type="module" data-cfasync="false">
import { mountTopNav } from './shared/topnav.js?v=51';
import { mountFooter } from './shared/footer.js?v=8';
import { search, quickLinks, rememberSearch, recents, highlight, escHtml, queryTerms, TYPE_META } from './shared/site-search.js?v=1';

mountTopNav();
mountFooter();

const content = document.getElementById('content'), input = document.getElementById('searchInput'), chips = document.getElementById('chips');
const params = new URLSearchParams(location.search);
let q = (params.get('q') || '').trim(), type = params.get('type') || '', offset = 0, ctrl = null, lastOriginal = '', exact = false;
const PAGE = 20;
input.value = q;

const crumb = r => 'oeper.dev › ' + (r.section ? r.section : (TYPE_META[r.type] ? TYPE_META[r.type].plural : r.type)) + (r.by ? ' › ' + r.by : '');
function rowHtml(r, terms) {
  const meta = TYPE_META[r.type] || { icon: 'article' };
  const icon = r.photo ? `<img src="${escHtml(r.photo)}" alt="" referrerpolicy="no-referrer">` : `<span class="material-symbols-rounded">${escHtml(r.icon || meta.icon)}</span>`;
  return `<a class="result-row" href="${escHtml(r.url)}"><span class="result-icon">${icon}</span><span class="result-main"><div class="result-breadcrumb">${escHtml(crumb(r))}</div><div class="result-title">${highlight(r.title, terms)}</div>${r.snippet ? `<div class="result-snippet">${highlight(r.snippet, terms)}</div>` : ''}</span></a>`;
}
function url() {
  const u = new URLSearchParams();
  if (q) u.set('q', q);
  if (type) u.set('type', type);
  return '/search' + (u.toString() ? '?' + u : '');
}
function go(newQ, newType, replace) {
  if (!replace) exact = false;
  q = newQ; type = newType || ''; input.value = q;
  history[replace ? 'replaceState' : 'pushState'](null, '', url());
  run();
}

async function home() {
  chips.hidden = true;
  const quick = await quickLinks(), rec = recents();
  content.innerHTML = `<div class="search-prompt"><span class="material-symbols-rounded">search</span><p>search pages, tools, docs, posts, videos, people and apps on oeper.dev.</p>
    ${rec.length ? `<div class="chips" style="justify-content:center;margin:16px 0 0">${rec.map(r => `<a class="chip" href="/search?q=${encodeURIComponent(r)}"><span class="material-symbols-rounded" style="font-size:16px">history</span>${escHtml(r)}</a>`).join('')}</div>` : ''}
    <div class="quick">${quick.map(r => `<a href="${escHtml(r.url)}"><span class="material-symbols-rounded">${escHtml(r.icon || 'web')}</span>${escHtml(r.title)}</a>`).join('')}</div></div>`;
}

function renderChips(data) {
  const counts = data.counts || {};
  const all = Object.values(counts).reduce((a, b) => a + b, 0);
  if (!all && !type) { chips.hidden = true; return; }
  chips.hidden = false;
  chips.innerHTML = `<button class="chip${type ? '' : ' on'}" data-type="">all <small>${all}</small></button>` +
    Object.keys(TYPE_META).filter(t => counts[t]).map(t => `<button class="chip${type === t ? ' on' : ''}" data-type="${t}">${escHtml(TYPE_META[t].plural)} <small>${counts[t]}</small></button>`).join('');
}
chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) go(q, b.dataset.type); });

async function run(more) {
  document.title = q ? `${q} — Search — oeper.dev` : 'Search — oeper.dev';
  if (!q) { offset = 0; return home(); }
  if (ctrl) ctrl.abort();
  ctrl = new AbortController();
  if (!more) { offset = 0; content.innerHTML = '<div class="empty-note">searching…</div>'; }
  let data;
  try { data = await search(q, { type, limit: PAGE, offset, exact, signal: ctrl.signal }); } catch (e) { if (e.name !== 'AbortError') content.innerHTML = '<div class="empty-note">search could not be reached. try again in a moment.</div>'; return; }
  rememberSearch(q);
  const terms = data.terms && data.terms.length ? data.terms : queryTerms(q);
  if (!more) renderChips(data);
  const list = (data.results || []).map(r => rowHtml(r, terms)).join('');
  if (more) { const old = content.querySelector('.more'); if (old) old.remove(); content.insertAdjacentHTML('beforeend', list); }
  else {
    let html = '';
    lastOriginal = data.originalQuery || '';
    if (data.corrected) html += `<div class="note">showing results for <strong>${escHtml(data.corrected)}</strong>. <a data-exact>search for ${escHtml(data.originalQuery)} instead</a></div>`;
    else if (data.didYouMean) html += `<div class="note">did you mean <a data-dym="${escHtml(data.didYouMean)}">${escHtml(data.didYouMean)}</a>?</div>`;
    if (data.offline) html += '<div class="note">search is offline right now: only pages can be found.</div>';
    html += data.total
      ? `<div class="meta">${data.total} result${data.total === 1 ? '' : 's'}${data.took ? ' · ' + data.took + ' ms' : ''}</div>` + list
      : `<div class="empty-note">nothing found for "${escHtml(q)}"${type ? ` in ${escHtml(TYPE_META[type] ? TYPE_META[type].plural : type)}` : ''}. try fewer or different words${type ? ', or <a data-all>search everything</a>' : ''}.</div>`;
    content.innerHTML = html;
  }
  offset += (data.results || []).length;
  if (data.total > offset) content.insertAdjacentHTML('beforeend', '<button class="more" type="button">show more</button>');
}
content.addEventListener('click', e => {
  if (e.target.closest('.more')) return run(true);
  const d = e.target.closest('[data-dym]'); if (d) return go(d.dataset.dym, type);
  if (e.target.closest('[data-exact]')) { exact = true; return go(lastOriginal, type, true); }
  if (e.target.closest('[data-all]')) go(q, '');
});

document.getElementById('searchForm').addEventListener('submit', e => { e.preventDefault(); go(input.value.trim(), type); input.blur(); });
document.addEventListener('keydown', e => {
  const typing = /^(input|textarea|select)$/i.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.key === '/' && !typing) || ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey))) { e.preventDefault(); input.focus(); input.select(); }
});
addEventListener('popstate', () => { const p = new URLSearchParams(location.search); q = (p.get('q') || '').trim(); type = p.get('type') || ''; input.value = q; run(); });
run();
</script>
</body>
</html>
