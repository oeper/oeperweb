<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — oeper.dev</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://oeper.dev/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="https://oeper.dev/icon.ico?v=3" type="image/x-icon">
<script src="./shared/theme-boot.js?v=16" data-cfasync="false"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Freehand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared/fonts.css?v=1">
<link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :focus { outline: none; }
  :focus-visible { outline: none; }

  :root {
    --md-sys-color-background: #111318;
    --md-sys-color-surface: #1a1c22;
    --md-sys-color-surface-variant: #2f353d;
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-on-primary: #062e6f;
    --md-sys-color-secondary-container: #33485d;
    --md-sys-color-on-secondary-container: #d2e4ff;
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c7c5;
    --md-sys-color-outline: #43474e;
    --md-sys-color-outline-variant: #8c9199;
    --md-sys-color-error: #ffb4ab;
    --oe-search-url-color: #8bc9a0;
  }

  body {
    min-height: 100vh;
    background-color: var(--md-sys-color-background);
    font-family: var(--oe-font-override, 'Google Sans', 'Roboto Flex', sans-serif);
    background-image: var(--oe-bg-image, none);
    color: var(--md-sys-color-on-surface);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page { position: relative; max-width: 680px; margin: 0 auto; padding: 40px 24px 100px; }

  .search-header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .search-logo { display: flex; align-items: center; flex-shrink: 0; color: var(--md-sys-color-primary); }
  .search-logo svg { width: 28px; height: 28px; }
  .search-bar-wrap { position: relative; flex: 1; }
  .search-bar-wrap .material-symbols-rounded {
    position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    color: var(--md-sys-color-on-surface-variant); font-size: 20px; pointer-events: none;
  }
  .search-bar-input {
    width: 100%; background: var(--md-sys-color-surface); border: none; border-radius: 100px;
    padding: 13px 18px 13px 50px; color: var(--md-sys-color-on-surface); font-family: inherit; font-size: 15px; outline: none;
  }
  .search-bar-input:focus { box-shadow: 0 0 0 2px var(--md-sys-color-primary); }

  .result-section { margin-bottom: 36px; }
  .result-section-heading {
    display: flex; align-items: center; gap: 8px; font-family: var(--oe-font-override, 'Google Sans', 'Product Sans', sans-serif);
    font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant);
    margin-bottom: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--md-sys-color-outline-variant);
  }
  .result-section-heading .material-symbols-rounded { font-size: 16px; }
  .result-note { font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin: 10px 0 4px; }

  .result-row { display: block; padding: 14px 8px; border-radius: 12px; text-decoration: none; color: inherit; }
  a.result-row:hover { background: var(--md-sys-color-hover-surface); }
  .result-breadcrumb { font-size: 13px; color: var(--oe-search-url-color); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-title { font-size: 18px; color: var(--md-sys-color-primary); margin-bottom: 4px; line-height: 1.3; }
  .result-row:hover .result-title { text-decoration: underline; }
  .result-snippet { font-size: 14px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .empty-note { color: var(--md-sys-color-on-surface-variant); font-size: 14px; padding: 24px 8px; }
  .empty-note a { color: var(--md-sys-color-primary); }

  .search-prompt { text-align: center; padding: 80px 24px; color: var(--md-sys-color-on-surface-variant); }
  .search-prompt .material-symbols-rounded { font-size: 40px; opacity: 0.5; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="page">
  <div class="search-header">
    <a class="search-logo" href="/"><svg viewBox="0 0 98 118" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M97.21 104.246C99.8214 110.812 94.9842 117.941 87.918 117.941H10.0098C2.94348 117.941 -1.89373 110.812 0.717769 104.246L24.9966 43.2019C25.2993 42.4406 26.0357 41.941 26.855 41.941H71.0728C71.892 41.941 72.6284 42.4406 72.9312 43.2019L97.21 104.246ZM39.6719 6.30428C43.0151 -2.10143 54.9127 -2.10143 58.2559 6.30428L65.3744 24.2018C65.8967 25.515 64.9293 26.941 63.516 26.941H34.4117C32.9985 26.941 32.031 25.515 32.5533 24.2018L39.6719 6.30428Z"/></svg></a>
    <div class="search-bar-wrap">
      <span class="material-symbols-rounded">search</span>
      <input type="text" class="search-bar-input" id="searchInput" placeholder="search oeper.dev and the web…" autocomplete="off">
    </div>
  </div>

  <div id="content"></div>
</div>

<script type="module" data-cfasync="false">
import { mountTopNav, HIDDEN_PAGES, hiddenPageRank } from './shared/topnav.js?v=31';
import { mountFooter } from './shared/footer.js?v=5';
import { db } from './shared/account.js?v=34';
import {
  collection, query, orderBy, limit, getDocs,
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

mountTopNav();
mountFooter();

// Fill these in to turn on the "from the web" section (see the README
// note in this repo, or ask whoever set up this site) — a Google
// Custom Search JSON API key + a Programmable Search Engine ID
// (https://programmablesearchengine.google.com, configured to search the
// entire web). Both are safe to ship in this public, static file as long
// as the API key is restricted by HTTP referrer (oeper.dev only) in
// Google Cloud Console — same trust model as the Firebase config already
// public in shared/account.js. Free tier is 100 queries/day.
const GOOGLE_SEARCH_API_KEY = '';
const GOOGLE_SEARCH_CX = '';

function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function excerpt(text, maxLen) {
  if (!text) return '';
  const t = text.trim().replace(/\s+/g, ' ');
  return t.length > maxLen ? t.slice(0, maxLen).trim() + '…' : t;
}

const content = document.getElementById('content');
const searchInput = document.getElementById('searchInput');
const params = new URLSearchParams(window.location.search);
const initialQ = params.get('q') || '';
searchInput.value = initialQ;

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim();
    history.pushState(null, '', q ? `/search?q=${encodeURIComponent(q)}` : '/search');
    runSearch(q);
  }
});

function matchRank(name, q) {
  const idx = (name || '').toLowerCase().indexOf(q);
  if (idx === -1) return -1;
  return idx === 0 ? 0 : 1;
}
function keywordRank(fields, q) {
  const words = q.split(/\s+/).filter(Boolean);
  if (!words.length) return -1;
  let phraseTier = -1;
  let hits = 0;
  fields.forEach(({ text, weight }) => {
    const hay = (text || '').toLowerCase();
    if (!hay) return;
    const tier = hay === q ? 0 : hay.startsWith(q) ? 1 : hay.includes(q) ? 2 : -1;
    if (tier !== -1) phraseTier = phraseTier === -1 ? tier : Math.min(phraseTier, tier);
    words.forEach(w => { if (hay.includes(w)) hits += weight; });
  });
  if (phraseTier !== -1) return phraseTier;
  if (hits === 0) return -1;
  return 12 - Math.min(hits, 10);
}

// Same bounded corpus approach as topnav.js's dropdown search (300 posts/
// videos/users) — an unbounded fetch doesn't stay fast as the site grows.
// This page shows more results than the dropdown (30 vs 8), but pulls
// from the same underlying slice.
let corpusPromise = null;
function loadCorpus() {
  if (!corpusPromise) {
    corpusPromise = Promise.allSettled([
      getDocs(query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(300))),
      getDocs(query(collection(db, 'videos'), orderBy('createdAt', 'desc'), limit(300))),
      getDocs(query(collection(db, 'users'), orderBy('createdAt', 'desc'), limit(300))),
    ]).then(([postsR, videosR, usersR]) => ({
      posts: postsR.status === 'fulfilled' ? postsR.value.docs.map(d => ({ id: d.id, ...d.data() })) : [],
      videos: videosR.status === 'fulfilled' ? videosR.value.docs.map(d => ({ id: d.id, ...d.data() })) : [],
      users: usersR.status === 'fulfilled' ? usersR.value.docs.map(d => ({ email: d.id, ...d.data() })) : [],
    }));
  }
  return corpusPromise;
}

async function searchOeper(qRaw) {
  const q = qRaw.trim().toLowerCase();
  const corpus = await loadCorpus();
  const results = [];

  HIDDEN_PAGES.forEach(page => {
    const rank = hiddenPageRank(page, q);
    if (rank !== -1) results.push({
      rank, breadcrumb: 'oeper.dev › ' + page.name, title: page.name,
      snippet: 'a page on oeper.dev not linked anywhere in the site — you found it by searching.',
      url: page.url,
    });
  });
  corpus.users.forEach(u => {
    if (!u.handle) return;
    const name = u.displayName || u.handle;
    const rank = Math.min(
      matchRank(name, q) === -1 ? 99 : matchRank(name, q),
      matchRank(u.handle, q) === -1 ? 99 : matchRank(u.handle, q)
    );
    if (rank < 99) results.push({
      rank, breadcrumb: `oeper.dev › profile › @${u.handle}`, title: name,
      snippet: `@${u.handle}'s profile on oeper.dev.`, url: `/profile?u=${encodeURIComponent(u.handle)}`,
    });
  });
  corpus.posts.forEach(p => {
    const rank = keywordRank([{ text: p.title, weight: 3 }, { text: p.body, weight: 1 }], q);
    if (rank !== -1) results.push({
      rank, breadcrumb: 'oeper.dev › feed', title: p.title || excerpt(p.body, 60) || '(untitled post)',
      snippet: excerpt(p.body, 180), url: `/feed?post=${p.id}`,
    });
  });
  corpus.videos.forEach(v => {
    const rank = keywordRank([{ text: v.title, weight: 3 }, { text: v.description, weight: 1 }], q);
    if (rank !== -1) results.push({
      rank, breadcrumb: 'oeper.dev › videos', title: v.title || '(untitled video)',
      snippet: excerpt(v.description, 180), url: `/videos?video=${v.id}`,
    });
  });

  results.sort((a, b) => a.rank - b.rank);
  return results.slice(0, 30);
}

async function searchWeb(qRaw) {
  if (!GOOGLE_SEARCH_API_KEY || !GOOGLE_SEARCH_CX) return { configured: false, items: [] };
  const url = `https://www.googleapis.com/customsearch/v1?key=${encodeURIComponent(GOOGLE_SEARCH_API_KEY)}&cx=${encodeURIComponent(GOOGLE_SEARCH_CX)}&q=${encodeURIComponent(qRaw)}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw new Error((data.error && data.error.message) || `HTTP ${res.status}`);
  return { configured: true, items: data.items || [] };
}

function resultRowHtml(r) {
  return `
    <a class="result-row" href="${r.url}"${r.external ? ' target="_blank" rel="noopener"' : ''}>
      <div class="result-breadcrumb">${escHtml(r.breadcrumb)}</div>
      <div class="result-title">${escHtml(r.title)}</div>
      ${r.snippet ? `<div class="result-snippet">${escHtml(r.snippet)}</div>` : ''}
    </a>
  `;
}

async function runSearch(qRaw) {
  const q = qRaw.trim();
  document.title = q ? `${q} — Search — oeper.dev` : 'Search — oeper.dev';
  if (!q) {
    content.innerHTML = `
      <div class="search-prompt">
        <span class="material-symbols-rounded">search</span>
        <p>search oeper.dev — and the web, if that's set up.</p>
      </div>
    `;
    return;
  }

  content.innerHTML = `
    <div class="result-section">
      <div class="result-section-heading"><span class="material-symbols-rounded">home</span>from oeper.dev</div>
      <div id="oeperResults" class="empty-note">searching…</div>
    </div>
    <div class="result-section">
      <div class="result-section-heading"><span class="material-symbols-rounded">public</span>from the web</div>
      <div id="webResults" class="empty-note">searching…</div>
    </div>
  `;

  searchOeper(q).then(results => {
    const el = document.getElementById('oeperResults');
    if (!el) return;
    if (!results.length) { el.innerHTML = `no oeper.dev results for "${escHtml(q)}".`; return; }
    el.outerHTML = `<div id="oeperResults">${results.map(resultRowHtml).join('')}</div>`;
  }).catch(err => {
    const el = document.getElementById('oeperResults');
    if (el) el.textContent = 'could not search oeper.dev: ' + err.message;
  });

  searchWeb(q).then(({ configured, items }) => {
    const el = document.getElementById('webResults');
    if (!el) return;
    if (!configured) {
      el.innerHTML = `web search isn't set up yet — needs a Google Custom Search API key and search engine ID.`;
      return;
    }
    if (!items.length) { el.innerHTML = `no web results for "${escHtml(q)}".`; return; }
    const rows = items.map(it => resultRowHtml({
      breadcrumb: it.displayLink || it.link, title: it.title, snippet: it.snippet, url: it.link, external: true,
    })).join('');
    el.outerHTML = `<div id="webResults">${rows}</div>`;
  }).catch(err => {
    const el = document.getElementById('webResults');
    if (el) el.textContent = 'could not search the web: ' + err.message;
  });
}

runSearch(initialQ);
</script>
</body>
</html>
